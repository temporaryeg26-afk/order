<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>TEMPORARY™ — Control</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#070908;--panel:#0c100e;--panel2:#101512;--panel3:#151b17;--line:rgba(235,242,237,.10);--line2:rgba(235,242,237,.18);--text:#eef2ee;--muted:#8e9a91;--soft:#bec7c0;--accent:#e6eee8;--ink:#09100b;--ok:#96d2ad;--warn:#d6ba7a;--danger:#dd8787;--shadow:0 30px 100px rgba(0,0,0,.45)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 18% 0%,rgba(160,194,172,.06),transparent 28%),var(--bg)}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:rgba(7,10,8,.94);padding:22px 14px;display:flex;flex-direction:column}.brand{margin:3px 7px 24px;font-size:13px;font-weight:900;letter-spacing:.18em}.brand small{display:block;margin-top:7px;color:var(--muted);font-size:9px;font-weight:500;letter-spacing:.12em}.nav{display:grid;gap:4px}.nav button{border:1px solid transparent;background:transparent;color:#aab4ad;text-align:left;padding:11px 12px;border-radius:8px;font-size:10px;letter-spacing:.10em;text-transform:uppercase}.nav button:hover{background:rgba(255,255,255,.035);color:var(--text)}.nav button.active{background:var(--accent);color:var(--ink);border-color:var(--accent)}.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:15px}.admin-mini{font-size:10px;line-height:1.55;color:var(--soft);margin:0 6px 11px;word-break:break-word}.admin-mini strong{color:var(--text)}
.main{min-width:0;padding:28px 34px 50px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.eyebrow{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}.title{font:400 45px/.95 Georgia,"Times New Roman",serif;margin:8px 0 6px}.sub{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--text);padding:10px 13px;border-radius:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.btn:hover{background:var(--panel3)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:800}.btn.danger{color:var(--danger);border-color:rgba(221,135,135,.25)}.btn.small{padding:8px 10px;font-size:9px}.btn:disabled{opacity:.45;cursor:not-allowed}
.view{display:none}.view.active{display:block}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}.metric{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel2),var(--panel));border-radius:10px;padding:15px}.metric-label{color:var(--muted);font-size:8px;letter-spacing:.15em;text-transform:uppercase}.metric-value{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:-.03em}
.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-bottom:12px}.panel{border:1px solid var(--line);background:rgba(12,16,14,.82);border-radius:10px;padding:16px}.panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.panel-title{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.panel-note{font-size:9px;color:var(--muted);margin-top:4px}.mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.mini{border:1px solid var(--line);padding:12px;border-radius:8px;background:rgba(255,255,255,.014)}.mini span{display:block;font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.13em}.mini strong{display:block;margin-top:6px;font-size:17px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select,.field input,.field select{border:1px solid var(--line);background:#090c0a;color:var(--text);border-radius:8px;padding:10px 11px;font-size:10px;outline:none}.toolbar input{min-width:260px;flex:1}.toolbar select{min-width:145px}.field label{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.14em;margin-bottom:6px}.field input,.field select{width:100%;height:38px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}.table{width:100%;min-width:840px;border-collapse:collapse;font-size:10px}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{background:rgba(255,255,255,.018);color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.13em}.table tbody tr:hover{background:rgba(255,255,255,.018)}.table tr:last-child td{border-bottom:0}.right{text-align:right!important}.primary-text{font-weight:700}.secondary-text{font-size:9px;color:var(--muted);margin-top:3px}.badge{display:inline-flex;align-items:center;padding:5px 8px;border:1px solid var(--line2);border-radius:999px;font-size:8px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.danger{color:var(--danger)}
.empty{padding:30px;text-align:center;border:1px dashed var(--line2);border-radius:8px;color:var(--muted)}.notice{padding:11px 13px;border:1px solid var(--line);background:rgba(255,255,255,.018);border-radius:8px;color:var(--soft);font-size:10px;line-height:1.6}.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:10px}.kv:last-child{border-bottom:0}.kv span{color:var(--muted)}
.drawer{position:fixed;inset:0;display:none;z-index:50}.drawer.open{display:block}.scrim{position:absolute;inset:0;background:rgba(0,0,0,.65)}.drawer-panel{position:absolute;top:0;right:0;height:100%;width:min(680px,95vw);overflow:auto;background:#090d0b;border-left:1px solid var(--line2);box-shadow:var(--shadow);padding:24px}.drawer-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}.drawer-title{font:400 35px/.95 Georgia,"Times New Roman",serif;margin-top:7px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.detail{border:1px solid var(--line);background:var(--panel);padding:12px;border-radius:8px}.detail.full{grid-column:1/-1}.detail h4{margin:0 0 7px;font-size:8px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase}.detail p{margin:0;font-size:10px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.catalog-top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);gap:12px;margin-bottom:12px}.studio{display:grid;grid-template-columns:1fr 320px;gap:12px}.studio-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:12px}.stage-wrap{border:1px solid var(--line);border-radius:9px;background:#050605;padding:12px}.stage{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;background:#0b0d0c;border-radius:5px}.stage-base,.stage-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.stage-layer{pointer-events:none}.art-layer{position:absolute;transform:translate(-50%,-50%);z-index:4;cursor:grab;transform-origin:center}.art-layer.dragging{cursor:grabbing}.art-layer img{display:block;width:100%;height:auto;pointer-events:none;user-select:none}.art-layer.comp{z-index:3;opacity:.72}.stage-tag{position:absolute;top:10px;left:10px;z-index:8;padding:7px 9px;background:rgba(0,0,0,.72);font-size:8px;letter-spacing:.12em;text-transform:uppercase}.inspector{border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:14px}.inspector .field{margin-bottom:11px}.range-row{display:grid;grid-template-columns:1fr 74px;gap:8px;align-items:end;margin-bottom:10px}.range-row input[type=range]{width:100%}.range-row input[type=number]{width:100%}.studio-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.catalog-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:grid;gap:7px}.list-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:10px}.list-row:last-child{border-bottom:0}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(500px,100%);background:linear-gradient(145deg,#0e130f,#090c0a);border:1px solid var(--line2);border-radius:14px;padding:35px;box-shadow:var(--shadow)}.login-title{font:400 58px/.90 Georgia,"Times New Roman",serif;margin:14px 0 21px}.login-note{font-size:11px;color:var(--muted);line-height:1.65}.google-slot{margin-top:20px;min-height:44px}.login-status{min-height:16px;margin-top:12px;color:var(--muted);font-size:10px}.toast{position:fixed;right:18px;bottom:18px;z-index:100;display:none;max-width:360px;background:var(--accent);color:var(--ink);padding:11px 13px;border-radius:8px;font-size:10px;box-shadow:var(--shadow)}.toast.show{display:block}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.catalog-top{grid-template-columns:1fr}.studio{grid-template-columns:1fr 300px}}
@media(max-width:780px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;font-size:9px}.side-foot{margin-top:13px}.main{padding:20px 14px 40px}.top{align-items:flex-start;flex-direction:column}.title{font-size:40px}.studio{grid-template-columns:1fr}.studio-controls{grid-template-columns:1fr 1fr}.catalog-cards{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.detail.full{grid-column:auto}}
@media(max-width:520px){.metrics{grid-template-columns:1fr 1fr}.studio-controls{grid-template-columns:1fr}.login-card{padding:26px}.login-title{font-size:47px}}
</style>
</head>
<body>
<section id="loginView" class="login">
  <div class="login-card">
    <div class="eyebrow">PRIVATE CONTROL / OWNER ACCESS</div>
    <div class="login-title">Operate the<br>archive.</div>
    <div class="login-note">Use the authorized Google account. Access is verified server-side before an admin session is created.</div>
    <div id="googleSlot" class="google-slot"></div>
    <div id="loginStatus" class="login-status">Waiting for Google sign-in…</div>
  </div>
</section>

<div id="app" class="shell hidden">
  <aside class="side">
    <div class="brand">TEMPORARY™<small>CONTROL / INTERNAL</small></div>
    <nav id="nav" class="nav"></nav>
    <div class="side-foot">
      <div id="adminMini" class="admin-mini"></div>
      <button id="logoutBtn" class="btn full">Log out</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div><div id="eyebrow" class="eyebrow">SYSTEM / OVERVIEW</div><div id="title" class="title">Dashboard</div><div id="sub" class="sub">Operational snapshot</div></div>
      <button id="refreshBtn" class="btn">Refresh</button>
    </header>
    <section id="views">
      <section id="view-dashboard" class="view active"></section>
      <section id="view-orders" class="view"></section>
      <section id="view-carts" class="view"></section>
      <section id="view-customers" class="view"></section>
      <section id="view-catalog" class="view"></section>
      <section id="view-payments" class="view"></section>
      <section id="view-audit" class="view"></section>
    </section>
  </main>
</div>

<div id="drawer" class="drawer"><div id="drawerScrim" class="scrim"></div><aside class="drawer-panel"><div class="drawer-head"><div><div class="eyebrow">ORDER DETAIL</div><div id="drawerTitle" class="drawer-title">Order</div></div><button id="drawerClose" class="btn">Close</button></div><div id="drawerBody"></div></aside></div>
<div id="toast" class="toast"></div>

<script>
/* CURRENT PRODUCTION WEB APP — do not replace with another deployment. */
const API='https://script.google.com/macros/s/AKfycbx5InYO32kfhcCo34eMeAfCK3mZhaSsJABXL0dElh_kZT-dZKICpMxhXSUmWL9jsAiK/exec';
const GOOGLE_CLIENT_ID='32171492706-n6rli6equ2e0es8ac15npdcrhctlq2bn.apps.googleusercontent.com';
const SESSION_KEY='tmp_admin_session_current';
const META_KEY='tmp_admin_meta_current';
const DEVICE_KEY='tmp_admin_device_current';
const NAV=[['dashboard','Dashboard'],['orders','Orders'],['carts','Carts'],['customers','Customers'],['catalog','Catalog'],['payments','Payments'],['audit','Audit']];
const state={token:localStorage.getItem(SESSION_KEY)||'',meta:JSON.parse(localStorage.getItem(META_KEY)||'null'),view:'dashboard',cache:{},catalog:null,publicPlacements:[]};
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(v,c='EGP')=>Number(v||0).toLocaleString('en-EG',{maximumFractionDigits:2})+' '+(c||'EGP');
const dateText=v=>{if(!v)return '—';const d=new Date(v);return isNaN(d.getTime())?String(v):d.toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})};
function deviceId(){let v=localStorage.getItem(DEVICE_KEY);if(!v){v='ADMDEV-'+crypto.randomUUID().replaceAll('-','');localStorage.setItem(DEVICE_KEY,v)}return v}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2800)}
function setLoginStatus(m){$('#loginStatus').textContent=m}
function postBridge(payload,timeout=18000){
  return new Promise((resolve,reject)=>{
    const iframe=document.createElement('iframe');iframe.name='tmpadmin_'+Date.now()+'_'+Math.random().toString(36).slice(2);iframe.style.display='none';
    const form=document.createElement('form');form.method='POST';form.action=API;form.target=iframe.name;form.style.display='none';
    const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payload);form.appendChild(input);document.body.appendChild(iframe);document.body.appendChild(form);
    const timer=setTimeout(()=>{cleanup();reject(new Error('API_TIMEOUT'))},timeout);
    function cleanup(){clearTimeout(timer);window.removeEventListener('message',onMessage);form.remove();iframe.remove()}
    function onMessage(e){const d=e.data;if(!d||d.source!=='TEMPORARY™'||d.type!=='TEMPORARY_API_RESULT')return;cleanup();const result=d.data||{};if(result.ok===false)reject(new Error(result.errorCode||result.error||'API_ERROR'));else resolve(result)}
    window.addEventListener('message',onMessage);form.submit();
  })
}
async function adminGet(section,query={}){return postBridge({action:'adminget',sessionToken:state.token,section,query})}
async function adminMutation(action,payload={}){return postBridge(Object.assign({action,sessionToken:state.token},payload))}
async function publicGet(action,payload={}){return postBridge(Object.assign({action},payload),18000)}
function saveSession(r){state.token=r.sessionToken||r.sessionId||r.adminSessionToken||'';const a=r.admin||r.viewer||{};state.meta={adminId:r.adminId||a.adminId||'',email:r.email||a.email||'',displayName:r.displayName||a.displayName||'',role:r.role||a.role||''};localStorage.setItem(SESSION_KEY,state.token);localStorage.setItem(META_KEY,JSON.stringify(state.meta))}
function clearSession(){localStorage.removeItem(SESSION_KEY);localStorage.removeItem(META_KEY);state.token='';state.meta=null}
function showAuth(){$('#loginView').classList.remove('hidden');$('#app').classList.add('hidden');initGoogle()}
function showApp(){$('#loginView').classList.add('hidden');$('#app').classList.remove('hidden');renderNav();setHeader();applyMeta()}
function applyMeta(){const a=state.meta||{};$('#adminMini').innerHTML='<strong>'+esc(a.displayName||'Admin')+'</strong><br>'+esc(a.email||'')+'<br><span style="color:var(--muted)">'+esc(a.role||'')+'</span>'}
function initGoogle(){if(!window.google?.accounts?.id){setTimeout(initGoogle,100);return}const slot=$('#googleSlot');if(slot.dataset.ready)return;slot.dataset.ready='1';google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,auto_select:true,cancel_on_tap_outside:false,callback:r=>login(r.credential)});google.accounts.id.renderButton(slot,{theme:'outline',size:'large',text:'continue_with',shape:'rectangular',width:320})}
async function login(credential){setLoginStatus('Verifying authorized account…');try{const r=await postBridge({action:'admingoogleauth',credential,deviceId:deviceId()});saveSession(r);if(!state.token)throw new Error('ADMIN_SESSION_MISSING');setLoginStatus('Access granted.');showApp();await loadView()}catch(e){setLoginStatus('Access denied · '+(e.message||e))}}
function renderNav(){$('#nav').innerHTML=NAV.map(([id,label])=>`<button class="${state.view===id?'active':''}" data-view="${id}">${label}</button>`).join('');$$('#nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view))}
function switchView(v){state.view=v;renderNav();setHeader();loadView()}
function setHeader(){const m={dashboard:['SYSTEM / OVERVIEW','Dashboard','Operational snapshot'],orders:['OPERATIONS / ORDERS','Orders','Manage the order lifecycle'],carts:['OPERATIONS / CARTS','Carts','Active and abandoned carts'],customers:['CUSTOMER RECORDS','Customers','Customer accounts and spend'],catalog:['CATALOG / PLACEMENTS','Catalog','Products, designs and placement control'],payments:['FINANCE / COD','Payments','Payment records and settlement status'],audit:['SECURITY / AUDIT','Audit','Administrative activity log']};const x=m[state.view]||m.dashboard;$('#eyebrow').textContent=x[0];$('#title').textContent=x[1];$('#sub').textContent=x[2]}
function statusBadge(v){const x=String(v||'—').toUpperCase();const cls=x.includes('CANCEL')||x.includes('FAILED')||x.includes('REJECT')?'danger':x.includes('PENDING')||x.includes('REQUEST')||x.includes('PROCESSING')?'warn':'ok';return `<span class="badge ${cls}">${esc(v||'—')}</span>`}
function metric(label,v){return `<div class="metric"><div class="metric-label">${esc(label)}</div><div class="metric-value">${esc(v==null?0:v)}</div></div>`}
function normalizeOrder(o){return Object.assign({orderId:'',orderNumber:'',customerId:'',customerName:'',email:'',phone:'',orderStatus:'',total:0,currency:'EGP',deliveryZoneId:'',deliveryFee:0,paymentMethod:'',paymentStatus:'',createdAt:'',updatedAt:''},o||{})}
function normalizePlacement(p){return Object.assign({placementId:'',productId:'',color:'',designId:'',artworkType:'',side:'',printSize:0,width:0,height:0,top:0,left:0,rotation:0,opacity:1,active:true,notes:''},p||{})}
async function loadView(){if(!state.token)return;const root=$('#view-'+state.view);root?.classList.add('loading');try{if(state.view==='dashboard'){const r=await adminGet('dashboard');state.cache.dashboard=r;renderDashboard(r)}else if(state.view==='orders'){const r=await adminGet('orders',{limit:200});state.cache.orders=r;renderOrders(r)}else if(state.view==='carts'){const r=await adminGet('carts',{limit:200});state.cache.carts=r;renderCarts(r)}else if(state.view==='customers'){const r=await adminGet('customers',{limit:200});state.cache.customers=r;renderCustomers(r)}else if(state.view==='catalog'){const r=await adminGet('catalog',{});state.cache.catalog=r;state.catalog=r;await loadPublicPlacements();renderCatalog(r)}else if(state.view==='payments'){const r=await adminGet('payments',{limit:200});state.cache.payments=r;renderPayments(r)}else if(state.view==='audit'){const r=await adminGet('audit',{limit:200});state.cache.audit=r;renderAudit(r)}}catch(e){toast(e.message||String(e));if(/AUTH|SESSION|ADMIN_ACCOUNT/.test(e.message||'')){clearSession();showAuth()}}finally{root?.classList.remove('loading')}}
async function loadPublicPlacements(){try{const r=await publicGet('placements',{});state.publicPlacements=(r.placements||[]).map(normalizePlacement)}catch(e){state.publicPlacements=[];toast('Placement data unavailable · '+e.message)}}
function recentOrders(rows){const xs=(rows||[]).slice(0,8).map(normalizeOrder);if(!xs.length)return '<div class="empty">No orders yet.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Payment</th><th class="right">Total</th></tr></thead><tbody>${xs.map(o=>`<tr><td><div class="primary-text">${esc(o.orderNumber||o.orderId)}</div><div class="secondary-text">${dateText(o.createdAt)}</div></td><td><div class="primary-text">${esc(o.customerName||'—')}</div><div class="secondary-text">${esc(o.phone||o.email||'')}</div></td><td>${statusBadge(o.orderStatus)}</td><td>${statusBadge(o.paymentStatus)}</td><td class="right">${money(o.total,o.currency)}</td></tr>`).join('')}</tbody></table></div>`}
function renderDashboard(r){const m=r.metrics||{};const sys=r.system||{};$('#view-dashboard').innerHTML=`<div class="metrics">${metric('Orders',m.orders)}${metric('Customers',m.customers)}${metric('Active carts',m.activeCarts)}${metric('Pending orders',m.pendingOrders)}${metric('Processing',m.processing)}${metric('Shipped',m.shipped)}${metric('Delivered',m.delivered)}${metric('Pending payments',m.pendingPayments)}</div><div class="grid2"><div class="panel"><div class="panel-head"><div><div class="panel-title">Order pipeline</div><div class="panel-note">Current operational state</div></div></div><div class="mini-grid"><div class="mini"><span>Orders</span><strong>${esc(m.orders||0)}</strong></div><div class="mini"><span>Pending</span><strong>${esc(m.pendingOrders||0)}</strong></div><div class="mini"><span>Processing</span><strong>${esc(m.processing||0)}</strong></div><div class="mini"><span>Delivered</span><strong>${esc(m.delivered||0)}</strong></div></div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">System</div><div class="panel-note">Live configuration</div></div></div><div class="kv"><span>Store mode</span><strong>${esc(sys.storeMode||'OPEN')}</strong></div><div class="kv"><span>Currency</span><strong>${esc(sys.currency||'EGP')}</strong></div><div class="kv"><span>COD</span><strong>${sys.codEnabled===false?'OFF':'ON'}</strong></div><div class="kv"><span>Paymob</span><strong>${sys.paymobEnabled?'ON':'OFF'}</strong></div></div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">Recent orders</div><div class="panel-note">Latest records from the live order table</div></div><span class="badge ok">${esc(m.orders||0)} TOTAL</span></div>${recentOrders(r.items||[],8)}</div>`}

let drag={on:false,x:0,y:0,l:0,t:0};$('#editLayer').addEventListener('pointerdown',e=>{if(!state.catalog)return;const rect=$('#placementStage').getBoundingClientRect();drag={on:true,x:e.clientX,y:e.clientY,l:Number($('#plLeftN').value),t:Number($('#plTopN').value)};$('#editLayer').classList.add('dragging');$('#editLayer').setPointerCapture?.(e.pointerId);e.preventDefault()});$('#editLayer').addEventListener('pointermove',e=>{if(!drag.on)return;const rect=$('#placementStage').getBoundingClientRect();const l=Math.max(0,Math.min(100,drag.l+(e.clientX-drag.x)/rect.width*100)),t=Math.max(0,Math.min(100,drag.t+(e.clientY-drag.y)/rect.height*100));$('#plLeftN').value=l.toFixed(2);$('#plLeftR').value=l;$('#plTopN').value=t.toFixed(2);$('#plTopR').value=t;apply()});['pointerup','pointercancel'].forEach(x=>$('#editLayer').addEventListener(x,()=>{drag.on=false;$('#editLayer').classList.remove('dragging')}));
$('#plReload').onclick=load;$('#plSave').onclick=async()=>{const product=products.find(x=>String(x.productId)===String(pSel.value)),color=cSel.value,type=typeSel.value,designId=type==='LOGO'?'':dSel.value,side=sideSel.value,size=type==='LOGO'?7:Number(sizeSel.value),existing=findPlacement(product.productId,color,type,designId,side,size);if(!existing){toast('No canonical placement exists for this selection.');return}const v=vals();const btn=$('#plSave');btn.disabled=true;try{const r=await adminMutation('adminsaveplacement',{placement:{placementId:existing.placementId,productId:existing.productId,color:existing.color,designId:existing.designId,artworkType:existing.artworkType,side:existing.side,printSize:existing.printSize,width:v.width,height:v.height||v.width,top:v.top,left:v.left,rotation:v.rotation,opacity:v.opacity,active:true,notes:existing.notes||''}});if(r.placement){state.publicPlacements=state.publicPlacements.map(x=>x.placementId===r.placement.placementId?normalizePlacement(r.placement):x)}toast('Placement saved');load()}catch(e){toast('Save failed · '+e.message)}finally{btn.disabled=false}};
syncColors(defaultProduct.colors?.[0]);syncType();load()}
$('#refreshBtn').onclick=loadView;$('#logoutBtn').onclick=async()=>{try{if(state.token)await adminMutation('adminlogout',{})}catch(_){}clearSession();try{google.accounts.id.disableAutoSelect()}catch(_){}showAuth()};$('#drawerClose').onclick=()=>$('#drawer').classList.remove('open');$('#drawerScrim').onclick=()=>$('#drawer').classList.remove('open');
(async function boot(){if(state.token){try{const r=await adminGet('dashboard');const a=r.viewer||{};state.meta=state.meta||{displayName:a.displayName||'',email:a.email||'',role:a.role||''};localStorage.setItem(META_KEY,JSON.stringify(state.meta));showApp();renderDashboard(r)}catch(_){clearSession();showAuth()}}else showAuth()})();
</script>
