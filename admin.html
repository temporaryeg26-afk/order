<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>TEMPORARY™ / Control</title>
<link rel="preconnect" href="https://accounts.google.com">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#070807;
  --sidebar:#090b0a;
  --panel:#0e1110;
  --panel2:#121614;
  --panel3:#171b18;
  --line:rgba(240,245,241,.10);
  --line2:rgba(240,245,241,.16);
  --text:#f3f5f2;
  --muted:#8f9a92;
  --muted2:#667169;
  --accent:#eef3ee;
  --accentText:#0a0c0b;
  --success:#88c8a4;
  --warning:#d7bc82;
  --danger:#d98787;
  --info:#9bb8d7;
  --shadow:0 24px 70px rgba(0,0,0,.35);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{font-size:13px}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}

/* APP SHELL */
.shell{min-height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr)}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px;z-index:30}
.brand{padding:4px 10px 24px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand-name{font-size:13px;font-weight:900;letter-spacing:.22em}
.brand-sub{margin-top:7px;font-size:9px;letter-spacing:.14em;color:var(--muted2);text-transform:uppercase}
.nav{display:grid;gap:4px}
.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 12px;border-radius:10px;display:flex;align-items:center;gap:11px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.active{background:#151a17;color:var(--text)}
.nav-icon{width:18px;text-align:center;font-size:11px;opacity:.8}
.sidebar-bottom{margin-top:auto;padding:14px 10px 2px;border-top:1px solid var(--line)}
.operator{font-size:10px;color:var(--muted);line-height:1.45}
.logout{margin-top:10px;width:100%;border:1px solid var(--line);background:transparent;color:var(--text);padding:10px 12px;border-radius:10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.logout:hover{background:var(--panel2)}

.main{grid-column:2;min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(7,8,7,.90);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.top-left{display:flex;align-items:center;gap:14px;min-width:0}
.eyebrow{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2)}
.top-title{font-size:18px;font-weight:650;margin-top:3px}
.top-right{display:flex;align-items:center;gap:12px}
.status-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);padding:8px 10px;border-radius:999px;color:var(--muted);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(136,200,164,.10)}

.content{padding:28px;max-width:1550px;margin:0 auto}
.view{display:none}.view.active{display:block}
.page-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}
.page-head h1{font-size:38px;letter-spacing:-.035em;margin:4px 0 0;font-weight:500}
.page-head p{margin:7px 0 0;color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* BUTTONS / FORMS */
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--text);padding:10px 12px;border-radius:9px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.success{color:var(--success)}
.input,.select{width:100%;border:1px solid var(--line2);background:#0a0d0b;color:var(--text);padding:11px 12px;border-radius:9px;outline:none}
.input:focus,.select:focus{border-color:rgba(238,243,238,.32)}
.field{display:grid;gap:6px}
.field label{font-size:8px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted2)}

/* CARDS */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:var(--shadow)}
.kpi-label{font-size:8px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted2)}
.kpi-value{font-size:32px;letter-spacing:-.04em;margin-top:10px;font-weight:600}
.kpi-meta{margin-top:8px;color:var(--muted);font-size:10px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.panel-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;align-items:center}
.panel-title{font-size:13px;font-weight:650}
.panel-sub{margin-top:4px;color:var(--muted);font-size:10px}
.panel-body{padding:18px}

/* TABLES */
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{border-bottom:1px solid var(--line);padding:13px 15px;text-align:left;vertical-align:middle}
th{font-size:8px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted2);font-weight:700;white-space:nowrap}
td{font-size:11px}
tbody tr:hover{background:rgba(255,255,255,.018)}
tbody tr:last-child td{border-bottom:0}
.primary-text{font-weight:650}
.secondary-text{margin-top:4px;color:var(--muted);font-size:10px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}
.amount{font-weight:650;white-space:nowrap}

/* STATUS */
.badge{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;padding:5px 8px;font-size:8px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.badge.pending{color:var(--warning)}
.badge.confirmed{color:var(--info)}
.badge.processing{color:var(--warning)}
.badge.shipped{color:var(--info)}
.badge.delivered,.badge.paid{color:var(--success)}
.badge.canceled,.badge.failed,.badge.expired{color:var(--danger)}
.badge.neutral{color:var(--muted)}
.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.action-select{min-width:120px;border:1px solid var(--line2);background:#0a0d0b;color:var(--text);padding:8px 9px;border-radius:8px;font-size:9px}

/* TOOLBAR */
.toolbar{display:flex;gap:9px;justify-content:space-between;align-items:end;flex-wrap:wrap;padding:15px 18px;border-bottom:1px solid var(--line)}
.search{min-width:280px;flex:1}
.toolbar-right{display:flex;gap:8px;align-items:center}
.count{font-size:10px;color:var(--muted)}

/* DASHBOARD */
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.65fr);gap:14px}
.side-stack{display:grid;gap:14px}
.system-list{display:grid;gap:0}
.system-row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}
.system-row:last-child{border-bottom:0}
.system-key{color:var(--muted);font-size:10px}.system-value{font-weight:600;font-size:10px}

/* DRAWER */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.50);opacity:0;pointer-events:none;transition:.18s;z-index:80}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,100vw);background:#0b0e0c;border-left:1px solid var(--line2);transform:translateX(100%);transition:.22s;z-index:90;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.drawer-title{font-size:18px;font-weight:650}.drawer-sub{margin-top:5px;color:var(--muted);font-size:10px}
.drawer-body{padding:20px;overflow:auto}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.detail-label{font-size:8px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted2)}
.detail-value{margin-top:6px;font-size:12px;word-break:break-word}
.notice{margin-top:14px;padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;color:var(--muted);font-size:10px;line-height:1.55}

/* CATALOG */
.catalog-toolbar{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:18px}
.placement-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(330px,.8fr);gap:14px;padding:0 18px 18px}
.stage-wrap{border:1px solid var(--line);background:#050505;border-radius:12px;padding:12px}
.stage{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;background:#111;border-radius:8px}
.stage img.base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.layer{position:absolute;transform:translate(-50%,-50%);z-index:3;transform-origin:center center;user-select:none;touch-action:none;pointer-events:auto}
.layer img{width:100%;height:auto;object-fit:contain;display:block;filter:drop-shadow(0 2px 7px rgba(0,0,0,.18));pointer-events:none;-webkit-user-drag:none}
.layer.selected{outline:1px dashed rgba(220,231,223,.9);outline-offset:5px}
.layer.complementary{z-index:2;opacity:.68}
.stage-tag{position:absolute;left:10px;top:10px;z-index:5;padding:6px 8px;background:rgba(0,0,0,.72);font-size:8px;letter-spacing:.11em;text-transform:uppercase;border-radius:6px}
.editor{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:17px}
.editor h3{margin:0;font-size:13px}.editor p{margin:7px 0 18px;color:var(--muted);font-size:10px;line-height:1.5}
.control-row{display:grid;grid-template-columns:1fr 82px;gap:9px;align-items:center;margin-bottom:12px}
.control-row input[type=range]{width:100%}
.range-number{width:100%;padding:8px;border:1px solid var(--line2);background:#090b0a;color:var(--text);border-radius:8px}
.editor-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.editor-info{margin-top:12px;color:var(--muted);font-size:9px;line-height:1.55}

/* LOGIN */
.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 25% 0%,rgba(150,180,160,.08),transparent 34%),var(--bg)}
.login-card{width:min(520px,100%);border:1px solid var(--line);background:rgba(14,17,16,.92);border-radius:16px;padding:36px;box-shadow:0 40px 120px rgba(0,0,0,.48)}
.login-card h1{font-family:Georgia,serif;font-size:58px;line-height:.93;font-weight:400;letter-spacing:-.03em;margin:16px 0 22px}
.login-kicker{font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted2)}
.login-copy{font-size:12px;line-height:1.65;color:var(--muted)}
.google-slot{margin-top:22px;min-height:44px}
.login-error{min-height:18px;margin-top:12px;color:var(--danger);font-size:10px}

/* EMPTY / LOADING */
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.15);border-top-color:rgba(255,255,255,.8);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);padding:11px 14px;border:1px solid var(--line2);background:#111512;color:var(--text);border-radius:10px;font-size:10px;opacity:0;pointer-events:none;transition:.18s;z-index:120;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:1100px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .dashboard-grid,.placement-layout{grid-template-columns:1fr}
  .catalog-toolbar{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:780px){
  .shell{display:block}.sidebar{position:sticky;top:0;width:100%;height:auto;display:block;padding:10px 12px;background:rgba(9,11,10,.96);border-right:0;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px;margin-bottom:8px}.brand-sub{margin:0}
  .nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 10px}
  .sidebar-bottom{display:none}.main{display:block}.topbar{height:62px;padding:0 14px}.content{padding:18px 14px}.page-head{display:block}.actions{margin-top:14px}.kpis{grid-template-columns:1fr 1fr}.catalog-toolbar{grid-template-columns:1fr 1fr}.search{min-width:220px}
}
@media(max-width:520px){
  .kpis{grid-template-columns:1fr}.page-head h1{font-size:31px}.catalog-toolbar{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.top-right .status-pill{display:none}
}
</style>
</head>
<body>
<div id="loginView" class="login-shell">
  <div class="login-card">
    <div class="login-kicker">PRIVATE CONTROL / OWNER ACCESS</div>
    <h1>Operate the archive.</h1>
    <div class="login-copy">Sign in with the Google account listed as ACTIVE in ADMIN_USERS. All permissions and mutations remain enforced by the Apps Script backend.</div>
    <div class="google-slot" id="googleSlot"></div>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<div id="app" class="shell" style="display:none">
  <aside class="sidebar">
    <div class="brand">
      <div>
        <div class="brand-name">TEMPORARY™</div>
        <div class="brand-sub">CONTROL / V1</div>
      </div>
      <div class="brand-sub">PRIVATE</div>
    </div>
    <nav id="nav" class="nav">
      <button data-section="dashboard" class="active"><span class="nav-icon">◈</span>Dashboard</button>
      <button data-section="orders"><span class="nav-icon">▤</span>Orders</button>
      <button data-section="carts"><span class="nav-icon">◫</span>Carts</button>
      <button data-section="customers"><span class="nav-icon">◎</span>Customers</button>
      <button data-section="catalog"><span class="nav-icon">◌</span>Catalog</button>
      <button data-section="payments"><span class="nav-icon">◇</span>Payments</button>
      <button data-section="audit"><span class="nav-icon">≡</span>Audit</button>
    </nav>
    <div class="sidebar-bottom">
      <div id="operator" class="operator">AUTHENTICATED ADMIN</div>
      <button id="logout" class="logout">Logout</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <div>
          <div id="topEyebrow" class="eyebrow">CONTROL CENTER</div>
          <div id="topTitle" class="top-title">Dashboard</div>
        </div>
      </div>
      <div class="top-right">
        <div class="status-pill"><span class="status-dot"></span><span id="topStatus">SECURE ADMIN ACCESS</span></div>
      </div>
    </header>

    <div class="content">
      <section id="view-dashboard" class="view active"></section>
      <section id="view-orders" class="view"></section>
      <section id="view-carts" class="view"></section>
      <section id="view-customers" class="view"></section>
      <section id="view-catalog" class="view"></section>
      <section id="view-payments" class="view"></section>
      <section id="view-audit" class="view"></section>
    </div>
  </main>
</div>

<div id="drawerBackdrop" class="drawer-backdrop"></div>
<aside id="drawer" class="drawer">
  <div class="drawer-head">
    <div><div id="drawerTitle" class="drawer-title">Order</div><div id="drawerSub" class="drawer-sub"></div></div>
    <button id="drawerClose" class="btn ghost">Close</button>
  </div>
  <div id="drawerBody" class="drawer-body"></div>
</aside>
<div id="toast"></div>

<script>
const API='https://script.google.com/macros/s/AKfycbx5InYO32kfhcCo34eMe8AfCK3mZhaSsJABXL0dElh_kZT-dZKICpMxhXSUmWL9jsAiK/exec';
const CLIENT_ID='32171492706-n6rli6equ2e0es8ac15npdcrhctlq2bn.apps.googleusercontent.com';
const SESSION_KEY='temporary_v1_admin_session';
const DEVICE_KEY='temporary_v1_admin_device';
const state={token:localStorage.getItem(SESSION_KEY)||'',admin:null,section:'dashboard',catalog:null,orders:[],payments:[]};

function $(s,root=document){return root.querySelector(s)}
function $$(s,root=document){return Array.from(root.querySelectorAll(s))}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v,c='EGP'){return new Intl.NumberFormat('en-EG',{maximumFractionDigits:2}).format(Number(v||0))+' '+c}
function fmtDate(v){if(!v)return '—';const d=new Date(v);if(isNaN(d.getTime()))return String(v);return d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function shortId(v){const s=String(v||'');return s.length>20?s.slice(0,8)+'…'+s.slice(-8):s}
function deviceId(){let v=localStorage.getItem(DEVICE_KEY);if(!v){v='adm-'+crypto.randomUUID();localStorage.setItem(DEVICE_KEY,v)}return v}
function statusClass(s){return String(s||'').trim().toLowerCase().replace(/[^a-z]/g,'')}
function badge(s,extra=''){return `<span class="badge ${statusClass(s)||'neutral'} ${extra}">${esc(s||'—')}</span>`}
function pageHead(label,title,sub,actions=''){return `<div class="page-head"><div><div class="eyebrow">${esc(label)}</div><h1>${esc(title)}</h1><p>${esc(sub||'')}</p></div><div class="actions">${actions}</div></div>`}
function panel(title,sub,body,headRight=''){return `<section class="panel"><div class="panel-head"><div><div class="panel-title">${esc(title)}</div>${sub?`<div class="panel-sub">${esc(sub)}</div>`:''}</div><div>${headRight}</div></div><div>${body}</div></section>`}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast._tm);showToast._tm=setTimeout(()=>t.classList.remove('show'),2200)}

async function api(action,payload={},timeout=18000){
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),timeout);
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},payload)),signal:c.signal,cache:'no-store'});
    let j;try{j=await r.json()}catch(_){throw new Error('INVALID_API_RESPONSE')}
    if(j.ok===false)throw new Error(j.errorCode||j.error||'API_ERROR');
    return j;
  }finally{clearTimeout(tm)}
}

function initGoogle(){
  if(!window.google?.accounts?.id){setTimeout(initGoogle,80);return}
  google.accounts.id.initialize({client_id:CLIENT_ID,auto_select:true,use_fedcm_for_button:true,button_auto_select:true,cancel_on_tap_outside:false,callback:r=>loginCredential(r.credential)});
  google.accounts.id.renderButton($('#googleSlot'),{theme:'outline',size:'large',text:'continue_with',shape:'pill',width:320});
  try{google.accounts.id.prompt()}catch(_){}
}

async function loginCredential(credential){
  $('#loginError').textContent='VERIFYING GOOGLE ACCOUNT…';
  try{
    const r=await api('admingoogleauth',{credential,deviceId:deviceId()});
    state.token=r.sessionToken;state.admin=r.admin;localStorage.setItem(SESSION_KEY,state.token);
    google.accounts.id.disableAutoSelect?.();
    enterApp();
    await loadSection('dashboard');
  }catch(e){$('#loginError').textContent='ADMIN LOGIN FAILED · '+String(e.message||e)}
}

function enterApp(){
  $('#loginView').style.display='none';$('#app').style.display='grid';
  $('#topStatus').textContent=(state.admin?.role||'ADMIN')+' / AUTHENTICATED';
  $('#operator').innerHTML=`<strong>${esc(state.admin?.displayName||'ADMIN')}</strong><br>${esc(state.admin?.role||'ADMIN')}`;
}

function clearSession(){localStorage.removeItem(SESSION_KEY);state.token='';state.admin=null}

async function restoreSession(){
  if(!state.token)return false;
  try{
    const r=await api('adminget',{sessionToken:state.token,section:'dashboard',query:{limit:1}},12000);
    state.admin=r.viewer||state.admin;enterApp();return true;
  }catch(_){clearSession();return false}
}

function setSection(section){
  state.section=section;
  $$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.section===section));
  $$('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+section));
  const names={dashboard:['CONTROL CENTER','Dashboard'],orders:['ORDERS','Orders'],carts:['CARTS','Carts'],customers:['CUSTOMERS','Customers'],catalog:['CATALOG','Catalog'],payments:['PAYMENTS','Payments'],audit:['AUDIT','Audit']};
  const pair=names[section]||['CONTROL CENTER',section];$('#topEyebrow').textContent=pair[0];$('#topTitle').textContent=pair[1];
}

async function loadSection(section,query={}){
  setSection(section);
  const root=$('#view-'+section);root.innerHTML=`<div class="empty"><span class="spinner"></span>Loading ${esc(section)}…</div>`;
  try{
    const r=await api('adminget',{sessionToken:state.token,section,query});
    if(section==='dashboard')renderDashboard(r);
    if(section==='orders'){state.orders=r.items||[];renderOrders(r)}

function renderPayments(r){
  const items=r.items||[];
  $('#view-payments').innerHTML=pageHead('PAYMENTS','Payments','COD payment records and settlement status.',`<button class="btn" id="refreshPayments">Refresh</button>`) + panel('Payment records',`${r.total??items.length} records`,items.length?`<div class="table-wrap"><table><thead><tr><th>Payment</th><th>Order</th><th>Method</th><th>Status</th><th>Amount</th><th>Created</th><th></th></tr></thead><tbody>${items.map(p=>`<tr><td><div class="mono">${esc(shortId(p.paymentId))}</div></td><td><div class="mono">${esc(shortId(p.orderId))}</div></td><td>${esc(p.paymentMethod||'—')}</td><td>${badge(p.paymentStatus)}</td><td class="amount">${money(p.amount,p.currency)}</td><td>${fmtDate(p.createdAt)}</td><td>${String(p.paymentMethod).toUpperCase()==='COD'&&String(p.paymentStatus).toUpperCase()==='PENDING'?`<button class="btn success" data-pay-paid="${esc(p.paymentId)}">Mark COD paid</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No payment records.</div>`);
  $('#refreshPayments')?.addEventListener('click',()=>loadSection('payments'));
  $$('[data-pay-paid]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('admintransitionpaymentstatus',{sessionToken:state.token,paymentId:b.dataset.payPaid,nextStatus:'PAID'});showToast('Payment marked paid');await loadSection('payments')}catch(e){showToast('PAYMENT UPDATE FAILED · '+(e.message||e))}finally{b.disabled=false}});
}

function renderAudit(r){
  const items=r.items||[];
  $('#view-audit').innerHTML=pageHead('AUDIT','Audit log','Administrative and system activity.',`<button class="btn" id="refreshAudit">Refresh</button>`) + panel('Activity',`${r.total??items.length} records`,items.length?`<div class="table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody>${items.map(a=>`<tr><td>${fmtDate(a.createdAt)}</td><td><div class="primary-text">${esc(a.actorType||'—')}</div><div class="secondary-text mono">${esc(shortId(a.actorId))}</div></td><td>${esc(a.action||'—')}</td><td>${esc(a.entityType||'—')}<div class="secondary-text mono">${esc(shortId(a.entityId))}</div></td><td><div class="mono" style="white-space:pre-wrap">${esc(a.details||'—')}</div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No audit events.</div>`);
  $('#refreshAudit')?.addEventListener('click',()=>loadSection('audit'));
}

function debounce(fn,ms){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms)}}

$$('#nav button').forEach(b=>b.addEventListener('click',()=>loadSection(b.dataset.section)));
$('#drawerClose').onclick=()=>closeDrawer();$('#drawerBackdrop').onclick=()=>closeDrawer();
function closeDrawer(){$('#drawer').classList.remove('open');$('#drawerBackdrop').classList.remove('open')}
$('#logout').onclick=async()=>{try{if(state.token)await api('adminlogout',{sessionToken:state.token})}catch(_){}clearSession();try{google.accounts.id.disableAutoSelect()}catch(_){}location.reload()}

(async function boot(){
  initGoogle();
  const restored=await restoreSession();
  if(restored){await loadSection('dashboard')} 
})();
</script>
</body>
</html>
