<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEMPORARY™ CONTROL — SYSTEM ARCHIVE</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #050505;
      --panel: #0d0d0d;
      --border: #1f1f1f;
      --text: #eaeaea;
      --muted: #666;
      --accent: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Space Grotesk', sans-serif; display: flex; height: 100vh; overflow: hidden;
    }
    aside {
      width: 260px; border-right: 1px solid var(--border); background: var(--panel);
      display: flex; flex-direction: column; padding: 1.5rem;
    }
    .brand { font-family: 'Syne', sans-serif; font-size: 1.2rem; margin-bottom: 2rem; }
    nav button {
      background: none; border: none; color: var(--muted); width: 100%; text-align: left;
      padding: 0.75rem; font-family: inherit; font-size: 0.9rem; cursor: pointer;
      text-transform: uppercase; letter-spacing: 0.05em; transition: color 0.2s;
    }
    nav button.active, nav button:hover { color: var(--accent); }
    main { flex: 1; padding: 2rem; overflow-y: auto; }
    .panel { background: var(--panel); border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1.5rem; }
    .grid-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .metric-card { background: var(--bg); border: 1px solid var(--border); padding: 1.2rem; }
    .metric-val { font-size: 2rem; font-family: 'Syne', sans-serif; margin-top: 0.5rem; }
    
    /* Placement Editor */
    .editor-layout { display: grid; grid-template-columns: 450px 1fr; gap: 2rem; }
    .editor-canvas-box {
      width: 450px; height: 450px; background: #141414; border: 1px solid var(--border);
      position: relative; overflow: hidden;
    }
    .editor-base { width: 100%; height: 100%; object-fit: contain; }
    .editor-art { position: absolute; pointer-events: none; }
    .slider-group { margin-bottom: 1rem; }
    .slider-group label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 0.3rem; }
    .slider-group input { width: 100%; }
    select, input[type="text"] {
      width: 100%; padding: 0.6rem; background: var(--bg); border: 1px solid var(--border);
      color: #fff; margin-bottom: 1rem; font-family: inherit;
    }
    .btn-save {
      background: #fff; color: #000; padding: 0.8rem; border: none;
      font-weight: 700; width: 100%; cursor: pointer; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">TEMPORARY™ ARCHIVE</div>
    <nav>
      <button class="active" onclick="showTab('dashboard')">Dashboard</button>
      <button onclick="showTab('placements')">Placement Editor</button>
      <button onclick="showTab('inventory')">Inventory</button>
    </nav>
    <div style="margin-top: auto;">
      <div id="admin-identity" style="font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem;">Not Logged In</div>
      <div id="google-login"></div>
    </div>
  </aside>

  <main id="main-view">
    <div id="tab-dashboard" class="panel">
      <h2>Operational Metrics</h2>
      <div class="grid-metrics" id="metrics-container" style="margin-top: 1rem;">Loading...</div>
    </div>

    <div id="tab-placements" class="panel" style="display: none;">
      <h2>Visual Placement Editor</h2>
      <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Configure physical print mappings on garments.</p>
      <div class="editor-layout">
        <div class="editor-canvas-box" id="placement-canvas">
          <img id="pe-base" class="editor-base" src="" alt="Mockup">
          <img id="pe-art" class="editor-art" src="" alt="Artwork">
        </div>
        <div class="controls-panel">
          <label>Product</label>
          <select id="pe-product" onchange="onEditorProductChange()"></select>

          <label>Artwork Type</label>
          <select id="pe-artwork-type" onchange="onEditorArtworkTypeChange()">
            <option value="DESIGN">DESIGN</option>
            <option value="LOGO">LOGO</option>
          </select>

          <div id="pe-design-group">
            <label>Design</label>
            <select id="pe-design" onchange="syncCanvasArtwork()"></select>
          </div>

          <label>Garment Side</label>
          <select id="pe-side" onchange="syncCanvasArtwork()">
            <option value="FRONT">FRONT</option>
            <option value="BACK">BACK</option>
          </select>

          <div id="pe-size-group">
            <label>Print Size (CM)</label>
            <select id="pe-size" onchange="syncCanvasArtwork()">
              <option value="20">20 × 20 CM</option>
              <option value="30">30 × 30 CM</option>
            </select>
          </div>

          <div class="slider-group">
            <label><span>Width (%)</span><span id="lbl-w">10</span></label>
            <input type="range" id="sl-w" min="1" max="80" step="0.1" value="10" oninput="applyPlacementStyles()">
          </div>
          <div class="slider-group">
            <label><span>Top (%)</span><span id="lbl-t">25</span></label>
            <input type="range" id="sl-t" min="0" max="100" step="0.5" value="25" oninput="applyPlacementStyles()">
          </div>
          <div class="slider-group">
            <label><span>Left (%)</span><span id="lbl-l">25</span></label>
            <input type="range" id="sl-l" min="0" max="100" step="0.5" value="25" oninput="applyPlacementStyles()">
          </div>
          <div class="slider-group">
            <label><span>Rotation (deg)</span><span id="lbl-r">0</span></label>
            <input type="range" id="sl-r" min="-180" max="180" step="1" value="0" oninput="applyPlacementStyles()">
          </div>
          <div class="slider-group">
            <label><span>Opacity</span><span id="lbl-o">1</span></label>
            <input type="range" id="sl-o" min="0" max="1" step="0.05" value="1" oninput="applyPlacementStyles()">
          </div>

          <button class="btn-save" onclick="savePlacementConfig()">Save Placement to DB</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API_BASE_URL = "https://script.google.com/macros/s/AKfycbzEenC4vaWKhCag_hIpMcNLstegN4WoWG8VWlwSz697LKa3XPLxbzZKjIPHIKznjP1W/exec";
    const GOOGLE_CLIENT_ID = "CONFIG_PLACEHOLDER_GOOGLE_CLIENT_ID.apps.googleusercontent.com";

    let adminState = {
      adminToken: localStorage.getItem("tmp_adm_token") || null,
      catalog: null
    };

    window.onload = function() {
      if (window.google) {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: onAdminGoogleAuth
        });
        if (!adminState.adminToken) {
          google.accounts.id.renderButton(document.getElementById("google-login"), { theme: "outline", size: "small" });
        }
      }
      loadCatalog();
      if (adminState.adminToken) loadDashboard();
    };

    function onAdminGoogleAuth(res) {
      postBridge("adminGoogleAuth", { idToken: res.credential }, (data) => {
        if (data.ok) {
          adminState.adminToken = data.data.rawSessionToken;
          localStorage.setItem("tmp_adm_token", adminState.adminToken);
          document.getElementById("admin-identity").innerText = `${data.data.email} (${data.data.role})`;
          document.getElementById("google-login").style.display = "none";
          loadDashboard();
        } else {
          alert(data.message || "Admin Auth Denied");
        }
      });
    }

    function loadCatalog() {
      const s = document.createElement("script");
      s.src = API_BASE_URL + "?action=catalog&callback=onAdminCatalog";
      document.body.appendChild(s);
    }

    window.onAdminCatalog = function(res) {
      if (res.ok) {
        adminState.catalog = res.data;
        populatePlacementSelectors();
      }
    };

    function loadDashboard() {
      postBridge("adminDashboard", { adminToken: adminState.adminToken }, (res) => {
        if (res.ok) {
          const d = res.data;
          document.getElementById("metrics-container").innerHTML = `
            <div class="metric-card"><div style="color:var(--muted)">Pending Orders</div><div class="metric-val">${d.pendingOrders}</div></div>
            <div class="metric-card"><div style="color:var(--muted)">Active Carts</div><div class="metric-val">${d.activeCarts}</div></div>
            <div class="metric-card"><div style="color:var(--muted)">Abandoned Carts</div><div class="metric-val">${d.abandonedCarts}</div></div>
            <div class="metric-card"><div style="color:var(--muted)">Low Stock Items</div><div class="metric-val">${d.lowStockCount}</div></div>
          `;
        }
      });
    }

    function populatePlacementSelectors() {
      const pSel = document.getElementById("pe-product");
      pSel.innerHTML = "";
      adminState.catalog.products.forEach(p => {
        pSel.innerHTML += `<option value="${p.productId}">${p.productName}</option>`;
      });

      const dSel = document.getElementById("pe-design");
      dSel.innerHTML = "";
      adminState.catalog.designs.forEach(d => {
        dSel.innerHTML += `<option value="${d.designId}">${d.designName}</option>`;
      });

      onEditorProductChange();
    }

    function onEditorProductChange() {
      const pId = document.getElementById("pe-product").value;
      const product = adminState.catalog.products.find(p => p.productId === pId);
      if (product && product.assets.length > 0) {
        document.getElementById("pe-base").src = product.assets[0].assetUrl;
      }
      syncCanvasArtwork();
    }

    function onEditorArtworkTypeChange() {
      const isLogo = document.getElementById("pe-artwork-type").value === "LOGO";
      document.getElementById("pe-design-group").style.display = isLogo ? "none" : "block";
      document.getElementById("pe-size-group").style.display = isLogo ? "none" : "block";
      syncCanvasArtwork();
    }

    function syncCanvasArtwork() {
      const isLogo = document.getElementById("pe-artwork-type").value === "LOGO";
      const artEl = document.getElementById("pe-art");

      if (isLogo) {
        artEl.src = adminState.catalog.logoAssets[0].assetUrl;
      } else {
        const dId = document.getElementById("pe-design").value;
        const d = adminState.catalog.designs.find(x => x.designId === dId);
        if (d && d.assets.length > 0) artEl.src = d.assets[0].assetUrl;
      }
      applyPlacementStyles();
    }

    function applyPlacementStyles() {
      const w = document.getElementById("sl-w").value;
      const t = document.getElementById("sl-t").value;
      const l = document.getElementById("sl-l").value;
      const r = document.getElementById("sl-r").value;
      const o = document.getElementById("sl-o").value;

      document.getElementById("lbl-w").innerText = w;
      document.getElementById("lbl-t").innerText = t;
      document.getElementById("lbl-l").innerText = l;
      document.getElementById("lbl-r").innerText = r;
      document.getElementById("lbl-o").innerText = o;

      const art = document.getElementById("pe-art");
      art.style.width = w + "%";
      art.style.top = t + "%";
      art.style.left = l + "%";
      art.style.transform = `rotate(${r}deg)`;
      art.style.opacity = o;
    }

    function savePlacementConfig() {
      if (!adminState.adminToken) return alert("Admin Login Required");

      const isLogo = document.getElementById("pe-artwork-type").value === "LOGO";
      const payload = {
        productId: document.getElementById("pe-product").value,
        artworkType: isLogo ? "LOGO" : "DESIGN",
        designId: isLogo ? "" : document.getElementById("pe-design").value,
        side: document.getElementById("pe-side").value,
        printSize: isLogo ? 7 : parseInt(document.getElementById("pe-size").value, 10),
        width: parseFloat(document.getElementById("sl-w").value),
        height: parseFloat(document.getElementById("sl-w").value),
        top: parseFloat(document.getElementById("sl-t").value),
        left: parseFloat(document.getElementById("sl-l").value),
        rotation: parseFloat(document.getElementById("sl-r").value),
        opacity: parseFloat(document.getElementById("sl-o").value)
      };

      postBridge("adminSavePlacement", { adminToken: adminState.adminToken, placement: payload }, (res) => {
        if (res.ok) {
          alert("Placement Saved to Database Successfully.");
        } else {
          alert(res.message || "Failed to save placement.");
        }
      });
    }

    function postBridge(action, data, cb) {
      data.action = action;
      fetch(API_BASE_URL, {
        method: "POST",
        mode: "cors",
        body: JSON.stringify(data)
      })
      .then(r => r.json())
      .then(cb)
      .catch(e => console.error(e));
    }

    function showTab(tabId) {
      document.getElementById("tab-dashboard").style.display = tabId === "dashboard" ? "block" : "none";
      document.getElementById("tab-placements").style.display = tabId === "placements" ? "block" : "none";
      document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
    }
  </script>
</body>
</html>
