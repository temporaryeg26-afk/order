<style>
:root{--bg:#080808;--panel:#101010;--panel2:#171717;--panel3:#1f1f1f;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.17);--text:#f5f2eb;--muted:#979797;--accent:#ff7a18;--green:#35d07f;--red:#ff4d4d;--yellow:#ffd24d;--blue:#63b4ff;--shadow:0 25px 80px rgba(0,0,0,.4);--r:18px;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}body{min-height:100svh;overflow-x:hidden}button,input,select,textarea{font:inherit;color:inherit}button{border:0;background:none}a{color:inherit;text-decoration:none}input,select,textarea{background:#0d0d0d;border:1px solid var(--line);border-radius:12px;min-height:44px;padding:10px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,24,.1)}textarea{min-height:110px;resize:vertical}.mono{font-family:"Courier New",monospace;letter-spacing:.08em}.small{font-size:11px;color:var(--muted)}.muted{color:var(--muted)}.hidden{display:none!important}
/* shell */
#loginGate{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% -10%,rgba(255,122,24,.15),transparent 38%),#080808}.login-card{width:min(560px,100%);border:1px solid var(--line);background:linear-gradient(180deg,#101010,#0c0c0c);padding:42px;border-radius:28px;box-shadow:var(--shadow);text-align:center}.brand-mark{font-weight:900;letter-spacing:.18em;font-size:13px}.login-title{font-family:Georgia,serif;font-size:clamp(48px,9vw,80px);letter-spacing:-.06em;margin:18px 0}.login-sub{color:var(--muted);line-height:1.6;margin:0 auto 28px;max-width:430px}.login-status{margin-top:18px;min-height:18px;font:11px "Courier New",monospace;color:var(--muted)}#googleButton{display:flex;justify-content:center}
#app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100svh}.sidebar{position:sticky;top:0;height:100svh;background:#0b0b0b;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;z-index:20}.side-top{padding:4px 6px 18px;border-bottom:1px solid var(--line)}.side-brand{font-weight:900;letter-spacing:.16em;font-size:11px}.side-sub{font-size:9px;color:var(--muted);letter-spacing:.16em;margin-top:6px}.side-nav{padding:14px 0;overflow:auto}.nav-group{margin:12px 0 8px 8px;color:#5f5f5f;font-size:9px;letter-spacing:.16em;text-transform:uppercase}.nav-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid transparent;border-radius:11px;padding:10px 10px;margin:2px 0;color:#aaa;text-align:left;cursor:pointer;transition:.2s var(--ease)}.nav-btn:hover{background:#111;color:#fff}.nav-btn.active{background:#181818;border-color:var(--line2);color:#fff}.nav-left{display:flex;align-items:center;gap:10px}.nav-icon{width:18px;text-align:center;opacity:.8}.badge{min-width:18px;height:18px;border-radius:999px;display:inline-grid;place-items:center;padding:0 5px;background:var(--accent);color:#160b04;font:800 9px Arial}.side-foot{margin-top:auto;padding:12px 4px 2px;border-top:1px solid var(--line)}.admin-mini{display:flex;align-items:center;gap:9px}.avatar{width:32px;height:32px;border-radius:50%;background:#202020;display:grid;place-items:center;font-size:12px}.admin-name{font-size:11px}.admin-role{font-size:9px;color:var(--muted);margin-top:2px}.logout{margin-left:auto;color:#777;cursor:pointer}
.main{min-width:0}.topbar{height:70px;position:sticky;top:0;z-index:10;background:rgba(8,8,8,.87);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 20px}.mobile-menu{display:none}.global-search{flex:1;max-width:520px}.global-search input{width:100%;height:42px;border-radius:999px;background:#101010}.connection{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--line);border-radius:999px;font:9px "Courier New",monospace;color:#aaa;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#777}.dot.on{background:var(--green);box-shadow:0 0 12px rgba(53,208,127,.5)}.dot.bad{background:var(--red)}.refresh-btn,.top-user{height:42px;border:1px solid var(--line);padding:0 13px;border-radius:12px;cursor:pointer}.top-user{display:flex;align-items:center;gap:8px}.main-inner{padding:26px;max-width:1800px;margin:0 auto}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}.eyebrow{font:9px "Courier New",monospace;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}.page-title{font-family:Georgia,serif;font-size:clamp(34px,5vw,62px);letter-spacing:-.06em;margin:5px 0 0}.page-desc{color:var(--muted);font-size:13px;margin:8px 0 0;max-width:760px;line-height:1.5}.head-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{height:42px;padding:0 15px;border-radius:11px;border:1px solid var(--line);cursor:pointer;background:#111}.btn:hover{border-color:var(--line2);transform:translateY(-1px)}.btn.primary{background:var(--text);color:#090909;border-color:var(--text);font-weight:800}.btn.signal{background:var(--accent);color:#180b03;border-color:var(--accent);font-weight:800}.btn.ghost{background:transparent}.btn.danger{border-color:rgba(255,77,77,.35);color:#ff9a9a}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.module{display:none}.module.active{display:block}
/* cards & grids */
.grid{display:grid;gap:14px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:linear-gradient(180deg,#111,#0d0d0d);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 15px 55px rgba(0,0,0,.16)}.card h3{margin:0 0 12px;font-size:13px}.metric{padding:17px}.metric-label{font:9px "Courier New",monospace;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}.metric-value{font-size:33px;font-weight:800;margin-top:10px;letter-spacing:-.04em}.metric-sub{font-size:10px;color:var(--muted);margin-top:5px}.signal-line{height:2px;margin-top:14px;background:linear-gradient(90deg,var(--accent),transparent)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px}.section-head h2{font-size:14px;margin:0}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{min-height:40px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:#0d0d0d}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:11px}.table th{color:#777;font:9px "Courier New",monospace;letter-spacing:.12em;text-transform:uppercase;background:#101010;position:sticky;top:0}.table tr:last-child td{border-bottom:0}.table tr:hover td{background:rgba(255,255,255,.02)}.status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;border:1px solid var(--line);font:9px "Courier New",monospace}.status-pill.green{color:#9bf1c4;border-color:rgba(53,208,127,.24);background:rgba(53,208,127,.05)}.status-pill.orange{color:#ffc38f;border-color:rgba(255,122,24,.24);background:rgba(255,122,24,.05)}.status-pill.red{color:#ffaaaa;border-color:rgba(255,77,77,.24);background:rgba(255,77,77,.05)}.status-pill.gray{color:#aaa}.status-pill.blue{color:#a8d7ff;border-color:rgba(99,180,255,.24);background:rgba(99,180,255,.05)}.mini-actions{display:flex;gap:6px;flex-wrap:wrap}.mini-btn{height:32px;padding:0 9px;border-radius:9px;border:1px solid var(--line);background:#101010;cursor:pointer;font-size:10px}.mini-btn:hover{border-color:var(--line2)}.empty{padding:38px;text-align:center;color:#666;font-size:12px}.note{border-left:3px solid var(--accent);padding:10px 12px;background:rgba(255,122,24,.05);color:#c0b3a7;border-radius:0 10px 10px 0;font-size:11px;line-height:1.5}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font:9px "Courier New",monospace;color:#777;letter-spacing:.13em;text-transform:uppercase}.check-row{display:flex;align-items:center;gap:9px}.check-row input{min-height:0}.inline{display:flex;gap:8px;align-items:center}.right{text-align:right}.price{font-weight:800}.danger-text{color:#ff8f8f}
/* order detail */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(7px);z-index:50;display:none}.drawer-backdrop.show{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(920px,100%);background:#0c0c0c;border-left:1px solid var(--line2);padding:18px;overflow:auto;box-shadow:-30px 0 80px rgba(0,0,0,.45)}.drawer-head{position:sticky;top:-18px;background:rgba(12,12,12,.95);backdrop-filter:blur(14px);z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:18px 2px 14px;border-bottom:1px solid var(--line)}.drawer-title{font-size:25px;font-weight:800}.close{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.order-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.detail-list{display:grid;gap:9px}.detail-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;font-size:11px}.detail-row span:first-child{color:#666}.item-card{padding:12px;border:1px solid var(--line);border-radius:14px;background:#101010}.item-top{display:flex;justify-content:space-between;gap:10px}.item-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}.preview-box{background:#060606;border:1px solid var(--line);border-radius:12px;min-height:260px;display:grid;place-items:center;overflow:hidden}.preview-box img{max-width:100%;max-height:340px;object-fit:contain}
/* placement */
.placement-layout{display:grid;grid-template-columns:minmax(500px,1.15fr) minmax(350px,.85fr);gap:16px}.stage-shell{position:sticky;top:92px}.stage-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.seg{height:36px;padding:0 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:10px}.seg.active{background:var(--text);color:#090909}.stage{position:relative;width:100%;aspect-ratio:4/5;background:#0a0a0a;border:1px solid var(--line2);border-radius:18px;overflow:hidden;touch-action:none}.stage img.mockup{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}.stage-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:10% 10%}.art-layer{position:absolute;transform:translate(-50%,-50%);transform-origin:center center;display:none;user-select:none;touch-action:none;cursor:move}.art-layer img{width:100%;height:100%;object-fit:contain;pointer-events:none}.art-layer.editing{outline:1px dashed var(--accent);outline-offset:4px}.resize-handle{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:var(--accent);border:2px solid #0b0b0b;border-radius:4px;cursor:nwse-resize}.stage-empty{position:absolute;inset:0;display:grid;place-items:center;color:#555;font:11px "Courier New",monospace;letter-spacing:.15em}.crosshair{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.15);border-radius:50%;pointer-events:none}.control-panel{display:grid;gap:12px}.control-section{border:1px solid var(--line);border-radius:15px;background:#0d0d0d;padding:13px}.control-section h3{margin:0 0 11px;font-size:12px}.control-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.control-grid .full{grid-column:1/-1}.range-row{display:grid;grid-template-columns:1fr 78px;gap:8px;align-items:center}.range-row input[type=range]{min-height:0;padding:0}.number-input{width:100%}.placement-readout{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.readout{padding:8px;border:1px solid var(--line);border-radius:9px;background:#0a0a0a}.readout b{display:block;font-size:12px}.readout span{font:8px "Courier New",monospace;color:#666}.nudge-grid{display:grid;grid-template-columns:repeat(3,42px);gap:5px;justify-content:center}.nudge-grid button{width:42px;height:42px;border:1px solid var(--line);border-radius:9px;cursor:pointer}.nudge-grid .empty{border:0;background:transparent}.apply-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.composition-status{font:10px "Courier New",monospace;color:#777}.save-bar{position:sticky;bottom:10px;padding:10px;background:linear-gradient(180deg,rgba(13,13,13,0),#0d0d0d 25%);margin:10px -3px -3px;z-index:3}
/* themes */
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.theme-card{border:1px solid var(--line);border-radius:15px;padding:14px;background:#101010;position:relative}.theme-card.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(255,122,24,.2)}.swatch{height:68px;border-radius:12px;margin-bottom:10px;border:1px solid rgba(255,255,255,.1)}.theme-name{font-size:15px;font-weight:800}.theme-id{font:9px "Courier New",monospace;color:#666;margin-top:3px}.theme-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.theme-card input[type=text]{min-height:36px;width:100%;margin-top:7px}.theme-card .switch{width:42px;height:24px;border-radius:999px;background:#2a2a2a;padding:2px;cursor:pointer}.switch i{display:block;width:20px;height:20px;border-radius:50%;background:#666;transition:.2s}.switch.on{background:rgba(53,208,127,.2)}.switch.on i{transform:translateX(18px);background:var(--green)}
/* content */
.content-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.content-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.content-row{border:1px solid var(--line);background:#0d0d0d;border-radius:12px;padding:10px}.content-key{font:9px "Courier New",monospace;color:#777;letter-spacing:.1em;margin-bottom:6px;word-break:break-all}.content-row textarea{width:100%;min-height:72px}
/* toast */
#toastStack{position:fixed;right:18px;bottom:18px;z-index:100;display:grid;gap:8px;width:min(420px,calc(100% - 36px))}.toast{border:1px solid var(--line2);background:#111;border-radius:13px;padding:12px 14px;box-shadow:var(--shadow);font-size:11px;animation:toastIn .22s var(--ease)}.toast.ok{border-color:rgba(53,208,127,.35)}.toast.err{border-color:rgba(255,77,77,.35)}.toast b{display:block;margin-bottom:3px}@keyframes toastIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr)}.placement-layout{grid-template-columns:1fr}.stage-shell{position:relative;top:auto}.stage{max-width:720px;margin:auto}.order-grid{grid-template-columns:1fr}}
@media(max-width:900px){#app{grid-template-columns:1fr}.sidebar{position:fixed;left:-270px;top:0;transition:left .25s var(--ease);width:270px}.sidebar.open{left:0}.mobile-menu{display:block;width:42px;height:42px;border:1px solid var(--line);border-radius:11px;cursor:pointer}.main-inner{padding:18px}.topbar{padding:10px 14px}.global-search{display:none}.top-user{font-size:10px;padding:0 10px}.grid-3,.grid-2{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.content-grid,.theme-grid{grid-template-columns:1fr}.login-card{padding:28px}}
@media(max-width:620px){.grid-4{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.head-actions{width:100%}.head-actions .btn{flex:1}.placement-layout{display:flex;flex-direction:column}.control-grid{grid-template-columns:1fr}.placement-readout{grid-template-columns:repeat(3,1fr)}.table{min-width:680px}.drawer{width:100%;padding:14px}.detail-row{grid-template-columns:115px 1fr}.item-meta{grid-template-columns:1fr}}
</style>

<style id="customer-parity-placement-css">
/* CUSTOMER-PARITY PLACEMENT STUDIO
   Same square garment canvas and untouched PRODUCT_ASSETS presentation as the customer customizer. */
.placement-layout{grid-template-columns:minmax(520px,1.1fr) minmax(360px,.9fr)}
.placement-layout .stage-shell{display:flex;flex-direction:column;align-items:center}
.placement-layout .stage-toolbar{width:100%}
.placement-layout .stage{width:min(560px,100%);aspect-ratio:1/1;margin:0 auto;background:#101010!important;border:1px solid var(--line)!important;border-radius:8px!important;overflow:hidden!important;box-shadow:none}
.placement-layout .stage img.mockup{object-fit:contain!important;object-position:center center!important;filter:none!important;background:#101010}
.placement-layout .stage-grid{background-image:none!important}
.placement-layout .art-layer{z-index:3;transition:none}
.placement-layout .art-layer img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.16))}
@media(max-width:1200px){.placement-layout{grid-template-columns:1fr}.placement-layout .stage{max-width:560px}}
@media(max-width:700px){.placement-layout .stage{width:min(100%,330px)}}
</style>

/* bridge */
const bridge={ready:false,frame:null,target:null,targetOrigin:'',pending:new Map(),listenerBound:false};
function bridgeMessageOriginAllowed(origin){const o=String(origin||'').trim();return o==='null'||/^https:\/\/(?:[a-z0-9-]+\.)?(?:script\.google\.com|googleusercontent\.com)$/i.test(o)}
function bridgeSourceAllowed(source){return !!(source&&bridge.frame&&source===bridge.frame.contentWindow)}
function bridgeInit(force=false){
  bridge.frame=$('#adminBridgeFrame');
  if(!bridge.frame)return;
  if(!bridge.listenerBound){
    bridge.listenerBound=true;
    window.addEventListener('message',ev=>{
      const m=ev.data||{};
      /* The iframe is pinned to our Apps Script bridge URL. Accept Google
         iframe origins and the sandbox's opaque `null` origin, but only when
         the message comes from our exact iframe window. */
      if(!bridgeMessageOriginAllowed(ev.origin)||!bridgeSourceAllowed(ev.source))return;
      if(m.type==='TEMP_ADMIN_BRIDGE_READY'){
        bridge.target=ev.source;
        bridge.targetOrigin=ev.origin==='null'?'*':ev.origin;
        bridge.ready=true;
        $('#connectionDot').classList.add('on');
        $('#connectionDot').classList.remove('bad');
        $('#connectionText').textContent='BRIDGE / ONLINE';
        return;
      }
      if(m.type==='TEMP_ADMIN_BRIDGE_RESULT'){
        if(!bridge.target||ev.source!==bridge.target)return;
        const p=bridge.pending.get(String(m.requestId));
        if(!p)return;
        bridge.pending.delete(String(m.requestId));
        p.resolve(m.result);
      }
    });
  }
  bridge.ready=false;bridge.target=null;bridge.targetOrigin='';
  const bust=Date.now();
  bridge.frame.src=API_URL+'?action=adminbridge&v=6&_bridge='+bust+(force?'&_retry=1':'');
  bridge.frame.onload=()=>{
    if(!bridge.ready){
      $('#connectionText').textContent='BRIDGE / LOADING';
      /* Give the Apps Script HTML service redirect a second chance before
         authentication turns a slow bridge into a hard timeout. */
      setTimeout(()=>{if(!bridge.ready) bridge.frame.src=API_URL+'?action=adminbridge&v=6&_bridge='+Date.now()+'&_retry=2';},1200);
    }
  };
}
function waitBridge(timeout=30000){if(bridge.ready&&bridge.target)return Promise.resolve();return new Promise((resolve,reject)=>{const t=Date.now();const tick=()=>bridge.ready&&bridge.target?resolve():Date.now()-t>timeout?reject(new Error('ADMIN_BRIDGE_TIMEOUT')):setTimeout(tick,80);tick();})}
async function adminApi(action,payload={},timeout=30000){await waitBridge(Math.min(timeout,30000));const requestId=uid();return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{bridge.pending.delete(requestId);reject(new Error('ADMIN_API_TIMEOUT'))},timeout);bridge.pending.set(requestId,{resolve:r=>{clearTimeout(timer);if(!r||r.ok===false)reject(new Error(r&&r.errorCode||'ADMIN_API_ERROR'));else resolve(r)}});try{bridge.target.postMessage({type:'TEMP_ADMIN_BRIDGE_CALL',requestId,action,payload},bridge.targetOrigin)}catch(e){clearTimeout(timer);bridge.pending.delete(requestId);reject(new Error('ADMIN_BRIDGE_SEND_FAILED'))}})}

function toast(title,body='',kind='ok'){const d=document.createElement('div');d.className='toast '+(kind==='err'?'err':'ok');d.innerHTML=`<b>${esc(title)}</b><span>${esc(body)}</span>`;$('#toastStack').appendChild(d);setTimeout(()=>d.remove(),4200)}
function setConnection(ok,text){const dot=$('#connectionDot');dot.classList.toggle('on',!!ok);dot.classList.toggle('bad',!ok);$('#connectionText').textContent=text}
function can(permission){const r=String(state.admin?.role||'VIEWER').toUpperCase();const map={READ:['OWNER','ADMIN','OPERATIONS','PRODUCTION','SUPPORT','VIEWER'],ORDER_STATUS:['OWNER','ADMIN','OPERATIONS','SUPPORT'],CATALOG_WRITE:['OWNER','ADMIN','PRODUCTION'],PAYMENT_WRITE:['OWNER','ADMIN','OPERATIONS'],STORE_CONTROL:['OWNER','ADMIN','OPERATIONS'],CONTENT_WRITE:['OWNER','ADMIN'],NOTIFICATION_WRITE:['OWNER','ADMIN','OPERATIONS'],ADMIN_USER_WRITE:['OWNER']};return (map[permission]||[]).includes(r)}
function statusPill(status){const s=String(status||'—').toUpperCase();let c='gray';if(['DELIVERED','PAID','CONFIRMED','ACTIVE','OPERATIONAL','READY'].includes(s))c='green';else if(['PENDING','PROCESSING','OPEN','QUEUED'].includes(s))c='orange';else if(['CANCELED','FAILED','EXPIRED','CLOSED'].includes(s))c='red';else if(['SHIPPED','VIEWER'].includes(s))c='blue';return `<span class="status-pill ${c}">${esc(s)}</span>`}
function dateFmt(v){const d=new Date(v);return isNaN(d)?String(v||'—'):d.toLocaleString('en-EG',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function initials(v){return String(v||'A').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'A'}
function moduleHead(k,title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">TEMPORARY™ / CONTROL CENTER</div><h1 class="page-title">${esc(title)}</h1><p class="page-desc">${esc(desc)}</p></div><div class="head-actions">${actions}</div></div>`}


/* public customer-parity bridge -------------------------------------------------
 * The customer storefront reads its catalog/placement data through the public
 * bridge. The Admin placement studio now reads the same public payload for the
 * visual preview, while admincontrol/catalogFull remains the authoritative write
 * source for editing and saving. This prevents the two UIs from drifting.
 */
const publicBridge={ready:false,frame:null,target:null,targetOrigin:'',pending:new Map(),listenerBound:false};
function publicBridgeOriginAllowed(origin){const o=String(origin||'').trim();return o==='null'||/^https:\/\/(?:[a-z0-9-]+\.)?(?:script\.google\.com|googleusercontent\.com)$/i.test(o)}
function publicBridgeSourceAllowed(source){return !!(source&&publicBridge.frame&&source===publicBridge.frame.contentWindow)}
function publicBridgeInit(){
  publicBridge.frame=$('#publicCatalogBridgeFrame');
  if(!publicBridge.frame)return;
  if(!publicBridge.listenerBound){
    publicBridge.listenerBound=true;
    window.addEventListener('message',ev=>{
      const m=ev.data||{};
      if(!publicBridgeOriginAllowed(ev.origin)||!publicBridgeSourceAllowed(ev.source))return;
      if(m.type==='TEMP_BRIDGE_READY'){
        publicBridge.target=ev.source;
        publicBridge.targetOrigin=ev.origin==='null'?'*':ev.origin;
        publicBridge.ready=true;
        return;
      }
      if(m.type==='TEMP_BRIDGE_RESULT'){
        if(!publicBridge.target||ev.source!==publicBridge.target)return;
        const p=publicBridge.pending.get(String(m.requestId));
        if(!p)return;
        publicBridge.pending.delete(String(m.requestId));
        p.resolve(m.result);
      }
    });
  }
  publicBridge.ready=false;publicBridge.target=null;publicBridge.targetOrigin='';
  publicBridge.frame.src=API_URL+'?action=authbridge&_catalog_bridge='+Date.now();
}
function waitPublicBridge(timeout=20000){
  if(publicBridge.ready&&publicBridge.target)return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const started=Date.now();
    const tick=()=>publicBridge.ready&&publicBridge.target?resolve():Date.now()-started>timeout?reject(new Error('PUBLIC_BRIDGE_TIMEOUT')):setTimeout(tick,80);
    tick();
  });
}
async function publicApi(action,payload={},timeout=15000){
  await waitPublicBridge(Math.min(timeout,20000));
  const requestId=uid();
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>{publicBridge.pending.delete(requestId);reject(new Error('PUBLIC_API_TIMEOUT'))},timeout);
    publicBridge.pending.set(requestId,{resolve:r=>{clearTimeout(timer);if(!r||r.ok===false)reject(new Error(r&&r.errorCode||'PUBLIC_API_ERROR'));else resolve(r)}});
    try{publicBridge.target.postMessage({type:'TEMP_BRIDGE_CALL',requestId,action,payload},publicBridge.targetOrigin)}catch(e){clearTimeout(timer);publicBridge.pending.delete(requestId);reject(new Error('PUBLIC_BRIDGE_SEND_FAILED'))}
  });
}
async function ensureCustomerParityCatalog(force=false){
  if(!force&&state.publicCatalog&&Array.isArray(state.publicPlacements)&&state.publicPlacements.length)return;
  const catalog=await publicApi('catalog',{},15000);
  state.publicCatalog=catalog||null;
  try{
    const p=await publicApi('placements',state.placement.productId?{productId:state.placement.productId}:{},15000);
    state.publicPlacements=Array.isArray(p?.placements)?p.placements:[];
  }catch(e){
    state.publicPlacements=Array.isArray(state.publicPlacements)?state.publicPlacements:[];
  }
}

b>${statusPill(s.codEnabled?'ENABLED':'DISABLED')}</b></div><div class="detail-row"><span>Currency</span><b>${esc(s.currency)}</b></div><div class="detail-row"><span>Admin role</span><b>${esc(d.viewer?.role||state.admin?.role)}</b></div></div>`;const rows=Array.isArray(d.recentOrders)?d.recentOrders:[];$('#dashRecent').innerHTML=rows.length?rows.map(orderRow).join(''):`<tr><td colspan="7" class="empty">No orders yet.</td></tr>`;$('#dashRecentMeta').textContent=`${rows.length} latest`;bindOrderRowActions();setConnection(true,'DATABASE / CONNECTED');$('#ordersBadge').classList.toggle('hidden',!d.newOrderCount);$('#ordersBadge').textContent=String(d.newOrderCount||0)}catch(e){setConnection(false,'DATABASE / ERROR');toast('Dashboard error',String(e.message||e),'err')}}

function renderPlacement(triggerSync=true){

function themeSwatch(id){const m={main:['#080808','#ffd000'],gallery:['#ffffff','#2563eb'],street:['#090909','#dc2626'],culture:['#0a0d18','#a3e635'],christmas:['#0b120d','#dc2626'],chrome:['#c6cad0','#0e1217'],tokyo:['#06070b','#f59e0b'],halloween:['#160d08','#ff7a18'],glacier:['#0b1120','#38bdf8'],raw:['#000','#fff']};const x=m[id]||m.main;return `linear-gradient(135deg,${x[0]} 0 65%,${x[1]} 65%)`}
function renderThemes(){const el=$('#view-themes'),d=state.themeDraft||{themes:[],activeTheme:'halloween'};el.innerHTML=moduleHead('themes','Themes','Control the active visual system and which themes can be exposed to customers. Only one theme can be active at a time.',can('STORE_CONTROL')?`<button class="btn signal" id="saveThemes">Save theme configuration</button>`:'')+`<div class="note">The current customer index has ten defined theme systems. This Admin saves the live theme policy in CONFIG; customer runtime consumption is supplied by the backend runtimeConfig.</div><div class="section-head"><h2>Theme systems</h2><div class="small">Active: ${esc(d.activeTheme)}</div></div><div class="theme-grid">${d.themes.map((t,i)=>`<div class="theme-card ${t.id===d.activeTheme?'active':''}"><div class="swatch" style="background:${themeSwatch(t.id)}"></div><div class="theme-name">${esc(t.name)}</div><div class="theme-id">${esc(t.id)}</div><div class="theme-row"><label class="check-row"><input type="radio" name="activeTheme" value="${esc(t.id)}" ${t.id===d.activeTheme?'checked':''}> Active</label><div class="switch ${t.enabled!==false?'on':''}" data-theme-switch="${esc(t.id)}"><i></i></div></div><input type="text" data-theme-name="${esc(t.id)}" value="${esc(t.name)}" placeholder="English name"><input type="text" data-theme-name-ar="${esc(t.id)}" value="${esc(t.nameAr||'')}" dir="rtl" placeholder="Arabic name"></div>`).join('')}</div>`;$$('[name=activeTheme]').forEach(r=>r.onchange=()=>{d.activeTheme=r.value;renderThemes()});$$('[data-theme-switch]').forEach(b=>b.onclick=()=>{const t=d.themes.find(x=>x.id===b.dataset.themeSwitch);t.enabled=t.enabled===false;renderThemes()});$$('[data-theme-name]').forEach(inp=>inp.oninput=()=>{const t=d.themes.find(x=>x.id===inp.dataset.themeName);if(t)t.name=inp.value});$$('[data-theme-name-ar]').forEach(inp=>inp.oninput=()=>{const t=d.themes.find(x=>x.id===inp.dataset.themeNameAr);if(t)t.nameAr=inp.value});if($('#saveThemes'))$('#saveThemes').onclick=async()=>{try{await adminApi('admincontrol',{adminSessionToken:state.token,operation:'saveThemes',payload:d});toast('Themes saved',`Active theme: ${d.activeTheme}`);await loadThemes()}catch(e){toast('Theme save failed',String(e.message||e),'err')}}}

/* delivery */
async function loadDelivery(){const el=$('#view-delivery');el.innerHTML=moduleHead('delivery','Delivery','Governorate/area delivery matrix, fees, estimated days and availability.',can('STORE_CONTROL')?`<button class="btn primary" id="addZone">Add zone</button>`:'')+`<div class="section-head"><h2>Delivery zones</h2><div class="small" id="deliveryMeta">Loading…</div></div><div class="table-wrap"><table class="table"><thead><tr><th>Governorate</th><th>Area</th><th>Fee</th><th>ETA</th><th>Status</th><th>ID</th><th></th></tr></thead><tbody id="deliveryBody"></tbody></table></div>`;try{const d=await adminApi('admincontrol',{adminSessionToken:state.token,operation:'delivery'});state.delivery=d.items||[];$('#deliveryMeta').textContent=`${state.delivery.length} zones`+($('#deliveryMeta')?'':'');$('#deliveryBody').innerHTML=state.delivery.length?state.delivery.map(z=>`<tr><td><strong>${esc(z.GOVERNORATE)}</strong></td><td>${esc(z.AREA)}</td><td>${money(z.deliveryFee)}</td><td>${esc(z.estimatedDays||'—')}</td><td>${statusPill(z.active?'ACTIVE':'INACTIVE')}</td><td><span class="small">${esc(z.ZONE_ID)}</span></td><td><button class="mini-btn" data-zone="${esc(z.ZONE_ID)}">Edit</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty">No delivery zones.</td></tr>`;$$('[data-zone]').forEach(b=>b.onclick=()=>editZone(b.dataset.zone));$('#addZone').onclick=()=>editZone('')}catch(e){toast('Delivery load failed',String(e.message||e),'err')}}
function editZone(id){const z=(state.delivery||[]).find(x=>x.ZONE_ID===id)||{ZONE_ID:'',GOVERNORATE:'',AREA:'',deliveryFee:0,estimatedDays:'',active:true};const bd=$('#drawerBackdrop');bd.innerHTML=`<div class="drawer"><div class="drawer-head"><div><div class="eyebrow">DELIVERY ZONE</div><div class="drawer-title">${esc(z.GOVERNORATE||'New zone')}</div></div><button class="close" id="drawerClose">×</button></div><form id="zoneForm" style="padding-top:12px"><div class="form-grid"><div class="field full"><label>Zone ID</label><input name="zoneId" value="${esc(z.ZONE_ID||'')}" placeholder="Leave blank for new"></div><div class="field"><label>Governorate</label><input name="governorate" value="${esc(z.GOVERNORATE||'')}" required></div><div class="field"><label>Area</label><input name="area" value="${esc(z.AREA||'')}" required></div><div class="field"><label>Delivery fee</label><input name="deliveryFee" type="number" min="0" value="${Number(z.deliveryFee||0)}"></div><div class="field"><label>Estimated days</label><input name="estimatedDays" value="${esc(z.ESTIMATED_DAYS||z.estimatedDays||'')}"></div><div class="field"><label>Active</label><select name="active"><option value="true" ${z.active?'selected':''}>TRUE</option><option value="false" ${!z.active?'selected':''}>FALSE</option></select></div></div><button class="btn primary" style="margin-top:14px;width:100%">Save zone</button></form></div>`;bd.classList.add('show');$('#drawerClose').onclick=closeDrawer;$('#zoneForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await adminApi('admincontrol',{adminSessionToken:state.token,operation:'saveDeliveryZone',payload:{zoneId:f.get('zoneId'),governorate:f.get('governorate'),area:f.get('area'),deliveryFee:Number(f.get('deliveryFee')),estimatedDays:f.get('estimatedDays'),active:f.get('active')==='true'}});toast('Delivery zone saved');closeDrawer();loadDelivery()}catch(err){toast('Delivery save failed',String(err.message||err),'err')}}}

/* notifications */
async function loadNotifications(){const el=$('#view-notifications');el.innerHTML=moduleHead('notifications','Notifications','Independent admin email alerts for new orders. The notification queue is processed by the existing one-minute email trigger and does not depend on dashboard login.',can('NOTIFICATION_WRITE')?`<button class="btn primary" id="saveNotifs">Save recipients</button>`:'')+`<div class="grid grid-2"><div class="card"><h3>Admin recipients</h3><div class="field"><label>Email 1</label><input id="notif1" type="email"></div><div class="field" style="margin-top:10px"><label>Email 2</label><input id="notif2" type="email"></div><div class="check-row" style="margin-top:12px"><input id="notifEnabled" type="checkbox"><label for="notifEnabled">Notify admins on new customer orders</label></div><div class="mini-actions" style="margin-top:12px"><button class="btn" id="testNotif">Send test email</button></div></div><div class="card" id="notifStatus"></div></div>`;try{const d=await adminApi('admincontrol',{adminSessionToken:state.token,operation:'notifications'});$('#notif1').value=d.adminEmails?.[0]||'';$('#notif2').value=d.adminEmails?.[1]||'';$('#notifEnabled').checked=!!d.newOrderNotifications;$('#notifStatus').innerHTML=`<h3>Queue health</h3><div class="detail-list"><div class="detail-row"><span>Recipients</span><b>${d.adminEmails?.length||0} / 2</b></div><div class="detail-row"><span>New-order email</span><b>${statusPill(d.newOrderNotifications?'ENABLED':'DISABLED')}</b></div><div class="detail-row"><span>Queued orders</span><b>${Number(d.queuedOrders||0)}</b></div><div class="detail-row"><span>Transport</span><b>${statusPill('BRIDGE / EMAIL QUEUE')}</b></div></div>`;if($('#saveNotifs'))$('#saveNotifs').onclick=async()=>{try{await adminApi('admincontrol',{adminSessionToken:state.token,operation:'saveNotifications',payload:{emails:[$('#notif1').value,$('#notif2').value].filter(Boolean),newOrderNotifications:$('#notifEnabled').checked}});toast('Notifications saved');loadNotifications()}catch(e){toast('Notification save failed',String(e.message||e),'err')}};if($('#testNotif'))$('#testNotif').onclick=async()=>{try{await adminApi('admincontrol',{adminSessionToken:state.token,operation:'sendAdminTestEmail',payload:{email:$('#notif1').value}});toast('Test email sent',$('#notif1').value)}catch(e){toast('Test email failed',String(e.message||e),'err')}}}catch(e){toast('Notifications load failed',String(e.message||e),'err')}}

/* content */
async function loadContent(){const el=$('#view-content');try{const d=await adminApi('admincontrol',{adminSessionToken:state.token,operation:'content'});state.contentDraft={en:{...(d.en||{})},ar:{...(d.ar||{})},productNamesAr:{...(d.productNamesAr||{})},designNamesAr:{...(d.designNamesAr||{})}};renderContent()}catch(e){toast('Content load failed',String(e.message||e),'err')}}
function renderContent(){const el=$('#view-content'),lang=state.contentLang,values=state.contentDraft?.[lang]||{},q=state.contentSearch.toLowerCase();const keys=Object.keys(values).filter(k=>!q||k.toLowerCase().includes(q)||String(values[k]||'').toLowerCase().includes(q));el.innerHTML=moduleHead('content','Content / Languages','Edit the customer-facing EN and AR text map independently. Keys are stable; values are editable.',can('CONTENT_WRITE')?`<button class="btn signal" id="saveContent">Save ${lang.toUpperCase()} content</button>`:'')+`<div class="card"><div class="content-toolbar"><button class="seg ${lang==='en'?'active':''}" id="contentEn">ENGLISH</button><button class="seg ${lang==='ar'?'active':''}" id="contentAr">ARABIC</button><input id="contentSearch" placeholder="Filter content keys…" style="flex:1"></div><div class="note">${keys.length} keys. This editor starts from the customer index I18N map so the admin does not invent a second copy of the copy structure.</div></div><div class="content-grid" style="margin-top:12px">${keys.map(k=>`<div class="content-row"><div class="content-key">${esc(k)}</div><textarea data-content-key="${esc(k)}" dir="${lang==='ar'?'rtl':'ltr'}">${esc(values[k]||'')}</textarea></div>`).join('')}</div>`;$('#contentEn').onclick=()=>{state.contentLang='en';renderContent()};$('#contentAr').onclick=()=>{state.contentLang='ar';renderContent()};$('#contentSearch').value=state.contentSearch;$('#contentSearch').oninput=e=>{state.contentSearch=e.target.value;renderContent()};$$('[data-content-key]').forEach(t=>t.oninput=e=>{state.contentDraft[lang][e.target.dataset.contentKey]=e.target.value});if($('#saveContent'))$('#saveContent').onclick=async()=>{try{await adminApi('admincontrol',{adminSessionToken:state.token,operation:'saveContent',payload:{lang,values:state.contentDraft[lang]}});toast(`${lang.toUpperCase()} content saved`)}catch(e){toast('Content save failed',String(e.message||e),'err')}}}

/* analytics */
async function loadAnalytics(){const el=$('#view-analytics');el.innerHTML=moduleHead('analytics','Analytics','Revenue, orders, units and catalog performance by selected time range.',`<select id="analyticsDays"><option value="7">7 days</option><option value="30">30 days</option><option value="90">90 days</option><option value="365">365 days</option></select>`)+`<div class="grid grid-4" id="analyticsMetrics"></div><div class="grid grid-2" style="margin-top:14px"><div class="card"><h3>Product performance</h3><div id="perfProduct"></div></div><div class="card"><h3>Design performance</h3><div id="perfDesign"></div></div><div class="card"><h3>Color performance</h3><div id="perfColor"></div></div><div class="card"><h3>Size performance</h3><div id="perfSize"></div></div></div>`;$('#analyticsDays').value=String(state.analyticsDays);$('#analyticsDays').onchange=()=>{state.analyticsDays=Number($('#analyticsDays').value);loadAnalytics()};try{const d=await adminApi('admincontrol',{adminSessionToken:state.token,operation:'analytics',range:{days:state.analyticsDays}}),m=d.metrics||{};$('#analyticsMetrics').innerHTML=[['REVENUE',money(m.revenue),'recognized statuses'],['ORDERS',m.orders,'recognized orders'],['UNITS',m.units,'units sold'],['AOV',money(m.aov),'average order value']].map(x=>`<div class="card metric"><div class="metric-label">${x[0]}</div><div class="metric-value">${x[1]}</div><div class="metric-sub">${x[2]}</div></div>`).join('');[['perfProduct',d.breakdown?.product],['perfDesign',d.breakdown?.design],['perfColor',d.breakdown?.color],['perfSize',d.breakdown?.size]].forEach(([id,rows])=>{$('#'+id).innerHTML=(rows||[]).length?rows.map(r=>`<div class="detail-row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(r.name)}</span><b>${r.units} · ${money(r.revenue)}</b></div>`).join(''):'<div class="empty">No recognized sales in this range.</div>'})}catch(e){toast('Analytics error',String(e.message||e),'err')}}

/* settings + admins + audit */
async function loadSettings(){const el=$('#view-settings');el.innerHTML=moduleHead('settings','Settings','Store controls, confirmation window, COD, theme shortcut and admin access policy.',can('STORE_CONTROL')?`<button class="btn signal" id="saveSettings">Save store settings</button>`:'')+`<div class="grid grid-2"><div class="card"><h3>Store operations</h3><div class="form-grid"><div class="field"><label>Store mode</label><select id="setStore"><option>OPEN</option><option>CLOSED</option></select></div><div class="field"><label>COD</label><select id="setCod"><option value="true">ENABLED</option><option value="false">DISABLED</option></select></div><div class="field"><label>Confirmation window (hours)</label><input id="setHours" type="number" min="1" max="168"></div><div class="field"><label>Active theme</label><select id="setTheme"></select></div></div></div><div class="card" id="healthCard"><h3>System health</h3><div class="empty">Checking…</div></div></div><div class="section-head"><h2>Admin users</h2><div class="small">OWNER-only user management</div></div><div class="card" id="adminUsersCard"></div>`;try{const [s,h]=await Promise.all([adminApi('admincontrol',{adminSessionToken:state.token,operation:'settings'}),adminApi('admincontrol',{adminSessionToken:state.token,operation:'health'})]);$('#setStore').value=s.storeMode;$('#setCod').value=String(!!s.codEnabled);$('#setHours').value=s.confirmationHours;const td=await adminApi('admincontrol',{adminSessionToken:state.token,operation:'themes'});$('#setTheme').innerHTML=(td.themes||[]).map(t=>`<option value="${esc(t.id)}" ${t.id===s.activeTheme?'selected':''} ${t.enabled===false?'disabled':''}>${esc(t.name)}</option>`).join('');$('#healthCard').innerHTML=`<h3>System health</h3><div class="detail-list"><div class="detail-row"><span>Backend</span><b>${statusPill(h.status)}</b></div><div class="detail-row"><span>Sheets missing</span><b>${h.missingSheets?.length||0}</b></div><div class="detail-row"><span>Email trigger</span><b>${statusPill(h.emailQueueTriggerCount>0?'READY':'MISSING')}</b></div><div class="detail-row"><span>Server time</span><b>${dateFmt(h.serverTime)}</b></div></div>`;if($('#saveSettings'))$('#saveSettings').onclick=async()=>{try{await adminApi('admincontrol',{adminSessionToken:state.token,operation:'saveSettings',payload:{storeMode:$('#setStore').value,codEnabled:$('#setCod').value==='true',confirmationHours:Number($('#setHours').value),activeTheme:$('#setTheme').value}});toast('Store settings saved');loadSettings()}catch(e){toast('Settings save failed',String(e.message||e),'err')}};if(can('ADMIN_USER_WRITE'))loadAdminUsers();else $('#adminUsersCard').innerHTML='<div class="note">Your role does not have permission to manage admin users.</div>'}catch(e){toast('Settings load failed',String(e.message||e),'err')}}
async function loadAdminUsers(){try{const d=await adminApi('admincontrol',{adminSessionToken:state.token,operation:'admins'});const card=$('#adminUsersCard');card.innerHTML=`<div class="mini-actions" style="margin-bottom:12px"><button class="btn primary" id="addAdminUser">Add admin</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${(d.items||[]).map(a=>`<tr><td>${esc(a.displayName)}</td><td>${esc(a.email)}</td><td>${esc(a.role)}</td><td>${statusPill(a.active?'ACTIVE':'INACTIVE')}</td><td><button class="mini-btn" data-admin-toggle="${esc(a.adminId)}" data-active="${a.active?'true':'false'}">${a.active?'Deactivate':'Activate'}</button></td></tr>`).join('')}</tbody></table></div>`;$('#addAdminUser').onclick=()=>addAdminUser();$$('[data-admin-toggle]').forEach(b=>b.onclick=async()=>{try{await adminApi('admincontrol',{adminSessionToken:state.token,operation:'saveAdminUserStatus',payload:{adminId:b.dataset.adminToggle,active:b.dataset.active!=='true'}});toast('Admin status updated');loadAdminUsers()}catch(e){toast('Admin status failed',String(e.message||e),'err')}})}catch(e){$('#adminUsersCard').innerHTML=`<div class="empty danger-text">${esc(e.message||e)}</div>`}}
function addAdminUser(){const bd=$('#drawerBackdrop');bd.innerHTML=`<div class="drawer"><div class="drawer-head"><div><div class="eyebrow">ADMIN ACCESS</div><div class="drawer-title">Add admin</div></div><button class="close" id="drawerClose">×</button></div><form id="adminForm" style="padding-top:12px"><div class="form-grid"><div class="field full"><label>Google email</label><input name="email" type="email" required></div><div class="field"><label>Display name</label><input name="displayName" required></div><div class="field"><label>Role</label><select name="role"><option>ADMIN</option><option>OPERATIONS</option><option>PRODUCTION</option><option>SUPPORT</option><option>VIEWER</option><option>OWNER</option></select></div></div><button class="btn primary" style="margin-top:14px;width:100%">Save admin</button></form></div>`;bd.classList.add('show');$('#drawerClose').onclick=closeDrawer;$('#adminForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await adminApi('admincontrol',{adminSessionToken:state.token,operation:'saveAdminUser',payload:{email:f.get('email'),displayName:f.get('displayName'),role:f.get('role')}});toast('Admin saved');closeDrawer();loadAdminUsers()}catch(err){toast('Admin save failed',String(err.message||err),'err')}}}
async function loadAudit(){const el=$('#view-audit');el.innerHTML=moduleHead('audit','Audit log','Immutable operational history of admin changes and lifecycle actions.',`<button class="btn" id="auditReload">↻ Reload</button>`)+`<div class="card"><div class="toolbar"><input id="auditSearch" placeholder="Action, entity, actor, details…"><button class="btn primary" id="auditApply">Filter</button></div></div><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody id="auditBody"></tbody></table></div>`;$('#auditReload').onclick=loadAudit;$('#auditApply').onclick=loadAudit;try{const d=await adminApi('admincontrol',{adminSessionToken:state.token,operation:'audit',query:{search:$('#auditSearch').value,limit:500}});$('#auditBody').innerHTML=(d.items||[]).map(r=>`<tr><td>${dateFmt(r.CREATED_AT)}</td><td>${esc(r.ACTOR_TYPE||'')} / ${esc(r.ACTOR_ID||'')}</td><td><strong>${esc(r.ACTION||'')}</strong></td><td>${esc(r.ENTITY_TYPE||'')} / ${esc(r.ENTITY_ID||'')}</td><td class="small" style="max-width:520px;white-space:pre-wrap">${esc(r.DETAILS||'')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No audit events.</td></tr>'}catch(e){toast('Audit load failed',String(e.message||e),'err')}}

/* global search */
$('#globalSearch').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const q=e.target.value.trim();if(!q)return;navigate('orders');setTimeout(()=>{const s=$('#ordersSearch');if(s){s.value=q;$('#ordersApply').click()}},50)});

</script>
