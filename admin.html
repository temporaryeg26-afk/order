<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>TEMPORARY™ — Admin Control Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#070707;--card:#0e0e0e;--sub:#141414;--hover:#1b1b1b;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.18);--text:#f5f3ef;--muted:#8e8e93;--accent:#d4af37;--danger:#ef4444;--ok:#22c55e;--warn:#f59e0b;--info:#3b82f6;--mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:var(--bg);color:var(--text);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit}.mono{font-family:var(--mono)}.muted{color:var(--muted)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.gate-box{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:34px;text-align:center}
.gate-box h1{font-size:18px;letter-spacing:.25em}.gate-box p{font-size:10px;color:var(--muted);letter-spacing:.14em;margin:6px 0 24px}
#gSlot{min-height:44px;display:flex;justify-content:center;margin-bottom:14px}#gateStatus{font:10px var(--mono);color:var(--muted);letter-spacing:.1em}
#app{display:none;height:100vh;grid-template-columns:230px minmax(0,1fr);grid-template-rows:56px 1fr}
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}
.top b{letter-spacing:.22em}.top .r{display:flex;gap:12px;align-items:center;font-size:11px}
.pill{padding:2px 8px;border:1px solid var(--line);border-radius:20px;font:10px var(--mono);color:var(--muted)}.pill.ok{color:var(--ok)}.pill.bad{color:var(--danger)}
nav{border-right:1px solid var(--line);overflow:auto;padding:12px 8px}nav h6{font-size:9px;letter-spacing:.18em;color:#555;margin:14px 10px 4px;text-transform:uppercase}
nav a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:6px;color:var(--muted);cursor:pointer;font-weight:500;text-decoration:none}nav a:hover{background:var(--hover);color:var(--text)}nav a.on{background:var(--card);border:1px solid var(--line);color:var(--text)}
main{overflow:auto;padding:22px 26px 60px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}.vh h2{font-size:21px}.vh p{color:var(--muted);font-size:12px}.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{height:32px;padding:0 13px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.btn:hover{border-color:var(--line2);background:var(--hover)}
.btn.p{background:var(--text);color:#070707;border-color:var(--text)}.btn.a{background:var(--accent);color:#070707;border-color:var(--accent)}.btn.d{color:var(--danger);border-color:rgba(239,68,68,.35)}.btn.sm{height:26px;font-size:11px;padding:0 9px}.btn:disabled{opacity:.4;cursor:not-allowed}
input.in,select.in,textarea.in{height:32px;padding:0 10px;background:var(--card);border:1px solid var(--line);border-radius:6px;width:100%}textarea.in{height:auto;min-height:70px;padding:8px 10px;resize:vertical}.in:focus{outline:0;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}.card h3{font-size:12px;letter-spacing:.06em;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}.stat small{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.stat b{display:block;font-size:22px;margin-top:2px}
.tw{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{background:var(--sub);padding:9px 12px;text-align:left;font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;white-space:nowrap}td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.05em;background:var(--hover);color:var(--muted)}
.b-PENDING{color:var(--warn);background:rgba(245,158,11,.1)}.b-CONFIRMED{color:var(--info);background:rgba(59,130,246,.1)}.b-PROCESSING{color:#c084fc;background:rgba(168,85,247,.1)}.b-READY_FOR_DELIVERY{color:#fbbf24;background:rgba(245,158,11,.12)}.b-OUT_FOR_DELIVERY{color:#f472b6;background:rgba(236,72,153,.1)}.b-SHIPPED{color:#38bdf8;background:rgba(14,165,233,.1)}.b-DELIVERED,.b-PAID,.b-ACTIVE,.b-TRUE{color:var(--ok);background:rgba(34,197,94,.1)}.b-CANCELED,.b-FAILED,.b-SOLD_OUT,.b-FALSE{color:var(--danger);background:rgba(239,68,68,.1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.f{display:flex;flex-direction:column;gap:4px}.f label{font-size:10px;color:var(--muted);letter-spacing:.05em;font-weight:600}.full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--sub);border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}.seg button{border:0;background:none;color:var(--muted);height:26px;padding:0 10px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600}.seg button.on{background:var(--card);color:var(--text);box-shadow:0 0 0 1px var(--line2)}
.studio{display:grid;grid-template-columns:minmax(320px,460px) minmax(300px,1fr) minmax(320px,420px);gap:16px;align-items:start}
.stage{position:relative;width:100%;aspect-ratio:4/5;background:#0b0b0b;border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:none;user-select:none}
.stage .base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center}
.layer{position:absolute;transform:translate(-50%,-50%);cursor:move}.layer img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}.layer.sel{outline:1px dashed var(--accent);outline-offset:2px}
.h{position:absolute;width:10px;height:10px;background:var(--accent);border-radius:50%;right:-5px;bottom:-5px;cursor:nwse-resize}
.frame-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slider{display:grid;grid-template-columns:70px 1fr 64px;gap:8px;align-items:center;margin-bottom:6px;font-size:11px}.slider input[type=number]{height:26px;padding:0 6px;background:var(--sub);border:1px solid var(--line);border-radius:4px;width:100%}
.preview{width:100%;height:640px;border:1px solid var(--line);border-radius:8px;background:#000}
.devwrap{background:var(--sub);border:1px solid var(--line);border-radius:8px;padding:16px;overflow:auto;height:72vh;display:flex;justify-content:center;align-items:flex-start}
.devwrap iframe{border:1px solid var(--line2);background:#000;transform-origin:top center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px;z-index:40}.ov.on{display:flex}
.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:10px}.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}.modal .mb{padding:18px}.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
#toast{position:fixed;right:20px;bottom:20px;background:var(--card);border:1px solid var(--accent);padding:10px 14px;border-radius:6px;font:11px var(--mono);display:none;z-index:60;max-width:440px}#toast.bad{border-color:var(--danger)}
.thumb{width:44px;height:44px;border-radius:4px;background:#111;border:1px solid var(--line);object-fit:contain}
.note{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:10px}
@media(max-width:1300px){.studio{grid-template-columns:minmax(300px,1fr) minmax(300px,1fr)}.studio>.pv{grid-column:1/-1}}
@media(max-width:900px){#app{grid-template-columns:1fr}nav{display:none}nav.open{display:block;position:fixed;top:56px;bottom:0;left:0;width:240px;background:var(--bg);z-index:30}#menuBtn{display:inline-flex!important}.studio,.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<iframe id="bridge" style="display:none" title="bridge"></iframe>
<div id="gate"><div class="gate-box"><h1>TEMPORARY™</h1><p>ADMIN CONTROL CENTER</p><div id="gSlot"></div><div id="gateStatus">CONNECTING…</div></div></div>
<div id="app">
  <div class="top"><div style="display:flex;gap:12px;align-items:center"><button class="btn sm" id="menuBtn" style="display:none">☰</button><b>TEMPORARY™</b><span class="pill">ADMIN</span></div>
    <div class="r"><span class="pill" id="apiPill">API</span><span class="pill" id="revPill">REV —</span><span id="who"></span><button class="btn sm" id="logoutBtn">Log out</button></div></div>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="ov" id="ov"><div class="modal"><header><b id="mTitle"></b><button class="btn sm" onclick="closeModal()">✕</button></header><div class="mb" id="mBody"></div><footer id="mFoot"></footer></div></div>
<div id="toast"></div>
<script>
'use strict';
const CFG={API_URL:'https://script.google.com/macros/s/AKfycbx5InYO32kfhcCo34Me8AfCK3mZhaSsJABXL0dElh_kZT-dZKICpMxhXSUmWL9jsAiK/exec',GOOGLE_CLIENT_ID:'32171492706-n6rli6equ2e0es8ac15npdcrhctlq2bn.apps.googleusercontent.com',TOKEN_KEY:'temporary_admin_token_v10'};
const $=(q,r=document)=>r.querySelector(q),$$=(q,r=document)=>[...r.querySelectorAll(q)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(v,c)=>`${c||S.currency||'EGP'} ${Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const dt=v=>{if(!v)return'—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'})};
const badge=v=>`<span class="badge b-${esc(String(v).toUpperCase())}">${esc(String(v).replace(/_/g,' '))}</span>`;
const S={token:localStorage.getItem(CFG.TOKEN_KEY)||'',admin:null,view:'dashboard',currency:'EGP',cat:null,siteUrl:'',bridge:{ready:false,win:null,origin:'',pending:new Map(),queue:[]}};

/* ---------- toast / modal ---------- */
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',bad?6000:3200)}
function openModal(title,body,foot){$('.modal').style.width='';$('#mTitle').textContent=title;$('#mBody').innerHTML=body;$('#mFoot').innerHTML=foot||'<button class="btn" onclick="closeModal()">Close</button>';$('#ov').classList.add('on')}
function closeModal(){$('#ov').classList.remove('on')}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});

/* ---------- secure bridge (Apps Script iframe, CORS-free) ---------- */
function bridgeOk(o){return /^https:\/\/([a-z0-9-]+\.)*(script\.google\.com|googleusercontent\.com)$/i.test(o)}
function initBridge(){$('#bridge').src=CFG.API_URL+'?action=adminbridge&t='+Date.now();$('#apiPill').textContent='API · CONNECTING';setTimeout(()=>{if(!S.bridge.ready){$('#apiPill').textContent='API · RETRY';initBridge()}},12000)}
addEventListener('message',e=>{
  if(!bridgeOk(e.origin))return;const d=e.data||{},B=S.bridge;
  if(d.type==='TEMP_ADMIN_BRIDGE_READY'){B.ready=true;B.win=e.source;B.origin=e.origin;$('#apiPill').textContent='API · READY';$('#apiPill').className='pill ok';B.queue.splice(0).forEach(q=>post(q));return}
  if(d.type==='TEMP_ADMIN_BRIDGE_RESULT'&&e.source===B.win){const p=B.pending.get(d.requestId);if(!p)return;clearTimeout(p.timer);B.pending.delete(d.requestId);const r=d.result||{};if(r.ok)p.resolve(r.data||{});else{const er=new Error(r.errorMessage||r.errorCode||'Request failed');er.code=r.errorCode;p.reject(er)}}
});
function post(q){S.bridge.win.postMessage({type:'TEMP_ADMIN_BRIDGE_CALL',requestId:q.id,action:q.action,payload:q.payload},S.bridge.origin)}
function call(action,payload={},timeout=60000){return new Promise((resolve,reject)=>{const id='A'+Date.now()+Math.random().toString(36).slice(2,8);const timer=setTimeout(()=>{S.bridge.pending.delete(id);reject(Object.assign(new Error('The server took too long to respond.'),{code:'TIMEOUT'}))},timeout);S.bridge.pending.set(id,{resolve,reject,timer});const q={id,action,payload:{...payload,adminSessionToken:S.token}};S.bridge.ready?post(q):S.bridge.queue.push(q)})}
async function ctl(op,payload={}){const r=await call('admincontrol',{operation:op,payload});if(r&&r.siteRevision){$('#revPill').textContent='REV '+r.siteRevision}return r}
function fail(e){if(['ADMIN_SESSION_INVALID','ADMIN_AUTH_REQUIRED'].includes(e.code)){logout(false);return}toast(e.message||String(e),true)}

/* ---------- auth ---------- */
function loadGsi(){return new Promise(res=>{if(window.google?.accounts?.id)return res(true);const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res(true);s.onerror=()=>res(false);document.head.appendChild(s)})}
async function initGoogle(){if(!await loadGsi()){$('#gateStatus').textContent='GOOGLE SIGN-IN FAILED TO LOAD';return}google.accounts.id.initialize({client_id:CFG.GOOGLE_CLIENT_ID,callback:async r=>{$('#gateStatus').textContent='VERIFYING ADMIN…';try{const d=await call('admingoogleauth',{credential:r.credential});S.token=d.sessionToken;localStorage.setItem(CFG.TOKEN_KEY,S.token);S.admin=d.admin;enter()}catch(e){$('#gateStatus').textContent=e.message.toUpperCase()}}});google.accounts.id.renderButton($('#gSlot'),{theme:'filled_black',size:'large',width:280});$('#gateStatus').textContent='SIGN IN WITH AN ADMIN GOOGLE ACCOUNT'}
async function restore(){if(!S.token)return false;try{const d=await call('adminsessionbootstrap',{});S.admin=d.admin;return true}catch(_){localStorage.removeItem(CFG.TOKEN_KEY);S.token='';return false}}
async function logout(callApi=true){if(callApi)try{await call('adminlogout',{})}catch(_){}localStorage.removeItem(CFG.TOKEN_KEY);S.token='';$('#app').style.display='none';$('#gate').style.display='flex';initGoogle()}
async function enter(){$('#gate').style.display='none';$('#app').style.display='grid';$('#who').textContent=`${S.admin.displayName||S.admin.email} · ${S.admin.role}`;renderNav();await loadCatalog().catch(fail);go(S.view)}
async function loadCatalog(){S.cat=await ctl('catalogFull');S.currency=S.cat.currency||'EGP';S.siteUrl=(S.cat.customerSiteUrl||'').replace(/\/?$/,'/');return S.cat}

/* ---------- navigation ---------- */
const NAV=[['Overview',[['dashboard','Dashboard']]],['Operations',[['orders','Orders'],['customers','Customers'],['analytics','Analytics']]],['Catalog',[['products','Products'],['designs','Designs'],['inventory','Inventory'],['placements','Placement Studio'],['collection','Collection Mockup'],['device','Device View']]],['Website',[['pages','Website Pages'],['policies','Policies'],['inquiries','Inquiries'],['themes','Themes']]],['Store',[['delivery','Delivery'],['notifications','Notifications'],['settings','Settings']]],['System',[['admins','Admin Users'],['audit','Audit Log'],['qa','Health & Launch QA']]]];
function renderNav(){$('#nav').innerHTML=NAV.map(([g,items])=>`<h6>${g}</h6>`+items.map(([k,l])=>`<a data-v="${k}" class="${k===S.view?'on':''}">${l}</a>`).join('')).join('');$$('#nav a').forEach(a=>a.onclick=()=>{go(a.dataset.v);$('#nav').classList.remove('open')})}
$('#menuBtn').onclick=()=>$('#nav').classList.toggle('open');$('#logoutBtn').onclick=()=>logout(true);
function go(v){S.view=v;$$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));$('#main').innerHTML='<div class="muted mono">LOADING…</div>';(VIEWS[v]||VIEWS.dashboard)().catch(fail)}
const header=(t,p,acts='')=>`<div class="vh"><div><h2>${t}</h2><p>${p}</p></div><div class="acts">${acts}</div></div>`;
const F=(label,id,value='',type='text',extra='')=>`<div class="f ${type==='textarea'?'full':''}"><label>${label}</label>${type==='textarea'?`<textarea class="in" id="${id}" ${extra}>${esc(value)}</textarea>`:type==='select'?`<select class="in" id="${id}">${extra}</select>`:`<input class="in" id="${id}" type="${type}" value="${esc(value)}" ${extra}>`}</div>`;
const opt=(list,sel)=>list.map(x=>{const [v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(l)}</option>`}).join('');
const V=id=>{const el=$('#'+id);return el?(el.type==='checkbox'?el.checked:el.value):undefined};
const prodName=id=>(S.cat.products.find(p=>p.productId===id)||{}).productName||id;

const VIEWS={};
/* ---------- dashboard ---------- */
VIEWS.dashboard=async()=>{const d=await ctl('overview'),m=d.metrics;S.currency=d.currency;$('#revPill').textContent='REV '+d.revision;
  $('#main').innerHTML=header('Dashboard','Live from the Sheet via GS','<button class="btn" onclick="go(\'dashboard\')">↻ Refresh</button>')+
  (m.newInquiries?`<div class="note" style="margin-bottom:12px;border-color:var(--accent);cursor:pointer" onclick="go('inquiries')">✉ ${m.newInquiries} new customer inquir${m.newInquiries>1?'ies':'y'} waiting → open Inquiries</div>`:'')+`<div class="stats">${[['New inquiries',m.newInquiries||0],['Revenue (all)',money(m.revenue)],['Revenue 30d',money(m.revenue30)],['Orders',m.orders],['Orders 30d',m.orders30],['Pending',m.byStatus.PENDING||0],['Processing',(m.byStatus.PROCESSING||0)+(m.byStatus.READY_FOR_DELIVERY||0)],['Out / Shipped',(m.byStatus.OUT_FOR_DELIVERY||0)+(m.byStatus.SHIPPED||0)],['Delivered',m.byStatus.DELIVERED||0],['Customers',m.customers],['Active carts',m.activeCarts],['Pending payments',m.pendingPayments],['Conversion 30d',(m.conversion30*100).toFixed(1)+'%']].map(([a,b])=>`<div class="stat"><small>${a}</small><b>${b}</b></div>`).join('')}</div>
  <div class="grid2"><div class="card"><h3>Recent orders</h3>${ordersTable(d.recentOrders)}</div><div><div class="card"><h3>System health</h3><div class="mono" style="font-size:11px">STATUS ${badge(d.health.status)}<br>Minute job: ${d.health.minuteJob?'✓':'✗'} · Daily job: ${d.health.dailyJob?'✓':'✗'} · Email quota: ${d.health.emailQuota??'—'}${d.health.missingSheets.length?'<br>Missing sheets: '+esc(d.health.missingSheets.join(', ')):''}</div></div>
  <div class="card"><h3>Low inventory (≤10)</h3>${d.lowInventory.length?d.lowInventory.map(x=>`<div>${esc(x.designName)} — <b>${x.remaining}</b> / ${x.productionLimit} ${badge(x.status)}</div>`).join(''):'<span class="muted">All good</span>'}</div>
  <div class="card"><h3>Recent activity</h3>${d.recentActivity.map(a=>`<div style="font-size:11px;margin-bottom:4px"><span class="mono muted">${dt(a.CREATED_AT)}</span> ${esc(a.ACTION)} · ${esc(a.ENTITY_TYPE)}</div>`).join('')}</div></div></div>`};

/* ---------- orders ---------- */
const STATUSES=['ALL','PENDING','CONFIRMED','PROCESSING','READY_FOR_DELIVERY','OUT_FOR_DELIVERY','SHIPPED','DELIVERED','CANCELED'];
function ordersTable(list){return `<div class="tw"><table><thead><tr><th>Order</th><th>Customer</th><th>Created</th><th>Status</th><th>Payment</th><th>Total</th><th>Area</th><th></th></tr></thead><tbody>${list.length?list.map(o=>`<tr><td class="mono"><b>${esc(o.orderNumber)}</b></td><td>${esc(o.customerName)}<div class="muted mono" style="font-size:10px">${esc(o.phone)}</div></td><td class="mono">${dt(o.createdAt)}</td><td>${badge(o.orderStatus)}</td><td>${esc(o.paymentMethod)} ${badge(o.paymentStatus)}</td><td class="mono">${money(o.total,o.currency)}</td><td>${esc(o.deliveryGovernorate)} · ${esc(o.deliveryArea)}</td><td><button class="btn sm" onclick="orderDetail('${esc(o.orderId)}')">Open</button></td></tr>`).join(''):'<tr><td colspan="8" class="muted" style="text-align:center;padding:24px">No orders</td></tr>'}</tbody></table></div>`}
VIEWS.orders=async()=>{$('#main').innerHTML=header('Orders','Every status change is validated, audited and written by GS',`<input class="in" id="oq" placeholder="Search…" style="width:200px"><select class="in" id="os" style="width:180px">${opt(STATUSES.map(s=>[s,s.replace(/_/g,' ')]),'ALL')}</select><button class="btn" id="oGo">↻ Load</button>`)+'<div id="oList"></div>';
  const load=async()=>{const r=await ctl('orders',{search:V('oq'),status:V('os'),limit:300});$('#oList').innerHTML=`<p class="muted" style="margin-bottom:8px">${r.total} orders</p>`+ordersTable(r.items)};$('#oGo').onclick=()=>load().catch(fail);$('#os').onchange=()=>load().catch(fail);$('#oq').onkeydown=e=>{if(e.key==='Enter')load().catch(fail)};await load()};
async function orderDetail(id){openModal('Order','<div class="muted">Loading…</div>');try{renderOrder(await ctl('orderDetail',{orderId:id}))}catch(e){closeModal();fail(e)}}
function renderOrder(d){const o=d.order,c=d.customer||{};

  <div class="card"><h3>State</h3>Status ${badge(o.orderStatus)}<br>Payment ${esc(o.paymentMethod)} ${badge(o.paymentStatus)}<br>Delivery ${money(o.deliveryFee,o.currency)}<br><b>Total ${money(o.total,o.currency)}</b><br><span class="muted">Created ${dt(o.createdAt)}</span>${d.confirmation?`<br>Confirmation ${badge(d.confirmation.STATUS)} until ${dt(d.confirmation.EXPIRES_AT)}`:''}</div></div>
  <div class="card"><h3>Items (production snapshot)</h3>${d.items.map(i=>`<div style="display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding:8px 0"><img class="thumb" src="${esc(i.designAssetUrl||i.MOCKUP_PREVIEW_URL)}"><div style="flex:1"><b>${esc(i.PRODUCT_NAME)}</b> · ${esc(i.DESIGN_NAME)}<div class="mono muted" style="font-size:10px">${esc(i.COLOR)} · ${esc(i.SIZE)} · design ${esc(i.DESIGN_SIDE)} ${esc(i.DESIGN_PRINT_SIZE)}cm · logo ${esc(i.LOGO_SIDE)} ${esc(i.LOGO_SIZE_CM)}cm</div></div><div class="mono">×${esc(i.QUANTITY)} · ${money(i.LINE_TOTAL,o.currency)}</div></div>`).join('')}</div>
  <div class="card"><h3>Order status — allowed next steps</h3><div class="acts">${o.allowedTransitions.length?o.allowedTransitions.map(s=>`<button class="btn ${s==='CANCELED'?'d':'a'} sm" onclick="setOrderStatus('${o.orderId}','${s}')">${s.replace(/_/g,' ')}</button>`).join(''):'<span class="muted">Final state</span>'}</div>
  <h3 style="margin-top:14px">Payment status</h3><div class="acts">${['PENDING','PAID','FAILED','REFUNDED'].map(s=>`<button class="btn sm" ${s===o.paymentStatus?'disabled':''} onclick="setPayment('${o.orderId}','${s}')">${s}</button>`).join('')}</div></div>
  <div class="card"><h3>History</h3>${(d.history||[]).map(h=>`<div class="mono" style="font-size:10px">${dt(h.CREATED_AT)} · ${esc(h.ACTION)} · ${esc(h.OLD_VALUE)} → ${esc(h.NEW_VALUE)}</div>`).join('')||'<span class="muted">—</span>'}</div>`}
async function setOrderStatus(id,s){if(!confirm(`Move order to ${s.replace(/_/g,' ')}?`))return;try{const r=await ctl('transitionOrder',{orderId:id,nextStatus:s});renderOrder(r.detail);toast('Order → '+s);if(S.view==='orders')$('#oGo')?.click()}catch(e){fail(e)}}
async function setPayment(id,s){try{const r=await ctl('transitionPayment',{orderId:id,nextStatus:s});renderOrder(r.detail);toast('Payment → '+s)}catch(e){fail(e)}}

const CARE_LABELS={WASH_INSIDE_OUT:'Wash inside out',BELOW_30:'Below 30°C',DELICATE:'Delicate cycle',NO_SOFTENER:'No fabric softener',IRON_INSIDE_OUT:'Iron inside out',NO_BLEACH:'No bleach',NO_TUMBLE_DRY:'No tumble dry',LINE_DRY:'Line dry',NO_DRY_CLEAN:'No dry clean'};
VIEWS.products=async()=>{await loadCatalog();$('#main').innerHTML=header('Products','Name, price, colours, images, material, care and size chart. Everything here appears on the website product page.','<button class="btn a" onclick="editProduct()">+ New product</button><button class="btn" onclick="go(\'products\')">↻</button>')+
  `<div class="tw"><table><thead><tr><th></th><th>Product</th><th>Type</th><th>Price</th><th>Colours</th><th>Size chart</th><th>Material & care</th><th>Status</th><th></th></tr></thead><tbody>${S.cat.products.map(p=>`<tr><td><img class="thumb" src="${esc((p.assets.find(a=>a.assetUrl)||{}).assetUrl||'')}"></td><td><b>${esc(p.productName)}</b><div class="muted" style="font-size:11px" dir="rtl">${esc(p.productNameAr)}</div><div class="mono muted" style="font-size:10px">${esc(p.productId)}</div></td><td class="mono">${esc(p.category)} · ${esc(p.productType)}</td><td class="mono">${money(p.price,p.currency)}</td><td>${esc(p.colors.join(', '))}</td><td>${p.sizeGuide.filter(s=>s.widthCm!=='').length?`<span class="badge b-TRUE">${p.sizeGuide.filter(s=>s.active).length} sizes</span>`:'<span class="badge b-FALSE">missing</span>'}</td><td>${p.material?`<span class="badge b-TRUE">${esc(p.specTemplate||'custom')}</span>`:'<span class="badge b-FALSE">missing</span>'}</td><td>${badge(p.active?'ACTIVE':'FALSE')}</td><td><button class="btn sm" onclick="editProduct('${p.productId}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`};
let PE={tab:'basics'};
async function editProduct(id,tab){const p=S.cat.products.find(x=>x.productId===id)||{assets:[],sizeGuide:[],active:false,careIcons:[],sizes:[]};PE={tab:tab||PE.tab||'basics',id};if(!id)PE.tab='basics';
  if(!S.tpl){try{S.tpl=await ctl('specTemplates')}catch(_){S.tpl={templates:[],careIcons:Object.keys(CARE_LABELS)}}}
  const pair=(label,k,en,ar,area)=>`<div class="f full" style="margin:10px 0 4px"><label>${label}</label><div class="grid2">${area?`<textarea class="in" id="${k}" rows="2" placeholder="English">${esc(en)}</textarea><textarea class="in" id="${k}Ar" rows="2" dir="rtl" placeholder="العربي">${esc(ar)}</textarea>`:`<input class="in" id="${k}" value="${esc(en)}" placeholder="English"><input class="in" id="${k}Ar" value="${esc(ar)}" dir="rtl" placeholder="العربي">`}</div></div>`;
  const tabs=[['basics','Basics'],['care','Material & Care'],['size','Size chart'],['images','Colours & images']];
  const body=`<div class="seg" style="margin-bottom:14px" id="peTabs">${tabs.map(([k,l])=>`<button data-t="${k}" ${!id&&k!=='basics'?'disabled':''}>${l}</button>`).join('')}</div>
  <div data-pane="basics"><div class="grid2">${F('Name (EN)','pName',p.productName)}${F('Name (AR)','pNameAr',p.productNameAr,'text','dir="rtl"')}${F('Product code','pCode',p.productCode)}${F('Price','pPrice',p.price,'number')}${F('Type','pType',p.productType,'select',opt(['T_SHIRT','LONG_SLEEVE','CREWNECK','HOODIE','OTHER'],p.productType))}${F('Category','pCat',p.category,'select',opt(['ADULT','KIDS'],p.category||'ADULT'))}${F('Display order','pOrder',p.displayOrder||99,'number')}${F('Status','pActive','','select',opt([['true','ACTIVE (shown on website)'],['false','INACTIVE (hidden)']],String(!!p.active)))}</div>
   ${pair('Tagline (small line above the name)','pTag',p.tagline||'',p.taglineAr||'')}${pair('Description (Details tab)','pDesc',p.description||'',p.descriptionAr||'',true)}${id?'':'<p class="note" style="margin-top:12px">Save first, then fill Material & Care, Size chart and images. New products start INACTIVE until you activate them.</p>'}</div>
  <div data-pane="care"><div class="card" style="background:var(--sub)"><h3>Fill from the TEMPORARY™ guide</h3><div class="acts"><select class="in" id="pTpl" style="width:300px">${opt([['','Choose a product template…']].concat((S.tpl.templates||[]).map(t=>[t.id,`${t.name} — ${t.material}, ${t.gsm} gsm, ${t.fit}`])),p.specTemplate||'')}</select><button class="btn a sm" onclick="applyTpl('${id||''}')">Apply template</button></div><p class="note" style="margin-top:8px">Fills tagline, material, weight, fit, fit text, construction, care icons and the size chart from your size-chart & care-guide images. Price, name, colours and images are not touched. You can edit everything after.</p></div>
   ${pair('Material (one per line)','pMat',p.material||'',p.materialAr||'',true)}${pair('Inside / lining (optional, e.g. Internal Cotton Fleece)','pLin',p.lining||'',p.liningAr||'')}
   <div class="grid2">${F('Fabric weight (gsm number)','pGsm',p.gsm)}${F('Size chart type','pChart','','select',opt([['','Automatic'],['WEIGHT','Adults — Avg. weight (kg)'],['AGE','Kids — Age range']],p.sizeChartType||''))}</div>
   ${pair('Fit (short, e.g. Oversized Fit)','pFit',p.fit||'',p.fitAr||'')}${pair('Fit description (shown with the size chart)','pFitNote',p.fitNote||'',p.fitNoteAr||'',true)}${pair('Construction (one per line)','pCons',p.construction||'',p.constructionAr||'',true)}
   <div class="f full" style="margin-top:6px"><label>Care icons</label><div style="display:flex;flex-wrap:wrap;gap:10px">${(S.tpl.careIcons||Object.keys(CARE_LABELS)).map(k=>`<label class="pill" style="padding:6px 10px;font-size:11px;cursor:pointer"><input type="checkbox" data-care="${k}" ${(p.careIcons||[]).includes(k)?'checked':''}> ${esc(CARE_LABELS[k]||k)}</label>`).join('')}</div><span class="muted" style="font-size:11px">Icon words are edited in Website Pages ▸ Product page ▸ Care icons.</span></div>
   ${pair('Extra care notes (optional, one per line)','pCare',p.careEn||'',p.careAr||'',true)}
   <div class="f full">${F('Fabric close-up image URL (optional)','pFab',p.fabricImageUrl||'')}</div></div>
  <div data-pane="size"><p class="note" style="margin-bottom:10px">One row per size. Adults: fill Avg. weight. Kids: fill Age. Only ACTIVE sizes can be bought and appear in the chart. Measurements in cm.</p><div class="tw"><table><thead><tr><th>Size</th><th>Width</th><th>Length</th><th>Weight min</th><th>Weight max</th><th>Age min</th><th>Age max</th><th>Active</th><th></th></tr></thead><tbody id="szRows">${(p.sizeGuide||[]).map(sizeRow).join('')}</tbody></table></div><div class="acts" style="margin-top:10px"><button class="btn sm" onclick="$('#szRows').insertAdjacentHTML('beforeend',sizeRow({active:true}))">+ Add size</button><button class="btn p sm" onclick="saveSizes('${id||''}')">Save size chart</button></div></div>
  <div data-pane="images"><p class="note" style="margin-bottom:10px">Each active MOCKUP image = one colour on the website. DETAIL images show as extra photos on the product page.</p><div class="tw"><table><thead><tr><th></th><th>Colour</th><th>Type</th><th>URL</th><th>Active</th><th></th></tr></thead><tbody>${p.assets.map(a=>`<tr><td><img class="thumb" src="${esc(a.assetUrl)}"></td><td>${esc(a.color)}</td><td>${esc(a.assetType)}</td><td class="mono" style="font-size:10px;max-width:220px;overflow:hidden;text-overflow:ellipsis">${esc(a.assetUrl)}</td><td>${badge(a.active?'TRUE':'FALSE')}</td><td><button class="btn sm" onclick='editAsset(${JSON.stringify(id)},${JSON.stringify(a.assetId)})'>Edit</button></td></tr>`).join('')}</tbody></table></div><button class="btn sm" style="margin-top:8px" onclick='editAsset(${JSON.stringify(id)})'>+ Add image / colour</button></div>`;
  openModal(id?'Edit '+p.productName:'New product',body,`${id&&S.siteUrl?`<a class="btn" target="_blank" href="${esc(S.siteUrl)}#/product/${encodeURIComponent(id)}">View on website ↗</a>`:''}<button class="btn" onclick="closeModal()">Close</button><button class="btn p" id="peSave" onclick="saveProduct('${id||''}')">Save product</button>`);
  $('.modal').style.width='min(1040px,100%)';const show=k=>{PE.tab=k;$$('#peTabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===k));$$('[data-pane]').forEach(x=>x.style.display=x.dataset.pane===k?'':'none');$('#peSave').style.display=(k==='basics'||k==='care')?'':'none'};
  $$('#peTabs button').forEach(b=>b.onclick=()=>show(b.dataset.t));show(PE.tab)}
function sizeRow(s){const n=(k,w=64)=>`<input class="in" style="width:${w}px" data-k="${k}" type="${k==='sizeLabel'?'text':'number'}" value="${esc(s[k]??'')}">`;return `<tr data-id="${esc(s.sizeId||'')}"><td>${n('sizeLabel',80)}</td><td>${n('widthCm')}</td><td>${n('lengthCm')}</td><td>${n('avgWeightMinKg')}</td><td>${n('avgWeightMaxKg')}</td><td>${n('ageMinYears')}</td><td>${n('ageMaxYears')}</td><td><input type="checkbox" data-k="active" ${s.active!==false?'checked':''}></td><td><button class="btn sm" onclick="this.closest('tr').remove()" title="Remove unsaved row" ${s.sizeId?'disabled':''}>✕</button></td></tr>`}
async function saveSizes(pid){const sizes=$$('#szRows tr').map((tr,i)=>{const o={sizeId:tr.dataset.id,displayOrder:i+1};$$('[data-k]',tr).forEach(x=>o[x.dataset.k]=x.type==='checkbox'?x.checked:x.value.trim());return o}).filter(o=>o.sizeLabel);
  try{await ctl('saveProductSizes',{productId:pid,sizes});await loadCatalog();toast('Size chart saved · live on website');editProduct(pid,'size')}catch(e){fail(e)}}
async function applyTpl(pid){const t=V('pTpl');if(!t)return toast('Choose a template first',true);if(!confirm('Replace material, care, fit and size chart of this product with the template?'))return;
  try{const r=await ctl('applySpecTemplate',{productId:pid,templateId:t});await loadCatalog();toast(`Template applied · ${r.result.sizesUpdated.length} sizes updated, ${r.result.sizesAdded.length} added`);editProduct(pid,'care')}catch(e){fail(e)}}
async function saveProduct(id){const p={productId:id,productName:V('pName'),productNameAr:V('pNameAr'),productCode:V('pCode'),price:Number(V('pPrice')),productType:V('pType'),category:V('pCat'),displayOrder:Number(V('pOrder')),active:V('pActive')==='true',tagline:V('pTag'),taglineAr:V('pTagAr'),description:V('pDesc'),descriptionAr:V('pDescAr')};
  if(id)Object.assign(p,{material:V('pMat'),materialAr:V('pMatAr'),lining:V('pLin'),liningAr:V('pLinAr'),gsm:V('pGsm'),sizeChartType:V('pChart'),fit:V('pFit'),fitAr:V('pFitAr'),fitNote:V('pFitNote'),fitNoteAr:V('pFitNoteAr'),construction:V('pCons'),constructionAr:V('pConsAr'),careEn:V('pCare'),careAr:V('pCareAr'),fabricImageUrl:V('pFab'),careIcons:$$('[data-care]').filter(x=>x.checked).map(x=>x.dataset.care)});
  try{const r=await ctl('saveProduct',p);await loadCatalog();toast('Product saved · live on website');editProduct(r.product.productId);if(S.view==='products')VIEWS.products()}catch(e){fail(e)}}
function editAsset(pid,aid){const p=S.cat.products.find(x=>x.productId===pid),a=(p.assets.find(x=>x.assetId===aid))||{active:true,assetType:'MOCKUP',displayOrder:p.assets.length+1};
  openModal('Product image',`<div class="grid2">${F('Colour','aColor',a.color)}${F('Type','aType','','select',opt(['MOCKUP','DETAIL'],a.assetType))}<div class="full">${F('Image URL (https, allowed origin)','aUrl',a.assetUrl)}</div>${F('Repository path (optional)','aPath',a.assetPath)}${F('Display order','aOrder',a.displayOrder,'number')}${F('Active','aActive','','select',opt([['true','ACTIVE'],['false','INACTIVE']],String(a.active)))}</div>${a.assetUrl?`<img src="${esc(a.assetUrl)}" style="max-width:200px;margin-top:12px;border:1px solid var(--line)">`:''}`,
  `<button class="btn" onclick="editProduct('${pid}','images')">Back</button><button class="btn p" onclick="saveAsset('${pid}','${aid||''}')">Save</button>`)}
async function saveAsset(pid,aid){try{await ctl('saveProductAsset',{productId:pid,assetId:aid,color:V('aColor'),assetType:V('aType'),assetUrl:V('aUrl'),assetPath:V('aPath'),displayOrder:Number(V('aOrder')),active:V('aActive')==='true'});await loadCatalog();toast('Image saved');editProduct(pid,'images')}catch(e){fail(e)}}

VIEWS.designs=async()=>{await loadCatalog();$('#main').innerHTML=header('Designs','DESIGNS (identity) · DESIGN_ASSETS (artwork files)','<button class="btn a" onclick="editDesign()">+ New design</button>')+
  `<div class="tw"><table><thead><tr><th></th><th>Design</th><th>Code</th><th>Remaining</th><th>Status</th><th></th></tr></thead><tbody>${S.cat.designs.map(d=>`<tr><td><img class="thumb" src="${esc((d.assets[0]||{}).assetUrl||'')}"></td><td><b>${esc(d.designName)}</b><div class="muted" style="font-size:11px">${esc(d.designNameAr)}</div></td><td class="mono">${esc(d.designCode)}</td><td class="mono">${d.remaining} / ${d.productionLimit}</td><td>${badge(d.active?d.inventoryStatus:'FALSE')}</td><td><button class="btn sm" onclick="editDesign('${d.designId}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`};

  ${id?`<div class="card" style="margin-top:12px"><h3>Artwork (DESIGN_ASSETS) — side FRONT/BACK or empty = both</h3>${d.assets.map(a=>`<div style="display:flex;gap:10px;align-items:center;margin-bottom:6px"><img class="thumb" src="${esc(a.assetUrl)}"><span class="mono" style="flex:1;font-size:10px">${esc(a.side||'ANY')} · ${esc(a.assetUrl)}</span>${badge(a.active?'TRUE':'FALSE')}<button class="btn sm" onclick='editDesignAsset(${JSON.stringify(id)},${JSON.stringify(a.assetId)})'>Edit</button></div>`).join('')}<button class="btn sm" onclick='editDesignAsset(${JSON.stringify(id)})'>+ Add artwork</button></div>`:''}`,

async function saveDesign(id){try{const p={designId:id,designName:V('dName'),designNameAr:V('dNameAr'),designCode:V('dCode'),displayOrder:Number(V('dOrder')),active:V('dActive')==='true',description:V('dDesc'),descriptionAr:V('dDescAr')};if(!id)p.productionLimit=Number(V('dLimit'));const r=await ctl('saveDesign',p);await loadCatalog();toast('Design saved');editDesign(r.design.designId);if(S.view==='designs')VIEWS.designs()}catch(e){fail(e)}}

/* Shared subject extraction — identical algorithm to the website collection view. */
const SUBJ=new Map();
function subjectUrl(src){if(!src)return Promise.resolve('');if(SUBJ.has(src))return SUBJ.get(src);const p=new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{try{const sc=Math.min(1,900/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h),D=d.data;const refs=[[2,2],[w-3,2],[2,h-3],[w-3,h-3],[w>>1,2],[2,h>>1],[w-3,h>>1]].map(([a,b])=>{const i=(b*w+a)*4;return [D[i],D[i+1],D[i+2]]});const bg=(r,g,b)=>{const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx<55||mx-mn>75)return false;return refs.some(f=>Math.hypot(r-f[0],g-f[1],b-f[2])<66)};const seen=new Uint8Array(w*h),q=[];const push=k=>{if(k>=0&&k<w*h&&!seen[k]){seen[k]=1;q.push(k)}};for(let i=0;i<w;i++){push(i);push((h-1)*w+i)}for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}for(let z=0;z<q.length;z++){const k=q[z],i=k*4;if(bg(D[i],D[i+1],D[i+2])){D[i+3]=0;const X=k%w;if(X>0)push(k-1);if(X<w-1)push(k+1);push(k-w);push(k+w)}}x.putImageData(d,0,0);res(c.toDataURL('image/png'))}catch(_){res(src)}};im.onerror=()=>res(src);im.src=src});SUBJ.set(src,p);return p}

function pgBody(){const m=PG.m,q=PG.q.trim().toLowerCase();let list=q?m.fields.filter(f=>[f.key,f.label,f.group,f.en,f.ar].some(v=>String(v||'').toLowerCase().includes(q))):m.fields.filter(f=>f.page===PG.page);

  const changed=(v.en!==f.defaultEn||v.ar!==f.defaultAr)&&!f.custom&&(f.defaultEn||f.defaultAr);
  return `<div style="padding:10px 0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:5px"><label style="font-size:11px;font-weight:700">${esc(f.label)} ${f.type!=='PLAIN'&&v.en&&!v.ar?'<span class="badge" style="color:var(--warn)">Arabic missing</span>':''}</label><span class="mono muted" style="font-size:9px">${esc(f.key)} ${changed?`· <a data-reset="${esc(f.key)}" style="cursor:pointer;color:var(--accent)">reset to default</a>`:''}</span></div>
   ${f.type==='PLAIN'?ctl2('en',v.en,'dir="ltr"'):`<div class="grid2">${ctl2('en',v.en,'placeholder="English"')}${ctl2('ar',v.ar,'dir="rtl" placeholder="العربي (مصري)"')}</div>`}</div>`}

function pgPush(){const en={},ar={};Object.keys(PG.dirty).forEach(k=>{const d=PG.dirty[k];if('en' in d)en[k]=d.en;if('ar' in d)ar[k]=d.ar});sendPreview('pgPreview',{content:{en,ar},lang:PG.lang,route:pageRoute(PG.page)})}

function polEditor(){const d=POL.d,pr=(l,k,area,rows=3)=>`<div class="f full" style="margin-bottom:8px"><label>${l}</label><div class="grid2">${area?`<textarea class="in" rows="${rows}" data-f="${k}En">${esc(d[k+'En'])}</textarea><textarea class="in" rows="${rows}" dir="rtl" data-f="${k}Ar">${esc(d[k+'Ar'])}</textarea>`:`<input class="in" data-f="${k}En" value="${esc(d[k+'En'])}"><input class="in" dir="rtl" data-f="${k}Ar" value="${esc(d[k+'Ar'])}">`}</div></div>`;

VIEWS.inquiries=async()=>{$('#main').innerHTML=header('Inquiries','Messages sent from the website Contact page. Each one is also emailed to the contact email set in Website Pages ▸ Contact page.',`<input class="in" id="iqQ" placeholder="Search name, email, order, text…" style="width:260px" value="${esc(INQ.q)}"><button class="btn" id="iqGo">↻</button>`)+'<div id="iqChips" class="acts" style="margin-bottom:12px"></div><div id="iqList"></div>';
  const load=async()=>{const r=await ctl('inquiries',{status:INQ.status,search:INQ.q});INQ.items=r.items;$('#iqChips').innerHTML=['ALL'].concat(r.statuses).map(s=>`<button class="btn sm ${s===INQ.status?'p':''}" data-st="${s}">${s.replace('_',' ')}${s!=='ALL'?' · '+(r.counts[s]||0):''}</button>`).join('');$$('#iqChips button').forEach(b=>b.onclick=()=>{INQ.status=b.dataset.st;load().catch(fail)});
   $('#iqList').innerHTML=`<div class="tw"><table><thead><tr><th>Received</th><th>From</th><th>Topic</th><th>Order</th><th>Message</th><th>Status</th><th></th></tr></thead><tbody>${r.items.length?r.items.map(x=>`<tr><td class="mono">${dt(x.createdAt)}</td><td><b>${esc(x.name)}</b><div class="mono muted" style="font-size:10px">${esc(x.email)}${x.phone?' · '+esc(x.phone):''}</div></td><td>${esc(TOPIC[x.topic]||x.topic)}<div class="mono muted" style="font-size:10px">${esc(x.lang.toUpperCase())}</div></td><td class="mono">${esc(x.orderNumber||'—')}</td><td style="max-width:320px"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" ${x.lang==='ar'?'dir="rtl"':''}>${esc(x.message)}</div></td><td><span class="badge b-${({NEW:'PENDING',IN_PROGRESS:'PROCESSING',REPLIED:'CONFIRMED',CLOSED:'DELIVERED'})[x.status]||''}">${esc(x.status.replace('_',' '))}</span></td><td><button class="btn sm" onclick="iqOpen('${x.inquiryId}')">Open</button></td></tr>`).join(''):'<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">No inquiries</td></tr>'}</tbody></table></div>`};
  $('#iqGo').onclick=()=>load().catch(fail);$('#iqQ').onkeydown=e=>{if(e.key==='Enter'){INQ.q=e.target.value;load().catch(fail)}};await load()};
function iqOpen(id){const x=INQ.items.find(i=>i.inquiryId===id);if(!x)return;const subj=encodeURIComponent(`Re: TEMPORARY™ — ${TOPIC[x.topic]||x.topic}${x.orderNumber?' · '+x.orderNumber:''}`);
  openModal(`${x.name} · ${TOPIC[x.topic]||x.topic}`,`<div class="grid2"><div class="card"><h3>From</h3><b>${esc(x.name)}</b><br><a class="mono" href="mailto:${esc(x.email)}">${esc(x.email)}</a>${x.phone?`<br><a class="mono" href="tel:${esc(x.phone)}">${esc(x.phone)}</a>`:''}<br><span class="muted">Website language: ${esc(x.lang.toUpperCase())}${x.customerId?' · signed-in customer '+esc(x.customerId):''}</span></div><div class="card"><h3>Details</h3>Topic: <b>${esc(TOPIC[x.topic]||x.topic)}</b><br>Order: <b class="mono">${esc(x.orderNumber||'—')}</b><br>Received: ${dt(x.createdAt)}<br><span class="mono muted" style="font-size:10px">${esc(x.inquiryId)}</span></div></div>
   <div class="card"><h3>Message</h3><div style="white-space:pre-wrap;line-height:1.7" ${x.lang==='ar'?'dir="rtl"':''}>${esc(x.message)}</div></div>
   <div class="grid2">${F('Status','iqSt','','select',opt(['NEW','IN_PROGRESS','REPLIED','CLOSED'],x.status))}<div></div>${F('Internal note (only admins see this)','iqNote',x.adminNote,'textarea')}</div>`,
   `<a class="btn" href="mailto:${esc(x.email)}?subject=${subj}">Reply by email ↗</a><button class="btn" onclick="closeModal()">Close</button><button class="btn p" onclick="iqSave('${x.inquiryId}')">Save</button>`)}
async function iqSave(id){try{await ctl('saveInquiry',{inquiryId:id,status:V('iqSt'),adminNote:V('iqNote')});closeModal();toast('Inquiry updated');go('inquiries')}catch(e){fail(e)}}

/* ---------- delivery ---------- */
VIEWS.delivery=async()=>{const r=await ctl('delivery');S.zones=r.zones;$('#main').innerHTML=header('Delivery','DELIVERY_ZONES. Area "*" = whole governorate. Checkout charges exactly these fees.','<button class="btn a" onclick="editZone()">+ Zone</button>')+
  `<div class="tw"><table><thead><tr><th>Governorate</th><th>Area</th><th>Fee</th><th>ETA</th><th>Status</th><th></th></tr></thead><tbody>${r.zones.map(z=>`<tr><td><b>${esc(z.governorate)}</b></td><td>${esc(z.area)}</td><td class="mono">${money(z.deliveryFee)}</td><td>${esc(z.estimatedDays)}</td><td>${badge(z.active?'ACTIVE':'FALSE')}</td><td><button class="btn sm" onclick="editZone('${z.zoneId}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`};
function editZone(id){const z=(S.zones||[]).find(x=>x.zoneId===id)||{area:'*',active:true,deliveryFee:0};openModal(id?'Edit zone':'New zone',`<div class="grid2">${F('Governorate','zG',z.governorate)}${F('Area (* = all)','zA',z.area)}${F('Fee','zF',z.deliveryFee,'number')}${F('Estimated days','zE',z.estimatedDays)}${F('Status','zS','','select',opt([['true','ACTIVE'],['false','INACTIVE']],String(z.active)))}</div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="saveZone('${id||''}')">Save</button>`)}
async function saveZone(id){try{await ctl('saveDeliveryZone',{zoneId:id,governorate:V('zG'),area:V('zA'),deliveryFee:Number(V('zF')),estimatedDays:V('zE'),active:V('zS')==='true'});closeModal();toast('Zone saved · live');go('delivery')}catch(e){fail(e)}}

/* ---------- notifications / settings ---------- */
VIEWS.notifications=async()=>{const s=await ctl('settings');$('#main').innerHTML=header('Notifications','CONFIG notification keys','<button class="btn a" onclick="saveNotif()">Save</button>')+
  `<div class="card">${F('Admin recipients (comma, max 2)','nE',s.ADMIN_NOTIFICATION_EMAILS)}<label class="mono" style="display:block;margin-top:10px"><input type="checkbox" id="nO" ${s.ADMIN_NEW_ORDER_NOTIFICATIONS!=='FALSE'?'checked':''}> Email admins on every new order</label><label class="mono" style="display:block;margin-top:6px"><input type="checkbox" id="nC" ${s.ORDER_CONFIRMATION_EMAIL_ENABLED!=='FALSE'?'checked':''}> Send customers the confirmation email</label></div><div class="card"><h3>Test</h3><div class="acts"><input class="in" id="nT" style="width:260px" placeholder="email"><button class="btn" onclick="testMail()">Send test</button></div></div><div class="card"><h3>Email log</h3><div id="nLog" class="muted">Loading…</div></div>`;
  const l=await ctl('emailLog');$('#nLog').innerHTML=l.items.slice(0,40).map(x=>`<div class="mono" style="font-size:10px">${dt(x.SENT_AT)} · ${esc(x.TYPE)} · ${esc(x.RECIPIENT)} · ${esc(x.STATUS)} ${esc(x.ERROR)}</div>`).join('')||'—'};
async function saveNotif(){try{await ctl('saveNotifications',{emails:V('nE'),newOrderNotifications:V('nO'),customerConfirmationEmails:V('nC')});toast('Saved')}catch(e){fail(e)}}
async function testMail(){try{const r=await ctl('sendTestEmail',{email:V('nT')});toast('Sent to '+r.email)}catch(e){fail(e)}}
const SETTING_KEYS=[['STORE_MODE','select',['OPEN','CLOSED']],['COD_ENABLED','select',['TRUE','FALSE']],['CONFIRMATION_HOURS','number'],['MAX_QTY_PER_LINE','number'],['MAX_CART_QTY','number'],['BRAND_NAME','text'],['CUSTOMER_SITE_URL','text'],['CONFIRMATION_PAGE_URL','text'],['LOGO_ASSET_URL','text'],['ALLOWED_ASSET_ORIGINS','text'],['ALLOWED_PARENT_ORIGINS','text']];
VIEWS.settings=async()=>{const s=await ctl('settings');S.settings=s;$('#main').innerHTML=header('Settings',`CONFIG. Current SITE_REVISION ${s.SITE_REVISION}.`,'<button class="btn a" onclick="saveSettings()">Save changed</button>')+`<div class="card"><div class="grid2">${SETTING_KEYS.map(([k,t,o])=>t==='select'?F(k,'st_'+k,'','select',opt(o,s[k])):F(k,'st_'+k,s[k],t)).join('')}</div><p class="note" style="margin-top:12px">Read-only: CURRENCY ${esc(s.CURRENCY)} · SESSION_HOURS ${esc(s.SESSION_HOURS)} · ADMIN_SESSION_HOURS ${esc(s.ADMIN_SESSION_HOURS)}</p></div>`};
async function saveSettings(){const values={};SETTING_KEYS.forEach(([k])=>{if(String(V('st_'+k))!==String(S.settings[k]))values[k]=V('st_'+k)});if(!Object.keys(values).length)return toast('Nothing changed');try{await ctl('saveSettings',{values});await loadCatalog();toast('Settings saved');go('settings')}catch(e){fail(e)}}

/* ---------- admins / audit / QA ---------- */
VIEWS.admins=async()=>{const r=await ctl('admins');$('#main').innerHTML=header('Admin Users','ADMIN_USERS (OWNER only)','<button class="btn a" onclick="addAdmin()">+ Admin</button>')+`<div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${r.admins.map(a=>`<tr><td>${esc(a.displayName)}</td><td class="mono">${esc(a.email)}</td><td>${esc(a.role)}</td><td>${badge(a.active?'ACTIVE':'FALSE')}</td><td><button class="btn sm ${a.active?'d':''}" onclick="adminStatus('${a.adminId}',${!a.active})">${a.active?'Disable':'Enable'}</button></td></tr>`).join('')}</tbody></table></div>`};
function addAdmin(){openModal('Add admin',`<div class="grid2">${F('Google email','adE')}${F('Display name','adN')}${F('Role','adR','','select',opt(['ADMIN','OPERATIONS','PRODUCTION','SUPPORT','VIEWER','OWNER'],'ADMIN'))}</div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="saveAdmin()">Save</button>`)}
async function saveAdmin(){try{await ctl('saveAdminUser',{email:V('adE'),displayName:V('adN'),role:V('adR')});closeModal();go('admins')}catch(e){fail(e)}}
async function adminStatus(id,a){try{await ctl('saveAdminUserStatus',{adminId:id,active:a});go('admins')}catch(e){fail(e)}}
VIEWS.audit=async()=>{$('#main').innerHTML=header('Audit Log','Every admin mutation with old → new values','<input class="in" id="auQ" placeholder="Search…" style="width:220px"><button class="btn" id="auG">↻</button>')+'<div id="auL"></div>';const load=async()=>{const r=await ctl('audit',{search:V('auQ'),limit:300});$('#auL').innerHTML=`<div class="tw"><table><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th><th>Old</th><th>New</th></tr></thead><tbody>${r.items.map(a=>`<tr><td class="mono">${dt(a.CREATED_AT)}</td><td class="mono" style="font-size:10px">${esc(a.ACTOR_TYPE)} ${esc(a.ACTOR_ID)}</td><td><b>${esc(a.ACTION)}</b></td><td class="mono" style="font-size:10px">${esc(a.ENTITY_TYPE)} ${esc(a.ENTITY_ID)}</td><td class="mono" style="font-size:10px;max-width:260px;overflow:hidden;text-overflow:ellipsis" title="${esc(a.OLD_VALUE)}">${esc(a.OLD_VALUE)}</td><td class="mono" style="font-size:10px;max-width:260px;overflow:hidden;text-overflow:ellipsis" title="${esc(a.NEW_VALUE)}">${esc(a.NEW_VALUE)}</td></tr>`).join('')}</tbody></table></div>`};$('#auG').onclick=()=>load().catch(fail);await load()};
VIEWS.qa=async()=>{const [h,m]=await Promise.all([ctl('health'),ctl('missingPlacements')]);
  const tests=['Change a product name in PRODUCTS → Admin + Website update','Change PRICE → website shows it AND checkout charges it','Change a PRODUCT_ASSETS image → website + Admin preview change','Change a DESIGN_ASSETS file → website + Admin change','Move artwork in Placement Studio → Save → website customizer changes','Move a collection mockup → Save → revision bumps → collection view changes','Change default/enabled theme → website + Admin preview change','Edit SITE_CONTENT text → website changes','Change production limit / sold-out → website availability changes','Change a delivery fee → checkout uses it','Place an order → GS validates → Sheet → Admin sees it','Same account on laptop + phone → same bag','Customer cannot change price / stock / totals (all server-computed)'];
  $('#main').innerHTML=header('Health & Launch QA','Server health from GS plus the 13 contract tests','<button class="btn" onclick="go(\'qa\')">↻</button>')+`<div class="card"><h3>Server</h3><div class="mono" style="font-size:11px">${badge(h.status)} revision ${h.revision} · minute job ${h.minuteJob?'✓':'✗'} · daily job ${h.dailyJob?'✓':'✗'} · owners ${h.owners} · active delivery zones ${h.activeDeliveryZones} · email quota ${h.emailQuota??'—'}<br>Missing sheets: ${esc(h.missingSheets.join(', ')||'none')} · Missing columns: ${esc(JSON.stringify(h.missingColumns))}<br>Missing placements: <b>${m.items.length}</b></div></div>
  ${m.items.length?`<div class="card"><h3>Missing placement identities</h3><div style="max-height:220px;overflow:auto">${m.items.map(x=>`<div class="mono" style="font-size:10px">${esc(x.productName)} · ${esc(x.color)} · ${x.artworkType} ${esc(x.designId)} · ${x.side} · ${x.printSize}</div>`).join('')}</div></div>`:''}
  <div class="card"><h3>Contract acceptance tests (manual)</h3>${tests.map((t,i)=>`<label style="display:block;margin-bottom:6px"><input type="checkbox"> <b>${i+1}.</b> ${t}</label>`).join('')}</div>`};

/* ---------- boot ---------- */
(async()=>{initBridge();if(await restore())enter();else initGoogle()})();
</script>
</body>
