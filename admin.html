<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEMPORARY™ / Admin</title>
<link rel="preconnect" href="https://accounts.google.com">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#070807;--panel:#0d100f;--panel2:#111513;--line:rgba(235,243,238,.12);
  --text:#f0f3ee;--muted:#9ca89f;--accent:#dce7df;--danger:#d96b6b;--ok:#78c29b;
}
*{box-sizing:border-box}html{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:radial-gradient(circle at 20% 0%,rgba(130,180,150,.08),transparent 32%),var(--bg);min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);backdrop-filter:blur(18px);background:rgba(7,8,7,.88)}
.brand{font-weight:800;letter-spacing:.22em;font-size:13px}
.statusbar{font-size:10px;color:var(--muted);letter-spacing:.15em}
.wrap{max-width:1500px;margin:0 auto;padding:26px}
.login{min-height:82vh;display:grid;place-items:center}
.login-card{width:min(520px,100%);padding:38px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.03),rgba(255,255,255,.01));box-shadow:0 30px 100px rgba(0,0,0,.4)}
.kicker{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.title{font-size:clamp(42px,7vw,84px);line-height:.92;margin:18px 0 26px;font-family:Georgia,serif;font-weight:400}
.note{color:var(--muted);font-size:13px;line-height:1.6}
.google-slot{margin-top:22px;min-height:44px}
.error{margin-top:15px;color:var(--danger);font-size:12px;line-height:1.5}
.app{display:none}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.nav button,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 14px;border-radius:999px;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.nav button.active,.btn.primary{background:var(--accent);color:#071008;border-color:var(--accent)}
.grid-metrics{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:22px}
.metric{padding:15px;border:1px solid var(--line);background:var(--panel2)}
.metric span{display:block;color:var(--muted);font-size:8px;letter-spacing:.13em;text-transform:uppercase}
.metric strong{display:block;margin-top:10px;font-size:26px}
.section{border:1px solid var(--line);background:rgba(13,16,15,.72);padding:20px;margin-top:16px}
.section-head{display:flex;justify-content:space-between;gap:14px;align-items:end;margin-bottom:18px}
.section-title{font:400 34px/1 Georgia,serif;margin:0}
.controls{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.field label{display:block;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:10px 11px;border:1px solid var(--line);background:#090b0a;color:var(--text);border-radius:8px}
.placement-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(340px,.8fr);gap:18px;margin-top:18px}
.stage-wrap{border:1px solid var(--line);background:#050505;padding:14px}
.stage{position:relative;width:100%;overflow:hidden;background:#111}
.stage img.base{display:block;width:100%;height:auto}
.layer{position:absolute;transform:translate(-50%,-50%);z-index:3;transform-origin:center center;user-select:none;touch-action:none;pointer-events:auto}
.layer img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 2px 7px rgba(0,0,0,.18))}
.layer.selected{outline:1px dashed rgba(220,231,223,.9);outline-offset:5px}
.layer.complementary{z-index:2;opacity:.72}
.stage-tag{position:absolute;left:12px;top:12px;z-index:5;padding:7px 9px;background:rgba(0,0,0,.72);font-size:8px;letter-spacing:.12em}
.editor-panel{border:1px solid var(--line);padding:18px;background:var(--panel2)}
.range{width:100%}
.range-row{display:grid;grid-template-columns:1fr 80px;gap:10px;align-items:center;margin-bottom:13px}
.range-row input[type=number]{width:100%;padding:8px;border:1px solid var(--line);background:#090b0a;color:var(--text)}
.editor-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.helper{font-size:10px;color:var(--muted);line-height:1.5;margin-top:12px}
.data-table{width:100%;border-collapse:collapse;font-size:11px}
.data-table th,.data-table td{padding:10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.data-table th{font-size:8px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.badge{display:inline-block;padding:5px 7px;border:1px solid var(--line);border-radius:999px;font-size:8px;letter-spacing:.08em}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.info-card{border:1px solid var(--line);padding:15px;background:var(--panel2)}
.info-card b{display:block;margin-bottom:7px}
.muted{color:var(--muted)}
@media(max-width:1000px){.grid-metrics{grid-template-columns:repeat(4,1fr)}.placement-grid{grid-template-columns:1fr}.controls{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.wrap{padding:14px}.grid-metrics{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.top{padding:12px}.cards{grid-template-columns:1fr}.section-title{font-size:28px}}

/* ===== ADMIN / CUSTOMER PLACEMENT COORDINATE SYNC ===== */
.stage img.base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage img.layer{position:absolute;width:8%;height:auto;object-fit:contain;transform-origin:center;touch-action:none;cursor:grab;z-index:4}
.stage img.layer.dragging{cursor:grabbing}
.placement-banner{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);background:var(--bg);margin-bottom:12px}
@media(max-width:760px){.placement-banner{display:block}.placement-banner .muted{display:block;margin-top:6px}}

</style>
</head>
<body>
<header class="top"><div class="brand">TEMPORARY™ / CONTROL</div><div class="statusbar" id="topStatus">SECURE ADMIN ACCESS</div></header>

<section id="loginView" class="login">
  <div class="login-card">
    <div class="kicker">PRIVATE CONTROL / OWNER ACCESS</div>
    <h1 class="title">The archive<br>behind the archive.</h1>
    <div class="note">Sign in with the Google account listed as ACTIVE in ADMIN_USERS. Admin permissions are enforced by the Apps Script backend.</div>
    <div class="google-slot" id="googleSlot"></div>
    <div class="error" id="loginError"></div>
  </div>
</section>

<main id="app" class="app wrap">
  <nav class="nav" id="nav">
    <button class="active" data-section="dashboard">Dashboard</button>
    <button data-section="orders">Orders</button>
    <button data-section="carts">Carts</button>
    <button data-section="customers">Customers</button>
    <button data-section="catalog">Catalog</button>
    <button data-section="payments">Payments</button>
    <button data-section="audit">Audit</button>
    <button id="logout" style="margin-left:auto">Logout</button>
  </nav>

  <section id="content"></section>
</main>

<script>
const API='https://script.google.com/macros/s/AKfycbx5InYO32kfhcCo34Me8AfCK3mZhaSsJABXL0dElh_kZT-dZKICpMxhXSUmWL9jsAiK/exec';
const CLIENT_ID='32171492706-n6rli6equ2e0es8ac15npdcrhctlq2bn.apps.googleusercontent.com';
const SESSION_KEY='temporary_v1_admin_session';
const DEVICE_KEY='temporary_v1_admin_device';
const state={token:localStorage.getItem(SESSION_KEY)||'',admin:null,section:'dashboard',catalog:null,selected:null};

function $(s){return document.querySelector(s)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function deviceId(){let v=localStorage.getItem(DEVICE_KEY);if(!v){v='adm-'+crypto.randomUUID();localStorage.setItem(DEVICE_KEY,v)}return v}
async function api(action,payload={},timeout=18000){
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),timeout);
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},payload)),signal:c.signal,cache:'no-store'});
    const j=await r.json();
    if(j.ok===false)throw new Error(j.errorCode||j.error||'API_ERROR');
    return j;
  }finally{clearTimeout(tm)}
}
function money(v,c='EGP'){return new Intl.NumberFormat('en-EG',{maximumFractionDigits:2}).format(Number(v||0))+' '+c}
function assetFor(p,c){return (p?.assets||[]).find(a=>String(a.color).toLowerCase()===String(c||'').toLowerCase())||(p?.assets||[])[0]}
function designFor(id){return (state.catalog?.designs||[]).find(d=>String(d.designId)===String(id))}
function normalizePlacementSize(v){
  const s=String(v??'').trim().toLowerCase().replace(/\s+/g,'');
  if(['7','7x7','7×7','7cm','7x7cm'].includes(s))return 7;
  if(['20','20x20','20×20','20cm','20x20cm'].includes(s))return 20;
  if(['30','30x30','30×30','30cm','30x30cm'].includes(s))return 30;
  const n=parseFloat(s.replace(/[^0-9.]/g,''));
  return [7,20,30].includes(n)?n:0;
}
function placementFor(type,productId,designId,side,size){
  const wantedType=String(type||'DESIGN').trim().toUpperCase();
  const wantedSide=String(side||'FRONT').trim().toUpperCase();
  const wantedProduct=String(productId||'').trim();
  const wantedDesign=String(designId||'').trim();
  const wantedSize=wantedType==='LOGO'?7:normalizePlacementSize(size);
  if(!wantedProduct||!wantedSize)return null;
  const rows=(state.catalog?.placements||[]).filter(p=>
    String(p.productId||'').trim()===wantedProduct &&
    String(p.artworkType||'').trim().toUpperCase()===wantedType &&
    String(p.side||'').trim().toUpperCase()===wantedSide &&
    normalizePlacementSize(p.printSize)===wantedSize
  );
  if(wantedType==='DESIGN' && wantedDesign){
    return rows.find(p=>String(p.designId||'').trim()===wantedDesign)||null;
  }
  return rows.find(p=>String(p.designId||'').trim()==='')||rows[0]||null;
}
function designUrl(d){return d?.assets?.[0]?.assetUrl||''}
function selectedMockup(){
  const p=(state.catalog?.products||[]).find(p=>String(p.productId)===String($('#product')?.value||''));
  return assetFor(p,$('#color')?.value||p?.colors?.[0]);
}

async function loginCredential(credential){
  $('#loginError').textContent='VERIFYING GOOGLE ACCOUNT…';
  try{
    const r=await api('admingoogleauth',{credential,deviceId:deviceId()});
    state.token=r.sessionToken;state.admin=r.admin;
    localStorage.setItem(SESSION_KEY,state.token);
    google.accounts.id.disableAutoSelect?.();
    $('#loginView').style.display='none';$('#app').style.display='block';
    $('#topStatus').textContent=(state.admin.role||'ADMIN')+' / AUTHENTICATED';
    await showSection('dashboard');
  }catch(e){$('#loginError').textContent='ADMIN LOGIN FAILED · '+String(e.message||e)}
}

function initGoogle(){
  if(!window.google?.accounts?.id){setTimeout(initGoogle,80);return}
  google.accounts.id.initialize({client_id:CLIENT_ID,auto_select:true,use_fedcm_for_button:true,button_auto_select:true,cancel_on_tap_outside:false,callback:r=>loginCredential(r.credential)});
  google.accounts.id.renderButton($('#googleSlot'),{theme:'outline',size:'large',text:'continue_with',shape:'pill',width:320});
  try{google.accounts.id.prompt()}catch(_){}
}

async function bootstrap(){
  if(!state.token)return false;
  try{const r=await api('admingoogleauth',{credential:'',deviceId:deviceId()});return !!r}catch(_){return false}
}
function metric(label,value){return `<div class="metric"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`}

async function showSection(section){
  state.section=section;
  document.querySelectorAll('#nav button[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===section));
  const c=$('#content');c.innerHTML='<section class="section"><div class="note">Loading '+esc(section)+'…</div></section>';
  try{
    const r=await api('adminget',{sessionToken:state.token,section,query:{}});
    if(section==='dashboard')renderDashboard(r);
    else if(section==='catalog'){state.catalog=r;renderCatalog(r)}
    else renderGeneric(section,r);
  }catch(e){
    c.innerHTML=`<section class="section"><div class="error">REQUEST FAILED · ${esc(e.message||e)}</div></section>`;
  }
}

function renderDashboard(r){
  const m=r.metrics||{},s=r.system||{},v=r.viewer||{};
  $('#content').innerHTML=`
  <section class="section"><div class="section-head"><div><div class="kicker">SYSTEM</div><h2 class="section-title">Dashboard</h2></div><div class="badge">${esc(v.role||'')}</div></div>
  <div class="grid-metrics">
    ${metric('Orders',m.orders)}${metric('Customers',m.customers)}${metric('Active carts',m.activeCarts)}${metric('Pending orders',m.pendingOrders)}
    ${metric('Processing',m.processing)}${metric('Shipped',m.shipped)}${metric('Delivered',m.delivered)}${metric('Pending payments',m.pendingPayments)}
  </div>
  <div class="cards">
    <div class="info-card"><b>Store</b><div class="muted">${esc(s.brandName||'TEMPORARY™')}</div><div class="muted">${esc(s.storeMode||'')}</div></div>
    <div class="info-card"><b>Currency</b><div class="muted">${esc(s.currency||'EGP')}</div><div class="muted">COD: ${s.codEnabled?'ON':'OFF'}</div></div>
    <div class="info-card"><b>Operator</b><div class="muted">${esc(v.displayName||'')}</div><div class="muted">${esc(v.role||'')}</div></div>
  </div></section>`;
}

function renderCatalog(r){
  const products=r.products||[],designs=r.designs||[],placements=r.placements||[];
  $('#content').innerHTML=`
  <section class="section">
    <div class="section-head"><div><div class="kicker">CATALOG / LIVE CONTROL</div><h2 class="section-title">Placement studio</h2></div><div class="badge">CUSTOMER SITE SYNC · LOGO 7 × 7 CM</div></div>
    <div class="controls">
      <div class="field"><label>Product</label><select id="product">${products.map(p=>`<option value="${esc(p.productId)}">${esc(p.productName)}</option>`).join('')}</select></div>
      <div class="field"><label>Artwork</label><select id="artwork"><option value="DESIGN">DESIGN</option><option value="LOGO">LOGO</option></select></div>
      <div class="field" id="designField"><label>Design</label><select id="design">${designs.map(d=>`<option value="${esc(d.designId)}">${esc(d.designName)}</option>`).join('')}</select></div>
      <div class="field"><label>Side</label><select id="side"><option>FRONT</option><option>BACK</option></select></div>
      <div class="field"><label>Print size</label><select id="printSize"><option value="20">20</option><option value="30">30</option><option value="7">7</option></select></div>
      <div class="field"><label>Mockup color</label><select id="color"></select></div>
    </div>
    <div class="placement-banner"><div><strong>LIVE DATABASE PLACEMENT</strong><div class="muted" style="margin-top:4px">The highlighted layer is the exact canonical row you are editing.</div></div><span class="muted">SAVE → PLACEMENTS → CUSTOMER MOCKUP</span></div><div class="placement-grid">
      <div class="stage-wrap"><div class="stage" id="stage"><div class="stage-tag" id="stageTag">LIVE MOCKUP</div><img class="base" id="base"><div class="layer complementary" id="compLayer"><img></div><div class="layer selected" id="selectedLayer"><img></div></div></div>
      <div class="editor-panel">
        <div class="kicker">VISUAL CONTROLS</div>
        <div class="note" style="margin:8px 0 18px">Drag the selected artwork directly on the mockup. The saved values become the real PLACEMENTS record used by customer checkout.</div>
        <div class="range-row"><div class="field"><label>WIDTH %</label><input id="widthR" class="range" type="range" min="1" max="80" step=".1"></div><input id="widthN" type="number" min="1" max="80" step=".1"></div>
        <div class="range-row"><div class="field"><label>TOP %</label><input id="topR" class="range" type="range" min="0" max="100" step=".1"></div><input id="topN" type="number" min="0" max="100" step=".1"></div>
        <div class="range-row"><div class="field"><label>LEFT %</label><input id="leftR" class="range" type="range" min="0" max="100" step=".1"></div><input id="leftN" type="number" min="0" max="100" step=".1"></div>
        <div class="range-row"><div class="field"><label>ROTATION °</label><input id="rotR" class="range" type="range" min="-180" max="180" step=".5"></div><input id="rotN" type="number" min="-360" max="360" step=".5"></div>
        <div class="range-row"><div class="field"><label>OPACITY</label><input id="opacityR" class="range" type="range" min="0" max="1" step=".01"></div><input id="opacityN" type="number" min="0" max="1" step=".01"></div>
        <div class="editor-actions"><button class="btn primary" id="savePlacement">Save placement</button><button class="btn" id="reloadPlacement">Reload</button></div>
        <div class="helper" id="placementInfo"></div>
      </div>
    </div>
  </section>
  <section class="section">
    <div class="section-head"><div><div class="kicker">PRODUCTS</div><h2 class="section-title">Live catalog details</h2></div></div>
    <div style="overflow:auto"><table class="data-table"><thead><tr><th>Product</th><th>Material</th><th>Fit</th><th>Sizes</th><th>Colors</th><th>Price</th></tr></thead><tbody>
      ${products.map(p=>`<tr><td><strong>${esc(p.productName)}</strong><div class="muted">${esc(p.productCode)}</div></td><td>${esc(p.material)}</td><td>${esc(p.fit)}</td><td>${esc((p.sizes||[]).join(' · '))}</td><td>${esc((p.colors||[]).join(' · '))}</td><td>${money(p.price,p.currency)}</td></tr>`).join('')}
    </tbody></table></div>
  </section>`;

  const syncColor=()=>{
    const p=products.find(x=>String(x.productId)===$('#product').value)||products[0];
    $('#color').innerHTML=(p?.colors||[]).map(c=>`<option>${esc(c)}</option>`).join('');
  };
  const syncType=()=>{const isLogo=$('#artwork').value==='LOGO';$('#designField').style.display=isLogo?'none':'';const ps=$('#printSize');ps.innerHTML=isLogo?'<option value="7">7</option>':'<option value="20">20</option><option value="30">30</option>';};
  function currentKey(){
    return {
      productId:$('#product').value,artworkType:$('#artwork').value,designId:$('#artwork').value==='LOGO'?'':$('#design').value,
      side:$('#side').value,printSize:Number($('#printSize').value)
    };
  }
  function loadPlacement(){
    syncColor();syncType();
    const k=currentKey();
    const p=placements.find(x=>String(x.productId)===String(k.productId)&&String(x.artworkType).toUpperCase()===k.artworkType&&String(x.designId||'')===k.designId&&String(x.side).toUpperCase()===k.side&&Number(x.printSize)===k.printSize);
    state.selected=p||null;
    const product=products.find(x=>String(x.productId)===String(k.productId));
    const a=assetFor(product,$('#color').value);
    $('#base').src=a?.assetUrl||'';
    const selectedEl=$('#selectedLayer'),compEl=$('#compLayer');selectedEl.dataset.editable='0';compEl.dataset.editable='0';
    const design=designFor($('#design').value);
    const designPlacement=placementFor('DESIGN',k.productId,$('#design').value,k.side,k.printSize);
    const compSide=k.side==='FRONT'?'BACK':'FRONT';
    const logoPlacement=placementFor('LOGO',k.productId,'',compSide,7);
    const selectedPlace=k.artworkType==='LOGO'?p:designPlacement;
    const selectedUrl=k.artworkType==='LOGO'?(r.logo?.assetUrl||''):designUrl(design);
    const compUrl=k.artworkType==='LOGO'?designUrl(design):(r.logo?.assetUrl||'');
    const compPlace=k.artworkType==='LOGO'?designPlacement:logoPlacement;
    setLayer(selectedEl,selectedUrl,selectedPlace,true);
    setLayer(compEl,compUrl,compPlace,false);
    if(p){
      setControls(p);
      $('#placementInfo').textContent=`${p.artworkType} · ${p.designId||'LOGO'} · ${p.side} · ${p.printSize} CM · ${p.placementId}`;
    }else{
      $('#placementInfo').textContent='No canonical placement found for this combination.';
      setControls({width:8,top:50,left:50,rotation:0,opacity:1});
    }
  }
  function setLayer(el,url,p,selected){
    el.style.display=url&&p?'block':'none';if(!url||!p)return;
    el.style.width=Math.max(1,Number(p.width||8))+'%';el.style.height='auto';
    el.style.left=Number(p.left||50)+'%';el.style.top=Number(p.top||50)+'%';el.style.transform=`translate(-50%,-50%) rotate(${Number(p.rotation||0)}deg)`;el.style.opacity=Number(p.opacity??1);
    el.classList.toggle('selected',!!selected);el.dataset.editable=selected?'1':'0';el.querySelector('img').src=url;
  }
  function setControls(p){
    [['width',p.width],['top',p.top],['left',p.left],['rotation',p.rotation],['opacity',p.opacity]].forEach(([k,v])=>{$('#'+k+'R').value=v;$('#'+k+'N').value=v});
  }
  function controls(){
    return {width:Number($('#widthN').value),top:Number($('#topN').value),left:Number($('#leftN').value),rotation:Number($('#rotN').value),opacity:Number($('#opacityN').value)};
  }
  function applyControls(){
    const v=controls();const el=$('#selectedLayer');if(!el)return;
    el.style.width=v.width+'%';el.style.height='auto';el.style.left=v.left+'%';el.style.top=v.top+'%';el.style.transform=`translate(-50%,-50%) rotate(${v.rotation}deg)`;el.style.opacity=v.opacity;
  }
  ['width','top','left','rotation','opacity'].forEach(k=>{
    $('#'+k+'R').addEventListener('input',e=>{$('#'+k+'N').value=e.target.value;applyControls()});
    $('#'+k+'N').addEventListener('input',e=>{$('#'+k+'R').value=e.target.value;applyControls()});
  });
  const drag={on:false,x:0,y:0,left:0,top:0};
  $('#selectedLayer')?.addEventListener('pointerdown',e=>{if(!state.selected)return;const rect=$('#stage').getBoundingClientRect();drag.on=true;drag.x=e.clientX;drag.y=e.clientY;drag.left=Number($('#leftN').value);drag.top=Number($('#topN').value);$('#selectedLayer').setPointerCapture?.(e.pointerId);e.preventDefault()});
  $('#selectedLayer')?.addEventListener('pointermove',e=>{if(!drag.on)return;const rect=$('#stage').getBoundingClientRect();const dx=(e.clientX-drag.x)/rect.width*100,dy=(e.clientY-drag.y)/rect.height*100;const l=Math.max(0,Math.min(100,drag.left+dx)),t=Math.max(0,Math.min(100,drag.top+dy));$('#leftN').value=l.toFixed(2);$('#leftR').value=l;$('#topN').value=t.toFixed(2);$('#topR').value=t;applyControls()});
  $('#selectedLayer')?.addEventListener('pointerup',()=>drag.on=false);
  $('#savePlacement').onclick=async()=>{
    if(!state.selected){alert('No existing canonical placement selected.');return}
    const v=controls(),k=currentKey();
    const payload={placementId:state.selected.placementId,productId:k.productId,artworkType:k.artworkType,designId:k.designId,side:k.side,printSize:k.printSize,width:v.width,top:v.top,left:v.left,rotation:v.rotation,opacity:v.opacity,active:true,notes:state.selected.notes||''};
    const b=$('#savePlacement');b.disabled=true;b.textContent='SAVING…';
    try{const res=await api('adminsaveplacement',{sessionToken:state.token,placement:payload});state.catalog.placements=state.catalog.placements.map(x=>x.placementId===res.placement.placementId?res.placement:x);await showSection('catalog')}catch(e){alert('SAVE FAILED · '+(e.message||e))}finally{b.disabled=false;b.textContent='Save placement'}
  };
  ['product','artwork','design','side','printSize','color'].forEach(id=>$('#'+id)?.addEventListener('change',loadPlacement));
  $('#reloadPlacement').onclick=loadPlacement;
  loadPlacement();
}
function renderGeneric(section,r){
  const items=r.items||[];
  $('#content').innerHTML=`<section class="section"><div class="section-head"><div><div class="kicker">${esc(section)}</div><h2 class="section-title">${esc(section)}</h2></div><div class="badge">${items.length} rows</div></div><div style="overflow:auto"><table class="data-table"><thead><tr><th>Data</th></tr></thead><tbody>${items.length?items.map(x=>`<tr><td><pre style="margin:0;white-space:pre-wrap;color:var(--text)">${esc(JSON.stringify(x,null,2))}</pre></td></tr>`).join(''):'<tr><td class="muted">No records yet.</td></tr>'}</tbody></table></div></section>`;
}
document.querySelectorAll('#nav button[data-section]').forEach(b=>b.onclick=()=>showSection(b.dataset.section));
$('#logout').onclick=async()=>{try{if(state.token)await api('adminlogout',{sessionToken:state.token})}catch(_){}localStorage.removeItem(SESSION_KEY);state.token='';state.admin=null;try{google.accounts.id.disableAutoSelect()}catch(_){}location.reload()};

(async function boot(){
  initGoogle();
  if(state.token){
    // Session bootstrap is intentionally a separate API route in the backend.
    try{
      const r=await api('adminget',{sessionToken:state.token,section:'dashboard',query:{}});
      state.admin=r.viewer||null;
      $('#loginView').style.display='none';$('#app').style.display='block';
      $('#topStatus').textContent=(state.admin.role||'ADMIN')+' / RESTORED';
      renderDashboard(r);
    }catch(_){localStorage.removeItem(SESSION_KEY);state.token='';}
  }
})();
</script>
</body>
</html>
