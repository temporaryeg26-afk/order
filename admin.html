<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.app{display:none;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:246px;padding:22px 14px;background:rgba(7,9,7,.98);border-right:1px solid var(--line);z-index:40}.brand{padding:7px 10px 25px;border-bottom:1px solid var(--line);font-size:13px;font-weight:900;letter-spacing:.26em}.brand small{display:block;color:var(--muted);font:8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;margin-top:9px}.nav-title{margin:21px 10px 8px;color:#566158;font:800 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em}.nav{width:100%;border:1px solid transparent;background:transparent;color:var(--muted);padding:12px 11px;text-align:left;display:flex;justify-content:space-between;font-size:9px;letter-spacing:.14em;text-transform:uppercase}.nav:hover,.nav.active{background:var(--panel2);border-color:var(--line);color:var(--text)}
.main{width:calc(100% - 246px);margin-left:246px;min-height:100vh}.top{position:sticky;top:0;z-index:30;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(6,7,6,.9);backdrop-filter:blur(20px)}.page-title{font:500 30px/1 var(--serif);letter-spacing:-.04em}.top-meta{font:8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:var(--muted)}
.content{padding:28px;max-width:1600px}.eyebrow,.kicker{font:800 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}h2{font:500 clamp(38px,5vw,66px)/.87 var(--serif);letter-spacing:-.06em;margin:9px 0 23px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{padding:18px;border:1px solid var(--line);background:linear-gradient(145deg,var(--panel),var(--panel2));min-height:112px}.stat span{display:block;color:var(--muted);font:8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em}.stat strong{display:block;margin-top:12px;font-size:30px}.panel{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel),var(--panel2));padding:20px}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}.search{min-width:280px;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:11px 12px}.btn{border:1px solid var(--line);background:transparent;color:var(--text);padding:10px 13px;font:800 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;text-transform:uppercase}.btn:hover{border-color:var(--accent);transform:translateY(-1px)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.table-wrap{overflow:auto;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;min-width:900px;font-size:10px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font:800 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;text-transform:uppercase}tbody tr:hover{background:rgba(255,255,255,.02)}.status{display:inline-block;padding:5px 7px;border:1px solid var(--line);font:800 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.status.pending{border-color:#846b45;color:#d4b57f}.status.confirmed,.status.processing{border-color:#5b7087;color:#9bbbd8}.status.shipped{border-color:#657d62;color:#a5c99f}.status.delivered{border-color:#6d8d79;color:#a8d4ba}.status.canceled{color:#777}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.catalog-workspace{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px}.controls{display:grid;gap:12px}.control label{display:block;color:var(--muted);font:800 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;margin-bottom:6px}.control select,.control input[type=number]{width:100%;padding:11px;background:var(--bg);color:var(--text);border:1px solid var(--line)}.notice{padding:11px;border:1px solid #5e4934;background:#17110c;color:#c5a77f;font-size:10px;line-height:1.6}.stage-shell{border:1px solid var(--line);background:#050505;padding:14px}.stage{position:relative;width:min(100%,760px);aspect-ratio:1;margin:auto;background:#080808;overflow:hidden}.stage img.base,.stage img.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.stage img.layer{inset:auto;transform-origin:center;touch-action:none;cursor:grab;z-index:4}.stage img.layer.dragging{cursor:grabbing}
.range-row{display:grid;grid-template-columns:1fr 78px;gap:7px;align-items:center}.range-row input[type=number]{width:100%;padding:8px;background:var(--bg);color:var(--text);border:1px solid var(--line)}.readouts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.readout{border:1px solid var(--line);background:var(--bg);padding:9px}.readout span{display:block;color:var(--muted);font:8px ui-monospace,SFMono-Regular,Menlo,monospace}.readout strong{display:block;margin-top:4px}.detail-drawer{display:none}.detail-drawer.open{display:block}.mini-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini{border:1px solid var(--line);padding:12px;background:var(--bg)}.mini b{display:block;margin-bottom:6px}.muted{color:var(--muted)}
.login{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 30%,rgba(110,150,120,.14),transparent 35%),#060706;display:grid;place-items:center;padding:16px}.login-card{width:min(620px,100%);padding:36px;border:1px solid var(--line);background:var(--panel);box-shadow:0 35px 110px rgba(0,0,0,.5)}.login-title{font:500 clamp(54px,12vw,106px)/.77 var(--serif);letter-spacing:-.08em;margin:15px 0}.google-slot{margin-top:24px;min-height:50px}.login-status{margin-top:12px;color:var(--muted);font:8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em}

</style>

<script>
const API="https://script.google.com/macros/s/AKfycbx5InYO32kfhcCo34Me8AfCK3mZhaSsJABXL0dElh_kZT-dZKICpMxhXSUmWL9jsAiK/exec",CLIENT_ID="32171492706-n6rli6equ2e0es8ac15npdcrhctlq2bn.apps.googleusercontent.com",SESSION_KEY='temporary_admin_session_v4',DEVICE_KEY='temporary_admin_device_v4';
const A={token:localStorage.getItem(SESSION_KEY)||'',admin:null,view:'dashboard',catalog:null,placements:[]};
const $=s=>document.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v,c='EGP'){return new Intl.NumberFormat('en-EG',{maximumFractionDigits:2}).format(Number(v||0))+' '+c}
function deviceId(){let v=localStorage.getItem(DEVICE_KEY);if(!v){v='ADM-'+crypto.randomUUID().replaceAll('-','');localStorage.setItem(DEVICE_KEY,v)}return v}
async function api(action,payload={},timeout=20000){const c=new AbortController(),tm=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload}),signal:c.signal,cache:'no-store'});const j=await r.json();if(j.ok===false)throw new Error(j.errorCode||j.error||'API_ERROR');return j}finally{clearTimeout(tm)}}
function initGoogle(force){if(!window.google?.accounts?.id){setTimeout(()=>initGoogle(force),90);return}if(window._googleInit&&!force)return;window._googleInit=true;$('#googleSlot').innerHTML='';google.accounts.id.initialize({client_id:CLIENT_ID,auto_select:true,use_fedcm_for_button:true,button_auto_select:true,cancel_on_tap_outside:false,callback:r=>adminLogin(r.credential)});google.accounts.id.renderButton($('#googleSlot'),{theme:'outline',size:'large',shape:'pill',text:'continue_with',width:320});try{google.accounts.id.prompt()}catch(_){}}
async function adminLogin(credential){$('#loginStatus').textContent='SECURE ADMIN ACCESS · VERIFYING';try{const r=await api('admingoogleauth',{credential,deviceId:deviceId()});A.token=r.sessionToken;A.admin=r.admin;localStorage.setItem(SESSION_KEY,A.token);$('#login').style.display='none';$('#app').style.display='flex';$('#topMeta').textContent=(A.admin?.role||'ADMIN')+' / AUTHENTICATED';await show('dashboard')}catch(e){$('#loginStatus').textContent='ADMIN AUTH ERROR · '+(e.message||e);window._googleInit=false;initGoogle(true)}}
async function restore(){if(!A.token)return false;try{const r=await api('adminget',{sessionToken:A.token,section:'dashboard',query:{}});A.admin=r.viewer||null;$('#login').style.display='none';$('#app').style.display='flex';$('#topMeta').textContent=(A.admin?.role||'ADMIN')+' / RESTORED';renderDashboard(r);return true}catch(e){if(/SESSION_|ADMIN_AUTH|ADMIN_ACCOUNT/.test(String(e.message||''))){localStorage.removeItem(SESSION_KEY);A.token='';}return false}}
function metric(label,value){return `<div class="stat"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`}
function renderDashboard(r){const m=r.metrics||{},s=r.system||{},v=r.viewer||{};$('#content').innerHTML=`<section class="section"><div class="eyebrow">SYSTEM OVERVIEW</div><h2>Dashboard</h2><div class="stats">${metric('Orders',m.orders)}${metric('Customers',m.customers)}${metric('Active carts',m.activeCarts)}${metric('Pending orders',m.pendingOrders)}${metric('Processing',m.processing)}${metric('Shipped',m.shipped)}${metric('Delivered',m.delivered)}${metric('Pending payments',m.pendingPayments)}</div></section><section class="panel"><div class="eyebrow">SYSTEM</div><div class="mini-cards" style="margin-top:12px"><div class="mini"><b>Store mode</b><span class="muted">${esc(s.storeMode||'')}</span></div><div class="mini"><b>Currency</b><span class="muted">${esc(s.currency||'EGP')}</span></div><div class="mini"><b>COD</b><span class="muted">${s.codEnabled?'ENABLED':'DISABLED'} · API ${esc(s.apiVersion||'')}</span></div></div><div style="margin-top:13px;color:var(--muted);font-size:10px">${esc(v.displayName||'')} · ${esc(v.role||'')}</div></section>`}
function statusBadge(v){const s=String(v||'').toUpperCase();return `<span class="status ${esc(s.toLowerCase())}">${esc(s||'—')}</span>`}
function generic(section,r){const items=r.items||[];let filtered=items;$('#content').innerHTML=`<section class="section"><div class="eyebrow">${esc(section.toUpperCase())}</div><h2>${esc(section[0].toUpperCase()+section.slice(1))}</h2><div class="panel"><div class="toolbar"><input class="search" id="search" placeholder="Search…"><button class="btn" id="refresh">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Record</th><th>Primary</th><th>Status</th><th>Details</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div></div></section>`;function draw(q=''){const a=items.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));$('#rows').innerHTML=a.length?a.map(x=>`<tr><td><strong>${esc(x.orderNumber||x.orderId||x.customerId||x.paymentId||x.cartId||x.auditId||'—')}</strong></td><td>${esc(x.customerName||x.fullName||x.email||x.paymentMethod||x.action||'—')}</td><td>${statusBadge(x.orderStatus||x.paymentStatus||x.status)}</td><td><pre style="margin:0;white-space:pre-wrap;color:var(--muted);font:10px ui-monospace,SFMono-Regular,Menlo,monospace">${esc(JSON.stringify(x,null,2))}</pre></td><td>${esc(x.createdAt||x.updatedAt||x.lastActiveAt||'')}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">No records yet.</td></tr>'}draw();$('#search').oninput=e=>draw(e.target.value.toLowerCase());$('#refresh').onclick=()=>show(section)}
function renderOrders(r){const items=r.items||[];$('#content').innerHTML=`<section class="section"><div class="eyebrow">ORDER OPERATIONS</div><h2>Orders.</h2><div class="panel"><div class="toolbar"><input class="search" id="orderSearch" placeholder="Search order / customer / phone / email"><button class="btn" id="orderRefresh">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Status</th><th>Payment</th><th>Total</th><th>Action</th></tr></thead><tbody id="orderRows">${items.map(x=>`<tr><td><strong>${esc(x.orderNumber)}</strong><br><span class="muted">${esc(x.orderId)}</span></td><td>${esc(x.customerName)}<br><span class="muted">${esc(x.email)}</span></td><td>${esc(x.phone)}</td><td>${statusBadge(x.orderStatus)}</td><td>${statusBadge(x.paymentStatus)}</td><td>${money(x.total,x.currency)}</td><td><select data-status="${esc(x.orderId)}"><option value="">Change…</option><option>PENDING</option><option>CONFIRMED</option><option>PROCESSING</option><option>SHIPPED</option><option>DELIVERED</option><option>CANCELED</option></select></td></tr>`).join('')||'<tr><td colspan="7" class="muted">No orders yet.</td></tr>'}</tbody></table></div></div></section>`;$('#orderSearch').oninput=e=>{const q=e.target.value.toLowerCase();$$('#orderRows tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')};$$('[data-status]').forEach(s=>s.onchange=async()=>{if(!s.value)return;const orderId=s.dataset.status;try{await api('admintransitionorderstatus',{sessionToken:A.token,orderId,nextStatus:s.value});toast('ORDER STATUS UPDATED');await show('orders')}catch(e){toast('STATUS UPDATE FAILED · '+(e.message||e));s.value=''}});$('#orderRefresh').onclick=()=>show('orders')}
function renderCatalog(r){A.catalog=r;A.placements=r.placements||[];const products=r.products||[],designs=r.designs||[];$('#content').innerHTML=`<section class="section"><div class="eyebrow">CATALOG / VISUAL PLACEMENT CONTROL</div><h2>Place every mark.</h2><div class="catalog-workspace"><div class="panel"><div class="controls">
<div class="control"><label>PRODUCT</label><select id="pSel">${products.map(p=>`<option value="${esc(p.productId)}">${esc(p.productName)}</option>`).join('')}</select></div>
<div class="control"><label>COLOR</label><select id="cSel"></select></div>
<div class="control"><label>ARTWORK TYPE</label><select id="aSel"><option value="DESIGN">DESIGN</option><option value="LOGO">LOGO</option></select></div>
<div class="control"><label>DESIGN</label><select id="dSel">${designs.map(d=>`<option value="${esc(d.designId)}">${esc(d.designName)}</option>`).join('')}</select></div>
<div class="control"><label>SIDE</label><select id="sSel"><option>FRONT</option><option>BACK</option></select></div>
<div class="control"><label>PRINT SIZE</label><select id="psSel"><option value="20">20 × 20 CM</option><option value="30">30 × 30 CM</option><option value="7">7 × 7 CM</option></select></div>
<div class="notice">The selected layer is the editable database placement. Drag it on the mockup or use the numeric controls. Save writes the real PLACEMENTS record.</div>
${[['width','WIDTH','1','80','0.1'],['top','TOP','0','100','0.1'],['left','LEFT','0','100','0.1'],['rot','ROTATION','-180','180','0.5'],['opacity','OPACITY','0','1','0.01']].map(a=>`<div><div class="kicker">${a[1]}</div><div class="range-row"><input id="${a[0]}R" type="range" min="${a[2]}" max="${a[3]}" step="${a[4]}"><input id="${a[0]}N" type="number" step="${a[4]}"></div></div>`).join('')}
<div class="readouts"><div class="readout"><span>WIDTH</span><strong id="rw">—</strong></div><div class="readout"><span>TOP</span><strong id="rt">—</strong></div><div class="readout"><span>LEFT</span><strong id="rl">—</strong></div><div class="readout"><span>ROTATION</span><strong id="rr">—</strong></div></div>
<div style="display:flex;gap:7px;margin-top:10px"><button class="btn primary" id="save" style="flex:1">SAVE PLACEMENT</button><button class="btn" id="reset">RESET / RELOAD</button></div>
<div class="small-note" id="placementNote" style="margin-top:9px">—</div></div></div>
<div class="stage-shell"><div class="eyebrow" style="margin-bottom:10px">LIVE CUSTOMER COORDINATE CANVAS</div><div class="stage" id="stage"><img class="base" id="base"><img class="layer" id="layer"></div></div></div></section>
<section class="panel"><div class="eyebrow">CATALOG INVENTORY OF PRESENTATION</div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Product</th><th>Material</th><th>Fit</th><th>Sizes</th><th>Colors</th><th>Price</th></tr></thead><tbody>${products.map(p=>`<tr><td><strong>${esc(p.productName)}</strong><br><span class="muted">${esc(p.productCode)}</span></td><td>${esc(p.material)}</td><td>${esc(p.fit)}</td><td>${esc((p.sizes||[]).join(' · '))}</td><td>${esc((p.colors||[]).join(' · '))}</td><td>${money(p.price,p.currency)}</td></tr>`).join('')}</tbody></table></div></section>`;
initEditor(products,designs)}
function initEditor(products,designs){const q={p:$('#pSel'),c:$('#cSel'),a:$('#aSel'),d:$('#dSel'),s:$('#sSel'),ps:$('#psSel')};function sync(){const p=products.find(x=>x.productId===q.p.value)||products[0];q.c.innerHTML=(p?.colors||[]).map(c=>`<option>${esc(c)}</option>`).join('');const logo=q.a.value==='LOGO';q.d.disabled=logo;q.ps.innerHTML=logo?'<option value="7">7 × 7 CM</option>':'<option value="20">20 × 20 CM</option><option value="30">30 × 30 CM</option>'}
function currentKey(){return{productId:q.p.value,designId:q.a.value==='LOGO'?'':q.d.value,artworkType:q.a.value,side:q.s.value,printSize:Number(q.ps.value)}}function current(){const k=currentKey();return A.placements.find(x=>String(x.productId)===String(k.productId)&&String(x.designId||'')===String(k.designId||'')&&String(x.artworkType).toUpperCase()===k.artworkType&&String(x.side).toUpperCase()===k.side&&Number(x.printSize)===k.printSize)||null}
function vals(){return{width:Number($('#widthN').value),top:Number($('#topN').value),left:Number($('#leftN').value),rotation:Number($('#rotN').value),opacity:Number($('#opacityN').value)}}function set(n,v){$('#'+n+'R').value=v;$('#'+n+'N').value=v}
function apply(){const v=vals(),el=$('#layer');el.style.width=v.width+'%';el.style.height=v.width+'%';el.style.left=v.left+'%';el.style.top=v.top+'%';el.style.transform=`translate(-50%,-50%) rotate(${v.rotation}deg)`;el.style.opacity=v.opacity;$('#rw').textContent=v.width.toFixed(2)+'%';$('#rt').textContent=v.top.toFixed(2)+'%';$('#rl').textContent=v.left.toFixed(2)+'%';$('#rr').textContent=v.rotation.toFixed(1)+'°'}
function load(){sync();const k=currentKey(),p=products.find(x=>x.productId===k.productId)||products[0],d=designs.find(x=>x.designId===k.designId),row=current();$('#base').src=assetFor(p,q.c.value)?.assetUrl||'';const logo=q.a.value==='LOGO',sideAsset=(d?.assets||[]).find(x=>String(x.side).toUpperCase()===k.s);const url=logo?(A.catalog.logo?.assetUrl||''):(sideAsset?.assetUrl||'');const layer=$('#layer');layer.style.display=url&&row?'block':'none';layer.src=url;layer.dataset.active=row?'1':'0';if(row){set('width',row.width||8);set('top',row.top??50);set('left',row.left??50);set('rot',row.rotation||0);set('opacity',row.opacity??1);$('#placementNote').textContent=`${row.artworkType} · ${row.side} · ${row.printSize} · ${row.placementId}`;A.selected=row}else{set('width',8);set('top',50);set('left',50);set('rot',0);set('opacity',1);$('#placementNote').textContent='No exact canonical placement found for this selection.';A.selected=null}apply()}
['p','c','a','d','s','ps'].forEach(k=>q[k].addEventListener('change',load));[['width','width'],['top','top'],['left','left'],['rot','rotation'],['opacity','opacity']].forEach(([id,n])=>{const r=$('#'+id+'R'),x=$('#'+id+'N');r.addEventListener('input',e=>{x.value=e.target.value;apply()});x.addEventListener('input',e=>{r.value=e.target.value;apply()})});
let drag=null;function down(e){const el=e.currentTarget;if(el.dataset.active!=='1')return;const st=$('#stage').getBoundingClientRect();drag={x:e.clientX,y:e.clientY,left:Number($('#leftN').value),top:Number($('#topN').value),w:st.width,h:st.height,el};el.classList.add('dragging');el.setPointerCapture?.(e.pointerId);e.preventDefault()}function move(e){if(!drag)return;const l=Math.max(0,Math.min(100,drag.left+(e.clientX-drag.x)/drag.w*100)),t=Math.max(0,Math.min(100,drag.top+(e.clientY-drag.y)/drag.h*100));$('#leftN').value=l.toFixed(2);$('#leftR').value=l;$('#topN').value=t.toFixed(2);$('#topR').value=t;apply()}function up(){if(drag?.el)drag.el.classList.remove('dragging');drag=null}$('#layer').onpointerdown=down;$('#layer').onpointermove=move;$('#layer').onpointerup=up;$('#layer').onpointercancel=up;
$('#save').onclick=async()=>{const k=currentKey(),v=vals(),b=$('#save');if(!A.selected){toast('NO CANONICAL PLACEMENT SELECTED');return}b.disabled=true;b.textContent='SAVING…';try{const r=await api('adminsaveplacement',{sessionToken:A.token,placement:{placementId:A.selected.placementId,productId:k.productId,artworkType:k.artworkType,designId:k.designId,side:k.side,printSize:k.printSize,width:v.width,top:v.top,left:v.left,rotation:v.rotation,opacity:v.opacity,active:true,notes:A.selected.notes||''}});A.selected=r.placement;const i=A.placements.findIndex(x=>x.placementId===r.placement.placementId);if(i>=0)A.placements[i]=r.placement;else A.placements.push(r.placement);toast('PLACEMENT SAVED TO DATABASE');load()}catch(e){toast('SAVE FAILED · '+(e.message||e))}finally{b.disabled=false;b.textContent='SAVE PLACEMENT'}};$('#reset').onclick=load;load()}
async function show(view){A.view=view;$$('.nav[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#pageTitle').textContent=view[0].toUpperCase()+view.slice(1);$('#content').innerHTML='<section class="panel">LOADING…</section>';try{const r=await api('adminget',{sessionToken:A.token,section:view,query:{}});if(view==='dashboard')renderDashboard(r);else if(view==='orders')renderOrders(r);else if(view==='catalog')renderCatalog(r);else generic(view,r)}catch(e){$('#content').innerHTML=`<section class="panel"><div style="color:#ff8b79;font-size:12px">REQUEST FAILED · ${esc(e.message||e)}</div></section>`}}
$$('.nav[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));$('#logout').onclick=async()=>{try{await api('adminlogout',{sessionToken:A.token})}catch(_){}try{google.accounts.id.disableAutoSelect()}catch(_){}localStorage.removeItem(SESSION_KEY);A.token='';location.reload()};
