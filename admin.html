<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>TEMPORARY™ — Control</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#070908;--panel:#0d110f;--panel2:#111713;--panel3:#151b17;
  --line:rgba(230,239,233,.10);--line2:rgba(230,239,233,.18);
  --text:#f3f6f2;--muted:#8f9b93;--soft:#c3cbc5;
  --accent:#e5eee8;--accentText:#0a0d0b;
  --ok:#97d1ad;--warn:#d9bd7e;--danger:#df8585;
  --shadow:0 24px 80px rgba(0,0,0,.42)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{background:radial-gradient(circle at 18% 0%,rgba(160,192,174,.07),transparent 28%),var(--bg)}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 16px;background:rgba(8,11,9,.92);backdrop-filter:blur(18px);display:flex;flex-direction:column}
.brand{font-weight:900;letter-spacing:.18em;font-size:13px;margin:3px 6px 28px}.brand small{display:block;font-weight:500;letter-spacing:.12em;color:var(--muted);margin-top:7px;font-size:9px}
.nav{display:grid;gap:4px}.nav button{border:1px solid transparent;background:transparent;color:#aab4ad;text-align:left;padding:11px 12px;border-radius:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.nav button:hover{background:rgba(255,255,255,.03);color:var(--text)}.nav button.active{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.sidebar-foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--line)}.admin-mini{font-size:11px;color:var(--soft);line-height:1.5;margin:0 4px 11px;word-break:break-word}.admin-mini strong{color:var(--text);font-weight:700}.btn{border:1px solid var(--line2);background:var(--panel);color:var(--text);padding:10px 13px;border-radius:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.btn:hover{border-color:var(--line2);background:var(--panel3)}.btn.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:800}.btn.danger{border-color:rgba(223,133,133,.25);color:var(--danger)}.btn.small{padding:8px 10px;font-size:9px}.btn.full{width:100%}
.main{min-width:0;padding:28px 34px 50px}.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.eyebrow{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}.page-title{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:44px;line-height:.95;margin:8px 0 6px}.page-sub{font-size:12px;color:var(--muted)}
.view{display:none}.view.active{display:block}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}.metric{padding:16px 16px 15px;border:1px solid var(--line);background:linear-gradient(145deg,var(--panel2),var(--panel));border-radius:10px}.metric-label{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.metric-value{font-size:30px;font-weight:800;margin-top:9px;letter-spacing:-.03em}
.grid2{display:grid;grid-template-columns:1.35fr .65fr;gap:12px;margin-bottom:12px}.panel{border:1px solid var(--line);background:rgba(13,17,15,.78);border-radius:10px;padding:16px}.panel-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.panel-title{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.panel-note{font-size:10px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.mini{border:1px solid var(--line);padding:12px;background:rgba(255,255,255,.015);border-radius:8px}.mini span{display:block;color:var(--muted);font-size:8px;letter-spacing:.12em;text-transform:uppercase}.mini strong{display:block;margin-top:6px;font-size:17px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select{height:38px;border:1px solid var(--line);background:#090c0a;color:var(--text);border-radius:8px;padding:0 11px;font-size:11px}.toolbar input{min-width:260px;flex:1}.toolbar select{min-width:150px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}.table{width:100%;border-collapse:collapse;font-size:11px;min-width:760px}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{font-size:8px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.018)}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:rgba(255,255,255,.02)}
.primary-text{font-weight:700;color:var(--text)}.secondary-text{font-size:10px;color:var(--muted);margin-top:3px}.right{text-align:right!important}
.badge{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;padding:5px 8px;border-radius:999px;border:1px solid var(--line2);font-size:8px;letter-spacing:.1em;text-transform:uppercase}.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.danger{color:var(--danger)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:8px}.notice{padding:11px 13px;border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:8px;color:var(--soft);font-size:10px;line-height:1.5}
.catalog-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.catalog-card{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:15px}.catalog-card h4{margin:0 0 11px;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.catalog-card .rows{display:grid;gap:9px}.kv{display:flex;justify-content:space-between;gap:16px;font-size:11px;border-bottom:1px solid var(--line);padding-bottom:8px}.kv:last-child{border-bottom:0;padding-bottom:0}.kv span{color:var(--muted)}
.drawer{position:fixed;inset:0;display:none;z-index:50}.drawer.open{display:block}.drawer-scrim{position:absolute;inset:0;background:rgba(0,0,0,.62)}.drawer-panel{position:absolute;top:0;right:0;height:100%;width:min(680px,94vw);background:#0a0d0b;border-left:1px solid var(--line2);box-shadow:var(--shadow);overflow:auto;padding:24px}.drawer-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.drawer-title{font-family:Georgia,"Times New Roman",serif;font-size:36px;font-weight:400;margin:7px 0 0}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-card{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px}.detail-card h5{margin:0 0 7px;color:var(--muted);font-size:8px;letter-spacing:.14em;text-transform:uppercase}.detail-card div{font-size:11px;line-height:1.55}.detail-full{grid-column:1/-1}.item-card{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px;margin-top:8px}.item-head{display:flex;justify-content:space-between;gap:10px}.item-title{font-size:11px;font-weight:800}.item-meta{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(500px,100%);border:1px solid var(--line2);background:linear-gradient(145deg,#0d120f,#0a0d0b);border-radius:14px;box-shadow:var(--shadow);padding:35px}.login-title{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:57px;line-height:.92;margin:15px 0 22px}.login-note{font-size:12px;color:var(--muted);line-height:1.65}.google-slot{margin-top:21px;min-height:44px}.login-status{margin-top:14px;font-size:10px;color:var(--muted);min-height:16px}
.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:var(--accent);color:var(--accentText);padding:11px 14px;border-radius:8px;display:none;font-size:11px;box-shadow:var(--shadow);max-width:360px}.toast.show{display:block}.loading{opacity:.58;pointer-events:none}
@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.catalog-grid{grid-template-columns:1fr}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:15px}.brand{margin-bottom:16px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;padding:10px 7px;font-size:9px}.sidebar-foot{margin-top:12px;padding-top:12px;display:flex;align-items:center;gap:10px}.admin-mini{margin:0;flex:1}.main{padding:20px 15px 40px}.topbar{align-items:flex-start;flex-direction:column}.page-title{font-size:38px}.toolbar input{min-width:180px}.detail-grid{grid-template-columns:1fr}.detail-full{grid-column:auto}}
@media(max-width:500px){.metrics{grid-template-columns:1fr 1fr}.metric-value{font-size:24px}.nav{grid-template-columns:repeat(2,1fr)}.login-card{padding:26px}.login-title{font-size:47px}}
</style>
</head>
<body>
<section id="loginView" class="login">
  <div class="login-card">
    <div class="eyebrow">PRIVATE CONTROL / OWNER ACCESS</div>
    <div class="login-title">Operate the<br>archive.</div>
    <div class="login-note">Use the authorized Google account. Access is verified by the TEMPORARY™ backend before a session is created.</div>
    <div id="googleSlot" class="google-slot"></div>
    <div id="loginStatus" class="login-status">Waiting for Google sign-in…</div>
  </div>
</section>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">TEMPORARY™<small>CONTROL / INTERNAL</small></div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot">
      <div id="adminMini" class="admin-mini"></div>
      <button id="logoutBtn" class="btn dark full">Log out</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div>
        <div id="eyebrow" class="eyebrow">SYSTEM / OVERVIEW</div>
        <div id="pageTitle" class="page-title">Dashboard</div>
        <div id="pageSub" class="page-sub">Operational snapshot</div>
      </div>
      <button id="refreshBtn" class="btn">Refresh</button>
    </header>

    <section id="views">
      <section id="view-dashboard" class="view active"></section>
      <section id="view-orders" class="view"></section>
      <section id="view-customers" class="view"></section>
      <section id="view-catalog" class="view"></section>
      <section id="view-payments" class="view"></section>
      <section id="view-audit" class="view"></section>
    </section>
  </main>
</div>

<div id="drawer" class="drawer">
  <div id="drawerScrim" class="drawer-scrim"></div>
  <aside class="drawer-panel">
    <div class="drawer-head">
      <div><div class="eyebrow">ORDER DETAIL</div><div id="drawerTitle" class="drawer-title">Order</div></div>
      <button id="drawerClose" class="btn">Close</button>
    </div>
    <div id="drawerBody"></div>
  </aside>
</div>
<div id="toast" class="toast"></div>

<script>
/* Keep the exact transport used by the previously working admin. */
const API='https://script.google.com/macros/s/AKfycbyi1CjiyUpmliRgAPSFtLweVShZxmY37hG6sT68hCdJ5a4APIupXBwVxks_QrDk0RBg/exec';
const GOOGLE_CLIENT_ID='32171492706-n6rli6equ2e0es8ac15npdcrhctlq2bn.apps.googleusercontent.com';
const SESSION_KEY='tmp_admin_session';
const META_KEY='tmp_admin_meta';
const DEVICE_KEY='tmp_admin_device';
const NAV=[['dashboard','Dashboard'],['orders','Orders'],['customers','Customers'],['catalog','Catalog'],['payments','Payments'],['audit','Audit']];
const STATE={token:localStorage.getItem(SESSION_KEY)||'',meta:JSON.parse(localStorage.getItem(META_KEY)||'null'),view:'dashboard',cache:{}};
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(v,c='EGP')=>Number(v||0).toLocaleString('en-EG',{maximumFractionDigits:2})+' '+(c||'EGP');
const safeDate=v=>{if(!v)return '—';const d=new Date(v);return isNaN(d.getTime())?String(v):d.toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})};
function deviceId(){let v=localStorage.getItem(DEVICE_KEY);if(!v){v='ADMDEV-'+crypto.randomUUID().replaceAll('-','');localStorage.setItem(DEVICE_KEY,v)}return v}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2800)}
function setLoginStatus(v){$('#loginStatus').textContent=v}
function postBridge(payload,timeout=18000){
  return new Promise((resolve,reject)=>{
    const iframe=document.createElement('iframe');iframe.style.display='none';iframe.name='temporary_admin_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const form=document.createElement('form');form.method='POST';form.action=API;form.target=iframe.name;form.style.display='none';
    const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payload);form.appendChild(input);document.body.appendChild(iframe);document.body.appendChild(form);
    let finished=false;
    const timer=setTimeout(()=>{cleanup();reject(new Error('API_TIMEOUT'))},timeout);
    function cleanup(){clearTimeout(timer);window.removeEventListener('message',onMessage);form.remove();iframe.remove()}
    function onMessage(e){const d=e.data;if(!d||d.source!=='TEMPORARY™'||d.type!=='TEMPORARY_API_RESULT')return;finished=true;cleanup();if(d.data?.ok===false)reject(new Error(d.data.error||'API_ERROR'));else resolve(d.data)}
    window.addEventListener('message',onMessage);form.submit();
  })
}
async function adminGet(resource,params={}){return postBridge({action:'adminGet',resource,sessionToken:STATE.token,params})}
async function adminMutate(action,payload={}){return postBridge(Object.assign({action,sessionToken:STATE.token},payload))}
function saveSession(r){
  STATE.token=r.sessionId||r.sessionToken||r.adminSessionToken||'';
  STATE.meta={adminId:r.adminId||r.admin?.adminId||'',email:r.email||r.admin?.email||'',displayName:r.displayName||r.admin?.displayName||'',role:r.role||r.admin?.role||''};
  localStorage.setItem(SESSION_KEY,STATE.token);localStorage.setItem(META_KEY,JSON.stringify(STATE.meta));
}
function clearSession(){localStorage.removeItem(SESSION_KEY);localStorage.removeItem(META_KEY);STATE.token='';STATE.meta=null}
function renderNav(){
  $('#nav').innerHTML=NAV.map(([id,label])=>`<button class="${STATE.view===id?'active':''}" data-view="${id}">${label}</button>`).join('');
  $$('#nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
}
function switchView(view){STATE.view=view;renderNav();setHeader();loadCurrent().catch(e=>showError(e))}
function setHeader(){
  const map={dashboard:['SYSTEM / OVERVIEW','Dashboard','Operational snapshot'],orders:['OPERATIONS / ORDERS','Orders','Manage the order lifecycle'],customers:['CUSTOMER RECORDS','Customers','Customer accounts and spend'],catalog:['CATALOG / PLACEMENTS','Catalog','Products, designs and placement control'],payments:['FINANCE / COD','Payments','Payment records and settlement status'],audit:['SECURITY / AUDIT','Audit','Administrative activity log']};
  const x=map[STATE.view]||map.dashboard;$('#eyebrow').textContent=x[0];$('#pageTitle').textContent=x[1];$('#pageSub').textContent=x[2];
}
function showApp(){
  $('#loginView').classList.add('hidden');$('#app').classList.remove('hidden');
  renderNav();setHeader();applyMeta();
}
function showAuth(){
  $('#loginView').classList.remove('hidden');$('#app').classList.add('hidden');initGoogle();
}
function applyMeta(){if(!STATE.meta)return;$('#adminMini').innerHTML=`<strong>${esc(STATE.meta.displayName||'Admin')}</strong><br>${esc(STATE.meta.email||'')}<br><span style="color:var(--muted)">${esc(STATE.meta.role||'')}</span>`}
async function loginCredential(credential){
  setLoginStatus('Verifying authorized account…');
  try{const r=await postBridge({action:'adminGoogleAuth',credential,deviceId:deviceId()});saveSession(r);if(!STATE.token)throw new Error('ADMIN_SESSION_MISSING');setLoginStatus('Access granted.');showApp();await loadCurrent()}
  catch(e){setLoginStatus('Access denied · '+(e.message||e))}
}
function initGoogle(){
  if(!window.google?.accounts?.id){setTimeout(initGoogle,100);return}
  const slot=$('#googleSlot');if(slot.dataset.ready)return;slot.dataset.ready='1';
  google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,auto_select:true,cancel_on_tap_outside:false,callback:r=>loginCredential(r.credential)});
  google.accounts.id.renderButton(slot,{theme:'outline',size:'large',text:'continue_with',shape:'rectangular',width:320});
}
function statusBadge(v){
  const x=String(v||'—').toUpperCase();const cls=x.includes('CANCEL')||x.includes('FAILED')||x.includes('REJECT')?'danger':x.includes('PENDING')||x.includes('REQUEST')||x.includes('PROCESSING')?'warn':'ok';
  return `<span class="badge ${cls}">${esc(v||'—')}</span>`
}
function showError(e){toast(e.message||String(e))}
function metric(label,val){return `<div class="metric"><div class="metric-label">${esc(label)}</div><div class="metric-value">${esc(val==null?0:val)}</div></div>`}
function orderRows(r){return r.orders||r.items||[]}
function customerRows(r){return r.customers||r.items||[]}
function paymentRows(r){return r.payments||r.items||[]}
function auditRows(r){return r.audit||r.items||r.auditLog||[]}
function normalizeOrder(o){return Object.assign({orderId:'',orderNumber:'',customerName:'',email:'',phone:'',orderStatus:'',paymentStatus:'',total:0,currency:'EGP',deliveryFee:0,paymentMethod:'',createdAt:'',updatedAt:''},o||{})}
function renderDashboard(r){
  const s=r.summary||r.counts||r.metrics||{};const system=r.system||{};
  $('#view-dashboard').innerHTML=`
  <div class="metrics">
    ${metric('Orders',s.orders)}${metric('Customers',s.customers)}${metric('Active carts',s.activeCarts)}${metric('Pending orders',s.pendingOrders)}
    ${metric('Confirmed',s.confirmedOrders)}${metric('Processing',s.processingOrders)}${metric('Shipped',s.shippedOrders)}${metric('Delivered',s.deliveredOrders)}
  </div>
  <div class="grid2">
    <div class="panel"><div class="panel-head"><div><div class="panel-title">Order pipeline</div><div class="panel-note">Current operational state</div></div></div>
      <div class="kpis">
        <div class="mini"><span>Canceled</span><strong>${esc(s.canceledOrders||0)}</strong></div>
        <div class="mini"><span>Pending payments</span><strong>${esc(s.pendingPayments||0)}</strong></div>
        <div class="mini"><span>Paid payments</span><strong>${esc(s.paidPayments||0)}</strong></div>
        <div class="mini"><span>Abandoned carts</span><strong>${esc(s.abandonedCarts||0)}</strong></div>
      </div>
    </div>
    <div class="panel"><div class="panel-head"><div><div class="panel-title">System</div><div class="panel-note">Configuration</div></div></div>
      <div class="kv"><span>Store mode</span><strong>${esc(system.storeMode||system.mode||'OPEN')}</strong></div>
      <div class="kv"><span>Currency</span><strong>${esc(system.currency||'EGP')}</strong></div>
      <div class="kv"><span>COD</span><strong>${system.codEnabled===false?'OFF':'ON'}</strong></div>
      <div class="kv"><span>Paymob</span><strong>${system.paymobEnabled?'ON':'OFF'}</strong></div>
    </div>
  </div>
  <div class="panel"><div class="panel-head"><div><div class="panel-title">Recent orders</div><div class="panel-note">Latest activity</div></div></div>${renderRecentOrders(r.recentOrders||r.recent||r.orders||[],8)}</div>`;
}
function renderRecentOrders(rows,n){const xs=(rows||[]).slice(0,n).map(normalizeOrder);if(!xs.length)return '<div class="empty">No orders yet.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Payment</th><th class="right">Total</th></tr></thead><tbody>${xs.map(o=>`<tr><td><div class="primary-text">${esc(o.orderNumber||o.orderId)}</div><div class="secondary-text">${safeDate(o.createdAt)}</div></td><td><div class="primary-text">${esc(o.customerName||'—')}</div><div class="secondary-text">${esc(o.phone||o.email||'')}</div></td><td>${statusBadge(o.orderStatus)}</td><td>${statusBadge(o.paymentStatus)}</td><td class="right">${money(o.total,o.currency)}</td></tr>`).join('')}</tbody></table></div>`}
async function loadCurrent(){
  if(!STATE.token)return;
  const root=$('#view-'+STATE.view);if(root)root.classList.add('loading');
  try{
    if(STATE.view==='dashboard'){const r=await adminGet('DASHBOARD');STATE.cache.dashboard=r;renderDashboard(r)}
    else if(STATE.view==='orders'){const r=await adminGet('ORDERS',{page:1,pageSize:100});STATE.cache.orders=r;renderOrders(r)}
    else if(STATE.view==='customers'){const r=await adminGet('CUSTOMERS',{page:1,pageSize:100});STATE.cache.customers=r;renderCustomers(r)}
    else if(STATE.view==='catalog'){const r=await adminGet('CATALOG');STATE.cache.catalog=r;renderCatalog(r)}
    else if(STATE.view==='payments'){const r=await adminGet('PAYMENTS',{page:1,pageSize:100});STATE.cache.payments=r;renderPayments(r)}
    else if(STATE.view==='audit'){const r=await adminGet('AUDIT',{page:1,pageSize:100});STATE.cache.audit=r;renderAudit(r)}
  }catch(e){showError(e);if(/SESSION|ADMIN_AUTH|AUTH_REQUIRED|ACCOUNT/.test(e.message||'')){clearSession();showAuth()}}
  finally{if(root)root.classList.remove('loading')}
}
function renderOrders(r){
  const rows=orderRows(r).map(normalizeOrder);STATE.cache.ordersFiltered=rows;
  $('#view-orders').innerHTML=`
    <div class="toolbar"><input id="orderSearch" placeholder="Search order, customer, phone or email"><select id="orderStatus"><option value="">All statuses</option>${['PENDING','CONFIRMED','PROCESSING','SHIPPED','DELIVERED','CANCELED'].map(x=>`<option>${x}</option>`).join('')}</select><button id="orderApply" class="btn primary">Apply</button><button id="orderReset" class="btn">Reset</button></div>
    <div id="ordersTable"></div>`;
  const draw=()=>{const q=String($('#orderSearch').value||'').toLowerCase().trim(),st=String($('#orderStatus').value||'');const xs=rows.filter(o=>{const hay=[o.orderId,o.orderNumber,o.customerId,o.customerName,o.email,o.phone].join(' ').toLowerCase();return (!q||hay.includes(q))&&(!st||String(o.orderStatus).toUpperCase()===st)});$('#ordersTable').innerHTML=tableOrders(xs)};
  $('#orderApply').onclick=draw;$('#orderReset').onclick=()=>{$('#orderSearch').value='';$('#orderStatus').value='';draw()};draw();
}
function nextStatuses(current){const map={PENDING:['CONFIRMED','CANCELED'],CONFIRMED:['PROCESSING','CANCELED'],PROCESSING:['SHIPPED'],SHIPPED:['DELIVERED'],DELIVERED:[],CANCELED:[]};return map[String(current||'').toUpperCase()]||[]}
function tableOrders(rows){if(!rows.length)return '<div class="empty">No matching orders.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Payment</th><th class="right">Total</th><th>Action</th></tr></thead><tbody>${rows.map(o=>{const options=nextStatuses(o.orderStatus);return `<tr><td><div class="primary-text">${esc(o.orderNumber||o.orderId)}</div><div class="secondary-text">${safeDate(o.createdAt)}</div></td><td><div class="primary-text">${esc(o.customerName||'—')}</div><div class="secondary-text">${esc(o.phone||o.email||'')}</div></td><td>${statusBadge(o.orderStatus)}</td><td>${statusBadge(o.paymentStatus)}</td><td class="right">${money(o.total,o.currency)}</td><td><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" data-detail="${esc(o.orderId)}">Details</button>${options.length?`<select class="status-select" data-status-order="${esc(o.orderId)}"><option value="">Change…</option>${options.map(x=>`<option value="${x}">${x}</option>`).join('')}</select>`:'<span class="secondary-text">No action</span>'}</div></td></tr>`}).join('')}</tbody></table></div>`}
function bindOrderActions(){
  $$('[data-detail]').forEach(b=>b.onclick=()=>openOrder(b.dataset.detail));
  $$('.status-select').forEach(s=>s.onchange=async()=>{const next=s.value;if(!next)return;s.disabled=true;try{await adminMutate('adminTransitionOrderStatus',{orderId:s.dataset.statusOrder,newStatus:next,reason:'Admin dashboard'});toast('Order status updated');await refreshOrders()}catch(e){toast(e.message)}finally{s.disabled=false;s.value=''}})
}
function tableOrdersWithBind(rows){const html=tableOrders(rows);setTimeout(bindOrderActions,0);return html}
function refreshOrders(){return loadSectionDirect('orders')}
async function loadSectionDirect(v){STATE.view=v;setHeader();renderNav();await loadCurrent()}
async function openOrder(orderId){
  const d=$('#drawer');$('#drawerTitle').textContent='Loading…';$('#drawerBody').innerHTML='<div class="notice">Fetching order details…</div>';d.classList.add('open');
  try{const r=await adminGet('ORDER',{orderId});renderOrderDrawer(r.order||r.data||{})}catch(e){$('#drawerBody').innerHTML=`<div class="notice">${esc(e.message)}</div>`}
}
function renderOrderDrawer(o){
  const items=o.items||o.orderItems||[];const address=o.deliveryAddress||o.address||o.fullAddress||[o.deliveryGovernorate,o.deliveryArea,o.deliveryAddress].filter(Boolean).join(' · ');
  $('#drawerTitle').textContent=o.orderNumber||o.orderId||'Order';
  $('#drawerBody').innerHTML=`
    <div class="detail-grid">
      <div class="detail-card"><h5>Customer</h5><div>${esc(o.customerName||'—')}</div><div>${esc(o.email||'—')}</div><div>${esc(o.phone||'—')}</div></div>
      <div class="detail-card"><h5>Status</h5><div>${statusBadge(o.orderStatus)}</div><div style="margin-top:7px">Payment: ${statusBadge(o.paymentStatus)}</div></div>
      <div class="detail-card"><h5>Order</h5><div>${esc(o.orderId||'—')}</div><div>${safeDate(o.createdAt)}</div></div>
      <div class="detail-card"><h5>Total</h5><div>${money(o.total,o.currency)}</div><div>Delivery ${money(o.deliveryFee,o.currency)}</div></div>
      <div class="detail-card detail-full"><h5>Delivery address</h5><div>${esc(address||'—')}</div></div>
      <div class="detail-card detail-full"><h5>Items</h5>${items.length?items.map(i=>`<div class="item-card"><div class="item-head"><div class="item-title">${esc(i.productName||i.product||'Product')}</div><div>${esc(i.quantity||1)} × ${money(i.unitPrice||i.price||0,o.currency)}</div></div><div class="item-meta">Design: ${esc(i.designName||i.design||'—')} · Color: ${esc(i.color||'—')} · Size: ${esc(i.size||i.garmentSize||'—')}<br>Side: ${esc(i.side||i.designSide||'—')} · Print: ${esc(i.printSize||i.designPrintSize||'—')}<br>${i.mockupPreviewUrl||i.mockupUrl?`<a href="${esc(i.mockupPreviewUrl||i.mockupUrl)}" target="_blank" rel="noopener" style="color:var(--soft)">Open mockup preview</a>`:'No mockup preview'}</div></div>`).join(''):'<div class="empty">No order items returned.</div>'}</div>
    </div>`;
}
function renderCustomers(r){const rows=customerRows(r);$('#view-customers').innerHTML=`<div class="toolbar"><input id="customerSearch" placeholder="Search name, email, phone"><button id="customerApply" class="btn primary">Search</button></div><div id="customersTable"></div>`;const draw=()=>{const q=String($('#customerSearch').value||'').toLowerCase().trim();const xs=rows.filter(c=>{const hay=[c.fullName,c.email,c.phone,c.customerId].join(' ').toLowerCase();return !q||hay.includes(q)});$('#customersTable').innerHTML=xs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th class="right">Total spend</th><th>Created</th></tr></thead><tbody>${xs.map(c=>`<tr><td><div class="primary-text">${esc(c.fullName||'—')}</div><div class="secondary-text">${esc(c.customerId||'')}</div></td><td>${esc(c.email||'—')}</td><td>${esc(c.phone||'—')}</td><td>${esc(c.totalOrders||c.orders||0)}</td><td class="right">${money(c.totalSpend||0,c.currency||'EGP')}</td><td>${safeDate(c.createdAt)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No matching customers.</div>'};$('#customerApply').onclick=draw;draw()}
function renderCatalog(r){
  const p=r.products||[],d=r.designs||[],pl=r.placements||[];
  $('#view-catalog').innerHTML=`
    <div class="catalog-grid">
      <div class="catalog-card"><h4>Products · ${p.length}</h4><div class="rows">${p.map(x=>`<div class="kv"><span>${esc(x.productName||x.productId)}</span><strong>${money(x.price,x.currency||'EGP')}</strong></div>`).join('')||'<div class="empty">No products.</div>'}</div></div>
      <div class="catalog-card"><h4>Designs · ${d.length}</h4><div class="rows">${d.map(x=>`<div class="kv"><span>${esc(x.designName||x.designId)}</span><strong>${esc(x.productionLimit||x.limit||'—')}</strong></div>`).join('')||'<div class="empty">No designs.</div>'}</div></div>
    </div>
    <div class="panel" style="margin-top:12px"><div class="panel-head"><div><div class="panel-title">Placement matrix</div><div class="panel-note">${pl.length} canonical records</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Design</th><th>Artwork</th><th>Side</th><th>Print</th><th>Width</th><th>Top</th><th>Left</th></tr></thead><tbody>${pl.map(x=>`<tr><td>${esc(x.productId)}</td><td>${esc(x.designId||'LOGO')}</td><td>${esc(x.artworkType||'')}</td><td>${esc(x.side||'')}</td><td>${esc(x.printSize||'')}</td><td>${esc(x.width||'')}</td><td>${esc(x.top||'')}</td><td>${esc(x.left||'')}</td></tr>`).join('')||'<tr><td colspan="8"><div class="empty">No placements.</div></td></tr>'}</tbody></table></div></div>
    <div class="notice" style="margin-top:12px">Placement editing remains connected to the existing server-side placement engine. This page keeps presentation separate from the data contract.</div>`;
}
function renderPayments(r){const rows=paymentRows(r);$('#view-payments').innerHTML=`<div class="toolbar"><select id="paymentStatus"><option value="">All statuses</option><option>PENDING</option><option>PAID</option><option>FAILED</option><option>EXPIRED</option></select><button id="paymentApply" class="btn primary">Filter</button></div><div id="paymentsTable"></div>`;const draw=()=>{const st=$('#paymentStatus').value;const xs=rows.filter(p=>!st||String(p.paymentStatus||'').toUpperCase()===st);$('#paymentsTable').innerHTML=xs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Payment</th><th>Order</th><th>Method</th><th>Status</th><th class="right">Amount</th><th>Action</th></tr></thead><tbody>${xs.map(p=>`<tr><td>${esc(p.paymentId||'—')}</td><td>${esc(p.orderId||'—')}</td><td>${esc(p.paymentMethod||'COD')}</td><td>${statusBadge(p.paymentStatus)}</td><td class="right">${money(p.amount||0,p.currency||'EGP')}</td><td>${String(p.paymentStatus||'').toUpperCase()==='PAID'?'<span class="secondary-text">Settled</span>':`<button class="btn small" data-paid="${esc(p.paymentId)}">Mark paid</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No matching payments.</div>';setTimeout(bindPaymentActions,0)};$('#paymentApply').onclick=draw;draw()}
function bindPaymentActions(){
  $$('[data-paid]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await adminMutate('adminTransitionPaymentStatus',{paymentId:b.dataset.paid,newStatus:'PAID',reason:'COD paid in admin dashboard'});toast('Payment marked paid');await loadSectionDirect('payments')}catch(e){toast(e.message)}finally{b.disabled=false}})
}
function renderAudit(r){const rows=auditRows(r);$('#view-audit').innerHTML=`<div class="toolbar"><input id="auditSearch" placeholder="Search actor, action, entity"><button id="auditApply" class="btn primary">Search</button></div><div id="auditTable"></div>`;const draw=()=>{const q=String($('#auditSearch').value||'').toLowerCase().trim();const xs=rows.filter(a=>{const hay=[a.actorType,a.actorId,a.action,a.entityType,a.entityId,a.details].join(' ').toLowerCase();return !q||hay.includes(q)});$('#auditTable').innerHTML=xs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody>${xs.map(a=>`<tr><td>${safeDate(a.createdAt)}</td><td>${esc(a.actorType||'')}<div class="secondary-text">${esc(a.actorId||'')}</div></td><td>${esc(a.action||'')}</td><td>${esc(a.entityType||'')}<div class="secondary-text">${esc(a.entityId||'')}</div></td><td>${esc(typeof a.details==='string'?a.details:JSON.stringify(a.details||{}))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No audit records.</div>'};$('#auditApply').onclick=draw;draw()}

/* Patch action binding after Orders renders. */
const _renderOrders=renderOrders;renderOrders=function(r){_renderOrders(r);setTimeout(()=>{bindOrderActions()},0)};

$('#refreshBtn').onclick=()=>loadCurrent();
$('#logoutBtn').onclick=async()=>{try{if(STATE.token)await adminMutate('adminLogout',{})}catch(_){}clearSession();try{google.accounts.id.disableAutoSelect()}catch(_){}showAuth()};
$('#drawerClose').onclick=()=>$('#drawer').classList.remove('open');$('#drawerScrim').onclick=()=>$('#drawer').classList.remove('open');

(async function boot(){
  if(STATE.token){
    try{const r=await adminGet('DASHBOARD');STATE.meta=STATE.meta||{displayName:r.viewer?.displayName||r.admin?.displayName||'',role:r.viewer?.role||r.admin?.role||'',email:r.viewer?.email||r.admin?.email||''};localStorage.setItem(META_KEY,JSON.stringify(STATE.meta));showApp();renderDashboard(r)}catch(_){clearSession();showAuth()}
  }else showAuth();
})();
</script>
</body>
</html>
