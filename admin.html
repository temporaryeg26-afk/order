<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEMPORARY™ / CONTROL</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#060706;--panel:#0d110e;--panel2:#131814;--text:#eef2ee;--muted:#8d9790;--line:rgba(238,242,238,.12);--accent:#eef2ee;--serif:Georgia,'Times New Roman',serif;--sans:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}button,input,select{font:inherit}button{cursor:pointer}
.app{display:none;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;padding:22px 14px;background:rgba(8,10,8,.97);border-right:1px solid var(--line);z-index:20}.brand{padding:7px 10px 24px;border-bottom:1px solid var(--line);font-weight:900;letter-spacing:.24em;font-size:13px}.brand small{display:block;margin-top:8px;color:var(--muted);font:8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em}
.nav-label{margin:22px 10px 8px;color:#59635c;font:800 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em}.nav-btn{width:100%;padding:12px 11px;margin:2px 0;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;font-size:10px;letter-spacing:.11em;text-transform:uppercase;display:flex;justify-content:space-between}.nav-btn:hover,.nav-btn.active{border-color:var(--line);background:var(--panel2);color:var(--text)}
.main{width:calc(100% - 248px);margin-left:248px;min-height:100vh}.topbar{height:70px;position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(6,7,6,.88);backdrop-filter:blur(18px)}.page-title{font:500 30px/1 var(--serif);letter-spacing:-.04em}.top-meta{font:8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;color:var(--muted)}
.content{padding:28px;max-width:1580px}.section{margin-bottom:22px}.kicker{font:800 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}h2{font:500 clamp(36px,5vw,64px)/.88 var(--serif);letter-spacing:-.06em;margin:8px 0 22px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel),var(--panel2));padding:18px;min-height:110px}.stat span{display:block;color:var(--muted);font:8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase}.stat strong{display:block;margin-top:12px;font-size:29px}.panel{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel),var(--panel2));padding:20px}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}.search{min-width:280px;padding:11px 12px;background:var(--bg);color:var(--text);border:1px solid var(--line)}.btn{border:1px solid var(--line);background:transparent;color:var(--text);padding:10px 13px;font-size:9px;letter-spacing:.12em;text-transform:uppercase}.btn:hover{border-color:var(--accent);transform:translateY(-1px)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.table-wrap{overflow:auto;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:850px;font-size:10px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font:800 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;color:var(--muted)}tbody tr:hover{background:rgba(255,255,255,.02)}
.catalog-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px}.controls{display:grid;gap:11px}.control label{display:block;font:800 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:var(--muted);margin-bottom:6px}.control select,.control input[type=number]{width:100%;padding:11px;background:var(--bg);color:var(--text);border:1px solid var(--line)}
.stage-shell{border:1px solid var(--line);background:#050505;padding:14px}.stage{position:relative;width:min(100%,720px);aspect-ratio:1/1;margin:auto;overflow:hidden;background:#080808}.stage img.base,.stage img.layer{position:absolute!important;width:100%!important;height:100%!important;inset:0;object-fit:contain!important}.stage img.layer{inset:auto;transform-origin:center;touch-action:none;cursor:grab;z-index:4}.stage img.layer.dragging{cursor:grabbing}
.range-row{display:grid;grid-template-columns:1fr 78px;gap:7px;align-items:center}.range-row input[type=number]{width:100%;padding:8px}.readouts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.readout{border:1px solid var(--line);padding:10px}.readout span{display:block;font:8px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.12em}.readout strong{display:block;margin-top:4px}.notice{padding:11px;border:1px solid #5a4430;background:#18110c;color:#c9a984;font-size:10px;line-height:1.6}.small-note{color:var(--muted);font-size:10px;line-height:1.6}
.login{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 30%,rgba(130,160,140,.14),transparent 34%),#060706;display:grid;place-items:center;padding:16px}.login-card{width:min(600px,100%);padding:36px;border:1px solid var(--line);background:var(--panel);box-shadow:0 30px 100px rgba(0,0,0,.45)}.login-title{font:500 clamp(54px,12vw,105px)/.78 var(--serif);letter-spacing:-.08em;margin:16px 0}.google-slot{margin-top:24px;min-height:48px}.login-status{margin-top:12px;color:var(--muted);font:8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em}
@media(max-width:1040px){.catalog-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.sidebar{width:72px;padding:18px 8px}.brand{font-size:0;padding:4px 5px 18px}.brand:after{content:'T™';font-size:18px}.brand small,.nav-label,.nav-btn span:last-child{display:none}.nav-btn{justify-content:center}.main{width:calc(100% - 72px);margin-left:72px}.topbar{padding:0 14px}.page-title{font-size:22px}.content{padding:15px}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="login" id="login"><div class="login-card"><div class="kicker">PRIVATE CONTROL / V1</div><div class="login-title">CONTROL<br>THE<br>ARCHIVE.</div><div class="small-note">Google access is verified by the Apps Script backend. Only an ACTIVE allowlisted admin can enter.</div><div class="google-slot" id="googleSlot"></div><div class="login-status" id="loginStatus">SECURE ADMIN ACCESS · WAITING FOR GOOGLE</div></div></div>
<div class="app" id="app">
<aside class="sidebar"><div class="brand">TEMPORARY™<small>CONTROL / ADMIN</small></div><div class="nav-label">WORKSPACE</div>
<button class="nav-btn active" data-section="dashboard"><span>Dashboard</span><span>01</span></button><button class="nav-btn" data-section="orders"><span>Orders</span><span>02</span></button><button class="nav-btn" data-section="carts"><span>Carts</span><span>03</span></button><button class="nav-btn" data-section="customers"><span>Customers</span><span>04</span></button><button class="nav-btn" data-section="catalog"><span>Catalog</span><span>05</span></button><button class="nav-btn" data-section="payments"><span>Payments</span><span>06</span></button><button class="nav-btn" data-section="audit"><span>Audit</span><span>07</span></button>
<div class="nav-label">SESSION</div><button class="nav-btn" id="logout"><span>Log out</span><span>↗</span></button></aside>
<main class="main"><header class="topbar"><div class="page-title" id="pageTitle">Dashboard</div><div class="top-meta" id="topMeta">SECURE / READY</div></header><div class="content" id="content"></div></main>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycbx5InYO32kfhcCo34Me8AfCK3mZhaSsJABXL0dElh_kZT-dZKICpMxhXSUmWL9jsAiK/exec",CLIENT_ID="32171492706-n6rli6equ2e0es8ac15npdcrhctlq2bn.apps.googleusercontent.com",SESSION_KEY='temporary_admin_v3',DEVICE_KEY='temporary_admin_device_v3';
const state={token:localStorage.getItem(SESSION_KEY)||'',admin:null,placements:[],catalog:null};
const $=s=>document.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v,c='EGP'){return new Intl.NumberFormat('en-EG',{maximumFractionDigits:2}).format(Number(v||0))+' '+c}
function deviceId(){let x=localStorage.getItem(DEVICE_KEY);if(!x){x='adm-'+crypto.randomUUID();localStorage.setItem(DEVICE_KEY,x)}return x}
async function api(action,payload={},timeout=20000){const c=new AbortController(),tm=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload}),signal:c.signal,cache:'no-store'});const j=await r.json();if(j.ok===false)throw new Error(j.errorCode||j.error||'API_ERROR');return j}finally{clearTimeout(tm)}}
function assetFor(p,c){const a=p?.assets||[];return a.find(x=>String(x.color).toLowerCase()===String(c||'').toLowerCase())||a[0]||null}
function designAsset(d,side){const a=d?.assets||[];return a.find(x=>String(x.side).toUpperCase()===String(side).toUpperCase())||a[0]||null}
function place(productId,designId,type,side,size){return state.placements.find(p=>String(p.productId)===String(productId)&&String(p.designId||'')===String(designId||'')&&String(p.artworkType).toUpperCase()===type&&String(p.side).toUpperCase()===side&&Number(p.printSize)===Number(size))||null}
function toast(m){const x=document.createElement('div');x.textContent=m;x.style.cssText='position:fixed;right:22px;bottom:22px;z-index:500;color:#000;background:#eef2ee;padding:12px 15px;font:10px monospace;box-shadow:0 15px 50px rgba(0,0,0,.3)';document.body.appendChild(x);setTimeout(()=>x.remove(),2500)}
function initGoogle(){if(!window.google?.accounts?.id){setTimeout(initGoogle,100);return}google.accounts.id.initialize({client_id:CLIENT_ID,auto_select:true,use_fedcm_for_button:true,button_auto_select:true,cancel_on_tap_outside:false,callback:r=>login(r.credential)});$('#googleSlot').innerHTML='';google.accounts.id.renderButton($('#googleSlot'),{theme:'outline',size:'large',shape:'pill',text:'continue_with',width:320});try{google.accounts.id.prompt()}catch(_){}}
async function login(credential){$('#loginStatus').textContent='SECURE ADMIN ACCESS · VERIFYING';try{const r=await api('admingoogleauth',{credential,deviceId:deviceId()});state.token=r.sessionToken;state.admin=r.admin;localStorage.setItem(SESSION_KEY,state.token);$('#login').style.display='none';$('#app').style.display='flex';$('#topMeta').textContent=(state.admin?.role||'ADMIN')+' / AUTHENTICATED';await show('dashboard')}catch(e){$('#loginStatus').textContent='ADMIN AUTH ERROR · '+(e.message||e)}}
function metric(label,value){return `<div class="stat"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`}
function renderDashboard(r){const m=r.metrics||{},s=r.system||{},v=r.viewer||{};$('#content').innerHTML=`<section class="section"><div class="kicker">SYSTEM OVERVIEW</div><h2>Dashboard</h2><div class="stats">${metric('Orders',m.orders)}${metric('Customers',m.customers)}${metric('Active carts',m.activeCarts)}${metric('Pending orders',m.pendingOrders)}${metric('Processing',m.processing)}${metric('Shipped',m.shipped)}${metric('Delivered',m.delivered)}${metric('Pending payments',m.pendingPayments)}</div></section><section class="panel"><div class="kicker">OPERATOR</div><div style="font-size:18px;margin-top:8px">${esc(v.displayName||'')}</div><div class="small-note">${esc(v.role||'')} · ${esc(s.storeMode||'')} · ${esc(s.currency||'EGP')} · COD ${s.codEnabled?'ON':'OFF'}</div></section>`}
function renderRows(section,r){const items=r.items||[];const filtered=items;$('#content').innerHTML=`<section class="section"><div class="kicker">${esc(section)}</div><h2>${esc(section[0].toUpperCase()+section.slice(1))}</h2><div class="panel"><div class="toolbar"><input id="recordSearch" class="search" placeholder="Search ${esc(section)}…"><button class="btn" id="refresh">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Record</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div></div></section>`;function draw(list){$('#rows').innerHTML=list.length?list.map(x=>`<tr><td><strong>${esc(x.orderNumber||x.orderId||x.customerId||x.paymentId||x.cartId||x.auditId||'—')}</strong></td><td><pre style="white-space:pre-wrap;margin:0;color:var(--muted)">${esc(JSON.stringify(x,null,2))}</pre></td></tr>`).join(''):'<tr><td colspan="2" class="small-note">No records yet.</td></tr>'}draw(filtered);$('#recordSearch').oninput=e=>{const q=e.target.value.toLowerCase();draw(items.filter(x=>JSON.stringify(x).toLowerCase().includes(q)))};$('#refresh').onclick=()=>show(section)}
function renderCatalog(r){state.catalog=r;state.placements=r.placements||[];const products=r.products||[],designs=r.designs||[];$('#content').innerHTML=`<section class="section"><div class="kicker">CATALOG / PLACEMENT CONTROL</div><h2>Place every mark.</h2><div class="catalog-grid"><div class="panel"><div class="controls">
<div class="control"><label>PRODUCT</label><select id="selProduct">${products.map(p=>`<option value="${esc(p.productId)}">${esc(p.productName)}</option>`).join('')}</select></div>
<div class="control"><label>ARTWORK</label><select id="selArtwork"><option value="DESIGN">DESIGN</option><option value="LOGO">LOGO</option></select></div>
<div class="control"><label>DESIGN</label><select id="selDesign">${designs.map(d=>`<option value="${esc(d.designId)}">${esc(d.designName)}</option>`).join('')}</select></div>
<div class="control"><label>SIDE</label><select id="selSide"><option>FRONT</option><option>BACK</option></select></div>
<div class="control"><label>PRINT SIZE</label><select id="selPrint"><option value="20">20 × 20 CM</option><option value="30">30 × 30 CM</option><option value="7">7 × 7 CM</option></select></div>
<div class="control"><label>MOCKUP COLOR</label><select id="selColor"></select></div>
<div class="notice">Drag the selected artwork directly on the mockup. SAVE writes the real PLACEMENTS row through the server-side catalog permission.</div>
<div><label class="kicker">WIDTH</label><div class="range-row"><input id="widthR" type="range" min="1" max="80" step=".1"><input id="widthN" type="number" step=".1"></div></div>
<div><label class="kicker">TOP</label><div class="range-row"><input id="topR" type="range" min="0" max="100" step=".1"><input id="topN" type="number" step=".1"></div></div>
<div><label class="kicker">LEFT</label><div class="range-row"><input id="leftR" type="range" min="0" max="100" step=".1"><input id="leftN" type="number" step=".1"></div></div>
<div><label class="kicker">ROTATION</label><div class="range-row"><input id="rotR" type="range" min="-180" max="180" step=".5"><input id="rotN" type="number" step=".5"></div></div>
<div><label class="kicker">OPACITY</label><div class="range-row"><input id="opR" type="range" min="0" max="1" step=".01"><input id="opN" type="number" min="0" max="1" step=".01"></div></div>
<div style="display:flex;gap:8px"><button class="btn primary" id="save" style="flex:1">SAVE PLACEMENT</button><button class="btn" id="reload">RESET</button></div>
<div class="readouts"><div class="readout"><span>WIDTH</span><strong id="rw">—</strong></div><div class="readout"><span>TOP</span><strong id="rt">—</strong></div><div class="readout"><span>LEFT</span><strong id="rl">—</strong></div><div class="readout"><span>ROTATION</span><strong id="rr">—</strong></div></div>
</div></div><div class="stage-shell"><div class="kicker" style="margin-bottom:10px">LIVE CUSTOMER MOCKUP COORDINATE CANVAS</div><div class="stage" id="stage"><img class="base" id="base"><img class="layer" id="designLayer"><img class="layer" id="logoLayer"></div></div></div></section>
<section class="panel"><div class="kicker">PRODUCT CATALOG</div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Product</th><th>Material</th><th>Fit</th><th>Sizes</th><th>Colors</th><th>Price</th></tr></thead><tbody>${products.map(p=>`<tr><td><strong>${esc(p.productName)}</strong><br><span class="small-note">${esc(p.productCode)}</span></td><td>${esc(p.material)}</td><td>${esc(p.fit)}</td><td>${esc((p.sizes||[]).join(' · '))}</td><td>${esc((p.colors||[]).join(' · '))}</td><td>${money(p.price,p.currency)}</td></tr>`).join('')}</tbody></table></div></section>`;
initEditor(products,designs)}
function initEditor(products,designs){const q={product:$('#selProduct'),art:$('#selArtwork'),design:$('#selDesign'),side:$('#selSide'),print:$('#selPrint'),color:$('#selColor')};function sync(){const p=products.find(x=>x.productId===q.product.value)||products[0];q.color.innerHTML=(p?.colors||[]).map(c=>`<option>${esc(c)}</option>`).join('');const logo=q.art.value==='LOGO';q.design.disabled=logo;q.print.innerHTML=logo?'<option value="7">7 × 7 CM</option>':'<option value="20">20 × 20 CM</option><option value="30">30 × 30 CM</option>'}
function key(){return {productId:q.product.value,designId:q.art.value==='LOGO'?'':q.design.value,artworkType:q.art.value,side:q.side.value,printSize:Number(q.print.value)}}function current(){const k=key();return place(k.productId,k.designId,k.artworkType,k.side,k.printSize)}function vals(){return {width:Number($('#widthN').value),top:Number($('#topN').value),left:Number($('#leftN').value),rotation:Number($('#rotN').value),opacity:Number($('#opN').value)}}
function set(k,v){$('#'+k+'R').value=v;$('#'+k+'N').value=v}
function apply(){const v=vals(),el=q.art.value==='LOGO'?$('#logoLayer'):$('#designLayer');el.style.width=v.width+'%';el.style.height=v.width+'%';el.style.left=v.left+'%';el.style.top=v.top+'%';el.style.transform=`translate(-50%,-50%) rotate(${v.rotation}deg)`;el.style.opacity=v.opacity;$('#rw').textContent=v.width.toFixed(2)+'%';$('#rt').textContent=v.top.toFixed(2)+'%';$('#rl').textContent=v.left.toFixed(2)+'%';$('#rr').textContent=v.rotation.toFixed(1)+'°'}
function load(){sync();const k=key(),p=products.find(x=>x.productId===k.productId)||products[0],d=designs.find(x=>x.designId===k.designId),selected=current();$('#base').src=assetFor(p,q.color)?.assetUrl||'';const selectedEl=q.art.value==='LOGO'?$('#logoLayer'):$('#designLayer'),otherEl=q.art.value==='LOGO'?$('#designLayer'):$('#logoLayer');const selectedUrl=q.art.value==='LOGO'?(state.catalog.logo?.assetUrl||''):(designAsset(d,k.side)?.assetUrl||'');const otherSide=k.side==='FRONT'?'BACK':'FRONT';const otherRow=q.art.value==='LOGO'?place(k.productId,k.designId,'DESIGN',k.side,k.printSize):place(k.productId,'','LOGO',otherSide,7);const otherUrl=q.art.value==='LOGO'?(designAsset(d,k.side)?.assetUrl||''):(state.catalog.logo?.assetUrl||'');selectedEl.src=selectedUrl;otherEl.src=otherUrl;selectedEl.dataset.active='1';otherEl.dataset.active='0';selectedEl.style.display=selectedUrl?'block':'none';otherEl.style.display=otherUrl&&otherRow?'block':'none';[selectedEl,otherEl].forEach(el=>{el.style.width='8%';el.style.height='8%'});
if(selected){set('width',selected.width||8);set('top',selected.top??50);set('left',selected.left??50);set('rotation',selected.rotation||0);set('op',selected.opacity??1);state.selected=selected}else{set('width',8);set('top',50);set('left',50);set('rotation',0);set('op',1);state.selected=null}apply();if(otherRow){otherEl.style.width=(otherRow.width||8)+'%';otherEl.style.height=(otherRow.height||otherRow.width||8)+'%';otherEl.style.left=(otherRow.left||50)+'%';otherEl.style.top=(otherRow.top||50)+'%';otherEl.style.transform=`translate(-50%,-50%) rotate(${Number(otherRow.rotation||0)}deg)`;otherEl.style.opacity=Number(otherRow.opacity??1)}}
['product','art','design','side','print','color'].forEach(k=>q[k].addEventListener('change',load));[['width','width'],['top','top'],['left','left'],['rotation','rot'],['opacity','op']].forEach(([n,id])=>{const r=$('#'+id+'R'),x=$('#'+id+'N');r.addEventListener('input',e=>{x.value=e.target.value;apply()});x.addEventListener('input',e=>{r.value=e.target.value;apply()})});
let drag=null;function down(e){const el=e.currentTarget;if(el.style.display==='none')return;const rect=$('#stage').getBoundingClientRect();drag={x:e.clientX,y:e.clientY,left:Number($('#leftN').value),top:Number($('#topN').value),w:rect.width,h:rect.height,el:el};el.classList.add('dragging');el.setPointerCapture?.(e.pointerId);e.preventDefault()}function move(e){if(!drag)return;const l=Math.max(0,Math.min(100,drag.left+(e.clientX-drag.x)/drag.w*100)),t=Math.max(0,Math.min(100,drag.top+(e.clientY-drag.y)/drag.h*100));$('#leftN').value=l.toFixed(2);$('#leftR').value=l;$('#topN').value=t.toFixed(2);$('#topR').value=t;apply()}function up(){if(drag?.el)drag.el.classList.remove('dragging');drag=null}
$('#designLayer').onpointerdown=down;$('#designLayer').onpointermove=move;$('#designLayer').onpointerup=up;$('#designLayer').onpointercancel=up;$('#logoLayer').onpointerdown=down;$('#logoLayer').onpointermove=move;$('#logoLayer').onpointerup=up;$('#logoLayer').onpointercancel=up;
$('#save').onclick=async()=>{const k=key(),v=vals(),b=$('#save'),payload={placementId:state.selected?.placementId||'',productId:k.productId,artworkType:k.artworkType,designId:k.designId,side:k.side,printSize:k.printSize,width:v.width,top:v.top,left:v.left,rotation:v.rotation,opacity:v.opacity,active:true,notes:state.selected?.notes||''};b.disabled=true;b.textContent='SAVING…';try{const r=await api('adminsaveplacement',{sessionToken:state.token,placement:payload});state.selected=r.placement;const i=state.placements.findIndex(x=>x.placementId===r.placement.placementId);if(i>=0)state.placements[i]=r.placement;else state.placements.push(r.placement);toast('PLACEMENT SAVED TO PLACEMENTS');load()}catch(e){toast('SAVE FAILED · '+(e.message||e))}finally{b.disabled=false;b.textContent='SAVE PLACEMENT'}};
$('#reload').onclick=load;sync();load()}
async function show(section){$$('.nav-btn[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===section));$('#pageTitle').textContent=section[0].toUpperCase()+section.slice(1);$('#content').innerHTML='<section class="panel">LOADING…</section>';try{const r=await api('adminget',{sessionToken:state.token,section,query:{}});if(section==='dashboard')renderDashboard(r);else if(section==='catalog')renderCatalog(r);else renderRows(section,r)}catch(e){$('#content').innerHTML=`<section class="panel"><div style="color:#ff8d79;font-size:12px">REQUEST FAILED · ${esc(e.message||e)}</div></section>`}}
$$('.nav-btn[data-section]').forEach(b=>b.onclick=()=>show(b.dataset.section));$('#logout').onclick=async()=>{try{await api('adminlogout',{sessionToken:state.token})}catch(_){}try{google.accounts.id.disableAutoSelect()}catch(_){}localStorage.removeItem(SESSION_KEY);location.reload()};
async function boot(){if(state.token){try{const r=await api('adminget',{sessionToken:state.token,section:'dashboard',query:{}});state.admin=r.viewer;$('#login').style.display='none';$('#app').style.display='flex';$('#topMeta').textContent=(state.admin?.role||'ADMIN')+' / RESTORED';renderDashboard(r);return}catch(_){localStorage.removeItem(SESSION_KEY);state.token=''}}initGoogle()}boot();
