<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEMPORARY™ — EVERYTHING IS TEMPORARY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --card-bg: #121212;
      --border: #222;
      --accent: #fff;
      --text-muted: #888;
      --font-display: 'Syne', sans-serif;
      --font-body: 'Space Grotesk', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--accent);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
    }
    .logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      letter-spacing: -0.05em;
      text-transform: uppercase;
    }
    .nav-actions { display: flex; align-items: center; gap: 1.5rem; }
    .nav-btn {
      background: none;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.5rem 1rem;
      font-family: var(--font-body);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: #fff; color: #000; }
    main { flex: 1; padding: 2rem; max-width: 1400px; margin: 0 auto; width: 100%; }
    .hero-banner {
      padding: 4rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 3rem;
      text-align: left;
    }
    .hero-banner h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 0.95;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .hero-banner p { color: var(--text-muted); max-width: 600px; font-size: 1.1rem; }
    
    /* Catalog Grid */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      margin-bottom: 4rem;
    }
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }
    .product-card:hover { transform: translateY(-4px); border-color: #444; }
    .product-thumb { width: 100%; aspect-ratio: 1; object-fit: cover; background: #181818; }
    .product-meta { padding: 1.5rem; }
    .product-name { font-family: var(--font-display); font-size: 1.2rem; margin-bottom: 0.5rem; }
    .product-price { font-size: 1rem; color: var(--text-muted); }

    /* Customizer Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-content {
      background: var(--bg);
      border: 1px solid var(--border);
      width: 90%; max-width: 1000px; max-height: 90vh;
      overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr;
    }
    @media(max-width: 768px) {
      .modal-content { grid-template-columns: 1fr; }
    }
    .canvas-container {
      position: relative; width: 100%; aspect-ratio: 1;
      background: #181818; overflow: hidden;
    }
    .mockup-base { width: 100%; height: 100%; object-fit: contain; }
    .artwork-overlay, .logo-overlay {
      position: absolute; pointer-events: none;
      transform-origin: center; transition: all 0.2s ease-out;
    }
    .customizer-form { padding: 2rem; display: flex; flex-direction: column; gap: 1.2rem; }
    .form-group label {
      display: block; font-size: 0.8rem; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 0.5rem; letter-spacing: 0.05em;
    }
    .form-group select, .form-group input {
      width: 100%; padding: 0.8rem; background: var(--card-bg);
      border: 1px solid var(--border); color: #fff; font-family: var(--font-body);
    }
    .btn-checkout, .btn-add-cart {
      background: #fff; color: #000; padding: 1rem; font-family: var(--font-display);
      font-size: 1rem; text-transform: uppercase; border: none; cursor: pointer;
      width: 100%; margin-top: 1rem; font-weight: 700;
    }
    .btn-checkout:hover, .btn-add-cart:hover { background: #ccc; }
    
    /* Cart Modal */
    .cart-drawer {
      position: fixed; top: 0; right: -450px; width: 100%; max-width: 450px; height: 100vh;
      background: var(--bg); border-left: 1px solid var(--border); z-index: 1100;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1); padding: 2rem;
      display: flex; flex-direction: column;
    }
    .cart-drawer.open { right: 0; }
    .cart-items-list { flex: 1; overflow-y: auto; margin: 1.5rem 0; display: flex; flex-direction: column; gap: 1rem; }
    .cart-item-row { border-bottom: 1px solid var(--border); padding-bottom: 1rem; display: flex; justify-content: space-between; }
    
    /* Toast */
    .toast {
      position: fixed; bottom: 2rem; right: 2rem; background: #fff; color: #000;
      padding: 1rem 2rem; font-weight: 600; display: none; z-index: 2000;
      border: 1px solid #000;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">TEMPORARY™</div>
    <div class="nav-actions">
      <div id="google-login-container"></div>
      <button class="nav-btn" id="btn-account" style="display:none;" onclick="showAccount()">ACCOUNT</button>
      <button class="nav-btn" onclick="toggleCart()">CART (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <main>
    <section class="hero-banner">
      <h1>Everything is Temporary</h1>
      <p>Limited run garments. Strict production ceilings. No repeats.</p>
    </section>

    <div class="catalog-grid" id="catalog-container"></div>
  </main>

  <!-- Interactive Customizer Modal -->
  <div class="modal-overlay" id="customizer-modal">
    <div class="modal-content">
      <div class="canvas-container" id="visual-canvas">
        <img id="canvas-garment" class="mockup-base" src="" alt="Garment Base">
        <img id="canvas-artwork" class="artwork-overlay" src="" alt="Design Overlay">
        <img id="canvas-logo" class="logo-overlay" src="" alt="Logo Overlay">
      </div>
      <div class="customizer-form">
        <h2 id="modal-product-name" style="font-family: var(--font-display);">Garment Name</h2>
        <div id="modal-product-price" style="color: var(--text-muted);">0 EGP</div>

        <div class="form-group">
          <label>Design</label>
          <select id="cust-design" onchange="updateMockup()"></select>
        </div>
        <div class="form-group">
          <label>Garment Color</label>
          <select id="cust-color" onchange="updateMockupColor()"></select>
        </div>
        <div class="form-group">
          <label>Size</label>
          <select id="cust-size"></select>
        </div>
        <div class="form-group">
          <label>Design Placement Side</label>
          <select id="cust-side" onchange="updateMockup()">
            <option value="FRONT">Design Front / Logo Back</option>
            <option value="BACK">Logo Front / Design Back</option>
          </select>
        </div>
        <div class="form-group">
          <label>Design Print Size</label>
          <select id="cust-print-size" onchange="updateMockup()">
            <option value="20">20 × 20 CM</option>
            <option value="30">30 × 30 CM</option>
          </select>
        </div>

        <button class="btn-add-cart" onclick="submitAddToCart()">ADD TO CART</button>
        <button class="nav-btn" onclick="closeCustomizer()" style="margin-top: 0.5rem;">CLOSE</button>
      </div>
    </div>
  </div>

  <!-- Cart Drawer & Checkout -->
  <div class="cart-drawer" id="cart-drawer">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="font-family: var(--font-display);">CART</h2>
      <button class="nav-btn" onclick="toggleCart()">✕</button>
    </div>
    <div class="cart-items-list" id="cart-items-container"></div>
    <div style="border-top:1px solid var(--border); padding-top:1rem;">
      <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
        <span>Subtotal</span>
        <span id="cart-subtotal">0 EGP</span>
      </div>
      <div class="form-group" style="margin-bottom:0.5rem;">
        <label>Phone Number (Required for COD)</label>
        <input type="text" id="checkout-phone" placeholder="01xxxxxxxxx">
      </div>
      <div class="form-group" style="margin-bottom:1rem;">
        <label>Delivery Governorate</label>
        <select id="checkout-zone"></select>
      </div>
      <button class="btn-checkout" onclick="submitCodOrder()">PLACE COD ORDER</button>
    </div>
  </div>

  <div class="toast" id="system-toast"></div>

  <script>
    const API_BASE_URL = "https://script.google.com/macros/s/AKfycbzEenC4vaWKhCag_hIpMcNLstegN4WoWG8VWlwSz697LKa3XPLxbzZKjIPHIKznjP1W/exec";
    const GOOGLE_CLIENT_ID = "CONFIG_PLACEHOLDER_GOOGLE_CLIENT_ID.apps.googleusercontent.com";

    let state = {
      sessionToken: localStorage.getItem("tmp_session_token") || null,
      customer: null,
      catalog: null,
      deliveryZones: [],
      activeProduct: null,
      cart: null
    };

    window.onload = function() {
      initGoogleAuth();
      loadCatalog();
      loadDeliveryZones();
      if (state.sessionToken) {
        refreshCart();
      }
    };

    function initGoogleAuth() {
      if (window.google) {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleGoogleAuthResponse
        });
        if (!state.sessionToken) {
          google.accounts.id.renderButton(
            document.getElementById("google-login-container"),
            { theme: "filled_black", size: "medium", shape: "rectangular" }
          );
        }
      }
    }

    function handleGoogleAuthResponse(res) {
      postApi("customerGoogleAuth", { idToken: res.credential }, (data) => {
        if (data.ok) {
          state.sessionToken = data.data.rawSessionToken;
          state.customer = data.data;
          localStorage.setItem("tmp_session_token", state.sessionToken);
          document.getElementById("google-login-container").style.display = "none";
          document.getElementById("btn-account").style.display = "block";
          showToast("Authenticated as " + data.data.fullName);
          refreshCart();
        } else {
          showToast(data.message || "Auth Failed");
        }
      });
    }

    function loadCatalog() {
      const script = document.createElement("script");
      script.src = API_BASE_URL + "?action=catalog&callback=onCatalogLoaded";
      document.body.appendChild(script);
    }

    window.onCatalogLoaded = function(res) {
      if (res.ok) {
        state.catalog = res.data;
        renderCatalog();
      }
    };

    function loadDeliveryZones() {
      const script = document.createElement("script");
      script.src = API_BASE_URL + "?action=deliveryzones&callback=onDeliveryZonesLoaded";
      document.body.appendChild(script);
    }

    window.onDeliveryZonesLoaded = function(res) {
      if (res.ok) {
        state.deliveryZones = res.data;
        const sel = document.getElementById("checkout-zone");
        sel.innerHTML = "";
        state.deliveryZones.forEach(z => {
          sel.innerHTML += `<option value="${z.zoneId}">${z.governorate} — ${z.deliveryFee} EGP</option>`;
        });
      }
    };

    function renderCatalog() {
      const container = document.getElementById("catalog-container");
      container.innerHTML = "";
      state.catalog.products.forEach(p => {
        const thumb = p.assets.length > 0 ? p.assets[0].assetUrl : "";
        const card = document.createElement("div");
        card.className = "product-card";
        card.onclick = () => openCustomizer(p.productId);
        card.innerHTML = `
          <img class="product-thumb" src="${thumb}" alt="${p.productName}">
          <div class="product-meta">
            <div class="product-name">${p.productName}</div>
            <div class="product-price">${p.price} ${p.currency}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openCustomizer(productId) {
      state.activeProduct = state.catalog.products.find(p => p.productId === productId);
      const modal = document.getElementById("customizer-modal");
      document.getElementById("modal-product-name").innerText = state.activeProduct.productName;
      document.getElementById("modal-product-price").innerText = `${state.activeProduct.price} ${state.activeProduct.currency}`;

      const dSelect = document.getElementById("cust-design");
      dSelect.innerHTML = "";
      state.catalog.designs.forEach(d => {
        dSelect.innerHTML += `<option value="${d.designId}">${d.designName}</option>`;
      });

      const cSelect = document.getElementById("cust-color");
      cSelect.innerHTML = "";
      state.activeProduct.colors.forEach(c => {
        cSelect.innerHTML += `<option value="${c}">${c}</option>`;
      });

      const sSelect = document.getElementById("cust-size");
      sSelect.innerHTML = "";
      state.activeProduct.sizes.forEach(s => {
        sSelect.innerHTML += `<option value="${s}">${s}</option>`;
      });

      modal.style.display = "flex";
      updateMockupColor();
    }

    function closeCustomizer() {
      document.getElementById("customizer-modal").style.display = "none";
    }

    function updateMockupColor() {
      const color = document.getElementById("cust-color").value;
      const asset = state.activeProduct.assets.find(a => a.color.toLowerCase() === color.toLowerCase()) || state.activeProduct.assets[0];
      if (asset) {
        document.getElementById("canvas-garment").src = asset.assetUrl;
      }
      updateMockup();
    }

    function updateMockup() {
      const designId = document.getElementById("cust-design").value;
      const side = document.getElementById("cust-side").value;
      const printSize = parseInt(document.getElementById("cust-print-size").value, 10);

      const dPlacement = state.catalog.placements.find(p => 
        p.productId === state.activeProduct.productId &&
        p.artworkType === "DESIGN" &&
        p.side === side &&
        p.printSize === printSize
      );

      const designObj = state.catalog.designs.find(d => d.designId === designId);
      const artAsset = designObj && designObj.assets ? designObj.assets[0] : null;

      const artEl = document.getElementById("canvas-artwork");
      if (artAsset && dPlacement) {
        artEl.src = artAsset.assetUrl;
        artEl.style.width = dPlacement.width + "%";
        artEl.style.top = dPlacement.top + "%";
        artEl.style.left = dPlacement.left + "%";
        artEl.style.transform = `rotate(${dPlacement.rotation}deg)`;
        artEl.style.opacity = dPlacement.opacity;
        artEl.style.display = "block";
      } else {
        artEl.style.display = "none";
      }

      const logoSide = side === "FRONT" ? "BACK" : "FRONT";
      const lPlacement = state.catalog.placements.find(p => 
        p.productId === state.activeProduct.productId &&
        p.artworkType === "LOGO" &&
        p.side === logoSide
      );
      const logoEl = document.getElementById("canvas-logo");
      const logoAsset = state.catalog.logoAssets ? state.catalog.logoAssets[0] : null;

      if (logoAsset && lPlacement) {
        logoEl.src = logoAsset.assetUrl;
        logoEl.style.width = lPlacement.width + "%";
        logoEl.style.top = lPlacement.top + "%";
        logoEl.style.left = lPlacement.left + "%";
        logoEl.style.transform = `rotate(${lPlacement.rotation}deg)`;
        logoEl.style.opacity = lPlacement.opacity;
        logoEl.style.display = "block";
      } else {
        logoEl.style.display = "none";
      }
    }

    function submitAddToCart() {
      if (!state.sessionToken) {
        showToast("Please authenticate with Google to access cart.");
        return;
      }

      const itemPayload = {
        productId: state.activeProduct.productId,
        designId: document.getElementById("cust-design").value,
        color: document.getElementById("cust-color").value,
        size: document.getElementById("cust-size").value,
        side: document.getElementById("cust-side").value,
        printSize: document.getElementById("cust-print-size").value,
        quantity: 1,
        mockupPreviewUrl: document.getElementById("canvas-garment").src
      };

      postApi("addCartItem", { sessionToken: state.sessionToken, item: itemPayload }, (res) => {
        if (res.ok) {
          showToast("Added to Cart");
          closeCustomizer();
          document.getElementById("cart-count").innerText = res.data.itemCount;
          state.cart = res.data;
        } else {
          showToast(res.message || "Failed to add");
        }
      });
    }

    function toggleCart() {
      const drawer = document.getElementById("cart-drawer");
      drawer.classList.toggle("open");
      if (drawer.classList.contains("open") && state.sessionToken) {
        refreshCart();
      }
    }

    function refreshCart() {
      postApi("getCart", { sessionToken: state.sessionToken }, (res) => {
        if (res.ok) {
          state.cart = res.data;
          document.getElementById("cart-count").innerText = res.data.itemCount;
          document.getElementById("cart-subtotal").innerText = `${res.data.subtotal} ${res.data.currency}`;
          const container = document.getElementById("cart-items-container");
          container.innerHTML = "";
          res.data.items.forEach(it => {
            container.innerHTML += `
              <div class="cart-item-row">
                <div>
                  <div style="font-weight:600;">${it.productName}</div>
                  <div style="font-size:0.8rem; color:var(--text-muted);">${it.designName} · ${it.color} · ${it.size}</div>
                  <div style="font-size:0.85rem; margin-top:0.2rem;">Qty: ${it.quantity} × ${it.unitPrice} EGP</div>
                </div>
                <button class="nav-btn" style="padding:0.2rem 0.6rem; height:fit-content;" onclick="removeCartItem('${it.cartItemId}')">✕</button>
              </div>
            `;
          });
        }
      });
    }

    function removeCartItem(cartItemId) {
      postApi("removeCartItem", { sessionToken: state.sessionToken, cartItemId: cartItemId }, (res) => {
        if (res.ok) {
          refreshCart();
        }
      });
    }

    function submitCodOrder() {
      if (!state.sessionToken) return showToast("Login Required");
      const phone = document.getElementById("checkout-phone").value;
      const zoneId = document.getElementById("checkout-zone").value;

      if (!phone || phone.trim().length < 8) {
        return showToast("Valid phone number required for delivery verification.");
      }

      postApi("createCodOrder", {
        sessionToken: state.sessionToken,
        checkout: { phone: phone, zoneId: zoneId }
      }, (res) => {
        if (res.ok) {
          showToast(`Order Placed: #${res.data.orderNumber}`);
          toggleCart();
          refreshCart();
        } else {
          showToast(res.message || "Order Creation Failed");
        }
      });
    }

    function postApi(action, data, callback) {
      data.action = action;
      fetch(API_BASE_URL, {
        method: "POST",
        mode: "cors",
        body: JSON.stringify(data)
      })
      .then(r => r.json())
      .then(callback)
      .catch(err => {
        console.error(err);
        showToast("Network Error");
      });
    }

    function showToast(msg) {
      const t = document.getElementById("system-toast");
      t.innerText = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 3500);
    }
  </script>
</body>
</html>
