<style>

.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font:8px "Courier New";letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 12px;border-radius:9px;outline:0}.field textarea{min-height:90px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--text)}.checkout-grid{display:grid;grid-template-columns:1fr .8fr;gap:24px}.summary{background:var(--surface);border:1px solid var(--line);padding:18px;height:max-content}.summary-row{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid var(--line);font-size:11px}.summary-row:last-child{border-bottom:0}.notice{padding:12px 14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:10px;line-height:1.6}.loading{display:grid;place-items:center;min-height:240px;color:var(--muted)}.spinner{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:1000;background:var(--text);color:var(--bg);padding:12px 17px;border-radius:999px;font-size:10px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.footer{border-top:1px solid var(--line);max-width:var(--max);margin:auto;padding:50px 22px 80px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px;color:var(--muted)}.footer-brand{font-size:34px;color:var(--text);margin-bottom:8px}.footer-col{display:grid;gap:10px;align-content:start}.footer-col b{color:var(--text);font-size:9px}.footer-col button,.footer-col a{text-align:left;background:none;border:0;padding:0;color:var(--muted);font-size:10px}.footer-col button:hover,.footer-col a:hover{color:var(--text)}
[dir=rtl] .main-nav{direction:rtl}[dir=rtl] .footer-col button,[dir=rtl] .footer-col a{text-align:right}[dir=rtl] .legal-body{font-family:Arial,Tahoma,sans-serif}[dir=rtl] .legal-body ul,[dir=rtl] .legal-body ol{padding-left:0;padding-right:25px}
@media(max-width:900px){.main-nav{display:none}.hero,.product-page,.checkout-grid{grid-template-columns:1fr}.hero-art{min-height:360px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.section-head{display:block}.section-copy{margin-top:15px}.footer{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.header-inner{height:64px;padding:0 14px}.brand{font-size:23px}.header-actions{gap:2px}.header-btn{padding:8px}.theme-inner{padding:6px 14px}.page{padding:35px 14px}.hero{min-height:auto;padding-top:25px}.hero-title{font-size:65px}.hero-art{min-height:280px}.product-grid{grid-template-columns:1fr 1fr;gap:8px}.product-body{padding:11px}.product-name{font-size:13px}.product-actions{display:grid}.product-actions .btn{min-height:40px}.product-info{padding:20px}.modal-wrap,.drawer-wrap{padding:0}.modal{max-height:100dvh;height:100dvh;border:0;border-radius:0}.drawer{width:100%;padding:16px}.info-grid{grid-template-columns:1fr}.footer{grid-template-columns:1fr;padding:35px 14px 60px}.nav-btn{font-size:9px}.legal-body{font-size:13px}.legal h1{font-size:52px}}
</style>

<body class="theme-main">
<iframe id="bridge" title="TEMPORARY secure bridge" style="position:fixed;width:0;height:0;border:0;visibility:hidden"></iframe>

<header class="app-header">
  <div class="header-inner">
    <a class="brand" href="#/" data-route="/">TEMPORARY<sup>™</sup></a>
    <nav class="main-nav">
      <button class="nav-btn" data-route="/collection" data-i18n="navShop">Shop</button>
      <button class="nav-btn" data-route="/rule" data-i18n="navRule">The Rule</button>
      <button class="nav-btn" data-route="/archive" data-i18n="navArchive">Archive</button>
      <button class="nav-btn" data-route="/about" data-i18n="navAbout">About</button>
    </nav>
    <div class="header-actions">
      <button class="lang" id="langBtn" type="button">AR</button>
      <button class="header-btn bag" id="bagBtn" type="button" data-i18n="bag">Bag <span class="badge" id="bagCount">0</span></button>
      <button class="header-btn" id="accountBtn" type="button" data-i18n="account">Account</button>
    </div>
  </div>
</header>
<div class="theme-strip"><div class="theme-inner" id="themeStrip"></div></div>

<main id="appMain"><div class="loading"><div class="spinner"></div></div></main>

<footer class="footer">
  <div><div class="footer-brand display">TEMPORARY™</div><div data-i18n="footerLine">Designed in Cairo. Built to disappear.</div></div>
  <div class="footer-col"><b data-i18n="footerCustomer">Customer</b><button data-route="/collection" data-i18n="navShop">Shop</button><button data-route="/archive" data-i18n="navArchive">Archive</button><button id="footerAccount" data-i18n="account">Account</button></div>
  <div class="footer-col"><b data-i18n="footerSystem">Information</b><button data-route="/about" data-i18n="navAbout">About</button><button data-route="/policy" data-i18n="navPolicy">Returns & Exchange</button><button data-route="/shipping" data-i18n="navShipping">Shipping</button><button data-route="/privacy" data-i18n="navPrivacy">Privacy</button></div>
</footer>

<div class="modal-wrap" id="productModal"><div class="modal"><div class="modal-head"><div><div class="mono" id="modalKicker">PRODUCT</div><h2 class="display" id="modalTitle" style="font-size:38px;margin:7px 0 0"></h2></div><button class="close" data-close="productModal" aria-label="Close">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
<div class="modal-wrap" id="infoModal"><div class="modal"><div class="modal-head"><div><div class="mono" id="infoKicker">INFORMATION</div><h2 class="display" id="infoTitle" style="font-size:38px;margin:7px 0 0"></h2></div><button class="close" data-close="infoModal" aria-label="Close">×</button></div><div class="modal-body legal-body" id="infoBody"></div></div></div>
<div class="drawer-wrap" id="cartDrawer"><aside class="drawer"><div class="drawer-head"><div><div class="mono" data-i18n="bag">BAG</div><h2 class="display" style="font-size:42px;margin:7px 0 0" data-i18n="bagTitle">Selected pieces.</h2></div><button class="close" data-close="cartDrawer" aria-label="Close">×</button></div><div class="drawer-body" id="cartBody"></div></aside></div>
<div class="modal-wrap" id="checkoutModal"><div class="modal"><div class="modal-head"><div><div class="mono" data-i18n="checkoutTitle">CHECKOUT</div><h2 class="display" style="font-size:42px;margin:7px 0 0" data-i18n="cod">Cash on delivery.</h2></div><button class="close" data-close="checkoutModal" aria-label="Close">×</button></div><div class="modal-body" id="checkoutBody"></div></div></div>
<div class="modal-wrap" id="accountModal"><div class="modal"><div class="modal-head"><div><div class="mono" data-i18n="account">ACCOUNT</div><h2 class="display" style="font-size:42px;margin:7px 0 0" data-i18n="accountTitle">Your archive.</h2></div><button class="close" data-close="accountModal" aria-label="Close">×</button></div><div class="modal-body" id="accountBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const CONFIG=Object.freeze({
  API:'https://script.google.com/macros/s/AKfycbx5InYO32kfhcCo34eMe8AfCK3mZhaSsJABXL0dElh_kZT-dZKICpMxhXSUmWL9jsAiK/exec',
  GOOGLE_CLIENT_ID:'32171492706-n6rli6equ2e0es8ac15npdcrhctlq2bn.apps.googleusercontent.com',
  SESSION:'temporary_v1_customer_session',
  DEVICE:'temporary_v1_device',
  LANG:'temporary_v1_lang'
});
/* Keep the production API URL explicit and correct. */
CONFIG.API='https://script.google.com/macros/s/AKfycbx5InYO32kfhcCo34eMe8AfCK3mZhaSsJABXL0dElh_kZT-dZKICpMxhXSUmWL9jsAiK/exec';

const state={catalog:null,lang:localStorage.getItem(CONFIG.LANG)||'en',route:'/',product:null,filter:'all',cart:null,session:localStorage.getItem(CONFIG.SESSION)||'',device:localStorage.getItem(CONFIG.DEVICE)||('d_'+cryptoRandom()),bridgeReady:false,bridgeTarget:null,bridgeOrigin:'',pending:new Map(),queue:[],themes:[],activeTheme:'main',busy:false};

function cryptoRandom(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
localStorage.setItem(CONFIG.DEVICE,state.device);
const $=(s,c=document)=>c.querySelector(s), $$=(s,c=document)=>Array.from(c.querySelectorAll(s));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(v,curr)=>`${curr||'EGP'} ${Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
function t(k){const d=state.lang==='ar'?(state.catalog?.runtimeConfig?.contentAr||{}):(state.catalog?.runtimeConfig?.contentEn||{});return d[k]??k}
function arName(map,id,fallback){return state.lang==='ar'?(map?.[id]||fallback):fallback}
function setLang(lang){state.lang=lang==='ar'?'ar':'en';localStorage.setItem(CONFIG.LANG,state.lang);document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';$('#langBtn').textContent=state.lang==='ar'?'EN':'AR';applyI18n();renderRoute()}
function applyI18n(){$$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n))}
function applyTheme(id){state.activeTheme=id||'main';document.body.className='theme-'+state.activeTheme;$$('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.theme===state.activeTheme))}
function renderThemes(){const themes=(state.catalog?.runtimeConfig?.themes||[]).filter(x=>x.enabled!==false);state.themes=themes;$('#themeStrip').innerHTML=themes.map(x=>`<button class="theme-btn" data-theme="${esc(x.id)}">${esc(state.lang==='ar'?(x.nameAr||x.name):x.name)}</button>`).join('');applyTheme(state.catalog?.runtimeConfig?.activeTheme||themes[0]?.id||'main')}
function closeLayer(id){const e=$('#'+id);if(e)e.classList.remove('open')}
function openLayer(id){const e=$('#'+id);if(e){e.classList.add('open');document.body.style.overflow='hidden'}}
function closeAllLayers(){['productModal','infoModal','cartDrawer','checkoutModal','accountModal'].forEach(closeLayer);document.body.style.overflow=''}
function markdown(s){
  let x=esc(String(s||''));
  x=x.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');
  x=x.replace(/^\-\s+(.+)$/gm,'<li>$1</li>').replace(/^\d+\.\s+(.+)$/gm,'<li>$1</li>');
  x=x.replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>');
  x=x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n{2,}/g,'<p></p>').replace(/\n/g,'<br>');
  return x;
}
function assetFor(product,color){
  const assets=(product?.assets||[]).filter(a=>String(a.color||'').toLowerCase()===String(color||'').toLowerCase());
  return assets[0]?.assetUrl||product?.assets?.[0]?.assetUrl||'';
}
function collectionAsset(product){
  const placements=state.catalog?.collectionMockupPlacements||[];
  const wanted=product.colors?.[0]||'';
  const exact=placements.find(x=>String(x.productId)===String(product.productId)&&String(x.color||'').toLowerCase()===String(wanted).toLowerCase()&&String(x.themeId||'')===String(state.activeTheme));
  const generic=placements.find(x=>String(x.productId)===String(product.productId)&&!String(x.color||'').trim()&&String(x.themeId||'')===String(state.activeTheme));
  return exact||generic||placements.find(x=>String(x.productId)===String(product.productId)&&String(x.color||'').toLowerCase()===String(wanted).toLowerCase())||null;
}
function collectionImage(product){
  const p=collectionAsset(product);
  if(p?.assetUrl)return p.assetUrl;
  return assetFor(product,product.colors?.[0]);
}
function productName(p){return arName(state.catalog?.runtimeConfig?.productNamesAr,p.productId,p.productName)}
function designName(d){return arName(state.catalog?.runtimeConfig?.designNamesAr,d.designId,d.designName)}
function routePath(){return location.hash.replace(/^#/,'')||'/'}
function navigate(path){if(location.hash==='#'+path){renderRoute()}else location.hash=path}
function renderHome(){
 return `<section class="page hero"><div class="hero-copy"><div class="eyebrow mono">${esc(t('heroEyebrow'))}</div><h1 class="hero-title display">${esc(t('heroTitle'))}</h1><p class="hero-text">${esc(t('heroBody'))}</p><div class="actions"><button class="btn primary" data-route="/collection">${esc(t('heroCta'))}<span>→</span></button><button class="btn" data-route="/rule">${esc(t('navRule'))}</button></div></div><div class="hero-art"><div class="hero-mark">T.</div></div></section>`;
}
function renderCollection(){
 const products=state.catalog?.products||[];
 const cats=['all',...new Set(products.map(p=>p.category).filter(Boolean))];
 const filtered=state.filter==='all'?products:products.filter(p=>String(p.category).toLowerCase()===String(state.filter).toLowerCase());
 return `<section class="page"><div class="section-head"><div><div class="eyebrow mono">${esc(t('collectionEyebrow'))}</div><h1 class="section-title display">${esc(t('collectionTitle'))}</h1></div><div class="section-copy">${esc(t('collectionBody'))}</div></div><div class="filters">${cats.map(c=>`<button class="filter ${state.filter===c?'active':''}" data-filter="${esc(c)}">${esc(c==='all'?t('all'):c)}</button>`).join('')}</div><div class="product-grid">${filtered.map(renderProductCard).join('')}</div></section>`;
}
function renderProductCard(p){
 const img=collectionImage(p);
 return `<article class="product-card"><div class="product-media">${img?`<img src="${esc(img)}" loading="lazy" alt="${esc(productName(p))}">`:`<div class="no-image">${esc(t('noImage'))}</div>`}</div><div class="product-body"><div class="product-name">${esc(productName(p))}</div><div class="product-meta">${esc(p.category||p.productType||'')} · ${esc(p.fit||'')}</div><div class="product-price">${money(p.price,p.currency||state.catalog.currency)}</div><div class="product-actions"><button class="btn primary" data-product="${esc(p.productId)}">${esc(t('viewProduct'))}</button><button class="btn" data-info-product="${esc(p.productId)}">${esc(t('details'))}</button></div></div></article>`;
}
function renderProduct(p){
 const designs=state.catalog?.designs||[]; const img=assetFor(p,p.colors?.[0]); const selectedColor=state.product?.color||p.colors?.[0]||''; const selectedSize=state.product?.size||p.sizes?.[0]||''; const selectedDesign=state.product?.design||designs[0]?.designId||''; const qty=state.product?.qty||1;
 return `<section class="page"><div class="actions" style="margin-top:0;margin-bottom:20px"><button class="btn" data-route="/collection">← ${esc(t('backCollection'))}</button></div><div class="product-page"><div class="product-stage"><img id="productImage" src="${esc(assetFor(p,selectedColor)||img)}" alt="${esc(productName(p))}"></div><div class="product-info"><div class="mono">${esc(p.productCode||'PRODUCT')}</div><h1 class="display">${esc(productName(p))}</h1><div class="price">${money(p.price,p.currency||state.catalog.currency)}</div><div class="choice"><div class="choice-label">${esc(t('chooseColor'))}</div><div class="choice-list">${(p.colors||[]).map(c=>`<button class="choice-btn swatch ${c===selectedColor?'active':''}" title="${esc(c)}" data-color="${esc(c)}" style="background:${colorHex(c)}"></button>`).join('')}</div></div><div class="choice"><div class="choice-label">${esc(t('chooseSize'))}</div><div class="choice-list">${(p.sizes||[]).map(s=>`<button class="choice-btn ${s===selectedSize?'active':''}" data-size="${esc(s)}">${esc(s)}</button>`).join('')}</div></div><div class="choice"><div class="choice-label">${esc(t('chooseDesign'))}</div><div class="choice-list">${designs.map(d=>`<button class="choice-btn ${d.designId===selectedDesign?'active':''}" data-design="${esc(d.designId)}">${esc(designName(d))}</button>`).join('')}</div></div><div class="choice"><div class="choice-label">${esc(t('quantity'))}</div><div class="qty"><button data-qty="-1">−</button><input id="qtyInput" value="${qty}" inputmode="numeric"><button data-qty="1">+</button></div></div><div class="actions"><button class="btn primary" data-add="${esc(p.productId)}">${esc(t('addToBag'))}<span>→</span></button><button class="btn" data-sizechart="${esc(p.productId)}">${esc(t('sizeChart'))}</button><button class="btn" data-details="${esc(p.productId)}">${esc(t('details'))}</button></div><div class="info-grid"><div class="info-item"><span>${esc(t('materials'))}</span><strong>${esc(p.material||'—')}</strong></div><div class="info-item"><span>${esc(t('fit'))}</span><strong>${esc(p.fit||'—')}</strong></div></div></div></div></section>`;
}
function colorHex(c){const s=String(c||'').toLowerCase();const map={black:'#131313',white:'#fff','hunter green':'#223f31',burgundy:'#5e1c21',pink:'#e7a4b8',red:'#a32929',green:'#2d5c3f',blue:'#315f87',cream:'#eee1c7',beige:'#c9b18d'};return map[s]||'#888'}
function renderRule(){return `<section class="page legal"><div class="eyebrow mono">${esc(t('ruleEyebrow'))}</div><h1 class="display">${esc(t('ruleTitle'))}</h1><p class="lead">${esc(t('ruleBody'))}</p><div class="info-grid"><div class="info-item"><span>01</span><strong>${esc(t('m1'))}</strong></div><div class="info-item"><span>02</span><strong>${esc(t('m2'))}</strong></div><div class="info-item"><span>03</span><strong>${esc(t('m3'))}</strong></div><div class="info-item"><span>04</span><strong>${esc(t('m4'))}</strong></div></div></section>`}
function renderArchive(){return `<section class="page legal"><div class="eyebrow mono">${esc(t('archive'))}</div><h1 class="display">${esc(t('archiveTitle'))}</h1><p class="lead">${esc(t('archiveBody'))}</p><div id="archiveData" class="notice" style="margin-top:25px">${esc(t('signInOrders'))}</div><div class="actions"><button class="btn primary" id="archiveLogin">${esc(state.session?t('orders'):t('signIn'))}</button></div></section>`}
function renderAbout(){return legalPage('aboutTitle','aboutBody',t('navAbout'))}
function legalPage(titleKey,bodyKey,kicker){return `<section class="page legal"><div class="eyebrow mono">${esc(kicker)}</div><h1 class="display">${esc(t(titleKey))}</h1><div class="legal-body">${markdown(t(bodyKey))}</div></section>`}
function renderRoute(){
 closeAllLayers(); state.route=routePath(); const p=$('#appMain'); let html='';
 if(state.route==='/')html=renderHome();
 else if(state.route==='/collection')html=renderCollection();
 else if(state.route==='/rule')html=renderRule();
 else if(state.route==='/archive')html=renderArchive();
 else if(state.route==='/about')html=renderAbout();
 else if(state.route==='/policy')html=legalPage('policyTitle','policyBody',t('navPolicy'));
 else if(state.route==='/shipping')html=legalPage('shippingTitle','shippingBody',t('navShipping'));
 else if(state.route==='/privacy')html=legalPage('privacyTitle','privacyBody',t('navPrivacy'));
 else if(state.route.startsWith('/product/')){const id=decodeURIComponent(state.route.split('/').pop());const prod=state.catalog.products.find(x=>x.productId===id);html=prod?renderProduct(prod):renderCollection()}
 else html=renderHome();
 p.innerHTML=html;applyI18n();$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.route===state.route));if(state.route==='/archive')loadArchive();
}
function openProduct(id){const p=state.catalog.products.find(x=>String(x.productId)===String(id));if(!p)return;state.product={productId:p.productId,color:p.colors?.[0]||'',size:p.sizes?.[0]||'',design:state.catalog.designs?.[0]?.designId||'',qty:1};navigate('/product/'+encodeURIComponent(p.productId))}
function openProductInfo(id){const p=state.catalog.products.find(x=>String(x.productId)===String(id));if(!p)return;$('#infoKicker').textContent=t('details');$('#infoTitle').textContent=productName(p);$('#infoBody').innerHTML=`<div class="info-grid"><div class="info-item"><span>${esc(t('materials'))}</span><strong>${esc(p.material||'—')}</strong></div><div class="info-item"><span>${esc(t('fit'))}</span><strong>${esc(p.fit||'—')}</strong></div><div class="info-item"><span>${esc(t('available'))}</span><strong>${esc((p.colors||[]).join(', ')||'—')}</strong></div><div class="info-item"><span>${esc(t('price'))}</span><strong>${money(p.price,p.currency||state.catalog.currency)}</strong></div></div><p style="color:var(--muted);line-height:1.7">${esc(p.description||'')}</p>`;openLayer('infoModal')}
function openSizeChart(id){const p=state.catalog.products.find(x=>String(x.productId)===String(id));if(!p)return;$('#infoKicker').textContent=t('sizeChart');$('#infoTitle').textContent=productName(p);$('#infoBody').innerHTML=p.sizeGuide?.length?`<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;min-width:520px"><thead><tr>${[t('size'),t('width'),t('length'),t('weight')].map(x=>`<th style="text-align:left;padding:12px;border-bottom:1px solid var(--line);font:8px 'Courier New';color:var(--muted)">${esc(x)}</th>`).join('')}</tr></thead><tbody>${p.sizeGuide.map(s=>`<tr><td style="padding:12px;border-bottom:1px solid var(--line)">${esc(s.sizeLabel)}</td><td style="padding:12px;border-bottom:1px solid var(--line)">${s.widthCm||'—'} cm</td><td style="padding:12px;border-bottom:1px solid var(--line)">${s.lengthCm||'—'} cm</td><td style="padding:12px;border-bottom:1px solid var(--line)">${s.avgWeightMinKg||'—'}–${s.avgWeightMaxKg||'—'} kg</td></tr>`).join('')}</tbody></table></div>`:`<div class="notice">${esc(t('noSizes'))}</div>`;openLayer('infoModal')}
function updateProductState(part){if(!state.product)return;Object.assign(state.product,part);renderRoute()}
async function addCurrentToCart(){if(!state.session){openAccount();return}const p=state.catalog.products.find(x=>x.productId===state.product.productId);if(!p)return;try{state.busy=true;await api('cart',{operation:'ADD',item:{productId:p.productId,designId:state.product.design,size:state.product.size,color:state.product.color,quantity:state.product.qty}});toast(t('added'));await refreshCart();}catch(e){toast(e.message||t('error'))}finally{state.busy=false}}
async function refreshCart(){if(!state.session){state.cart={items:[],subtotal:0};updateBag();return}try{state.cart=await api('cart',{operation:'GET'});updateBag()}catch(e){console.warn(e)}}
function updateBag(){const items=state.cart?.items||[];$('#bagCount').textContent=items.reduce((n,x)=>n+Number(x.quantity||0),0)}
function openCart(){openLayer('cartDrawer');renderCart()}
function renderCart(){const b=$('#cartBody'),items=state.cart?.items||[];b.innerHTML=items.length?`${items.map(i=>`<div class="cart-row"><img src="${esc(i.assetUrl||'')}" alt=""><div><strong>${esc(i.productName||i.productId||'')}</strong><small>${esc(i.size||'')} · ${esc(i.color||'')} · ×${Number(i.quantity||0)}</small><button class="btn danger" style="margin-top:8px" data-remove="${esc(i.cartItemId)}">${esc(t('remove'))}</button></div><strong>${money(i.lineTotal,state.catalog.currency)}</strong></div>`).join('')}<div class="cart-total"><span>${esc(t('subtotal'))}</span><strong>${money(state.cart?.subtotal,state.catalog.currency)}</strong></div><button class="btn primary" style="width:100%" id="checkoutBtn">${esc(t('checkout'))} →</button><button class="btn" style="width:100%;margin-top:7px" data-route="/collection">${esc(t('continue'))}</button>`:`<div class="empty">${esc(t('emptyBag'))}<div class="actions" style="justify-content:center"><button class="btn primary" data-route="/collection">${esc(t('continue'))}</button></div></div>`}
function openAccount(){openLayer('accountModal');renderAccount()}
function renderAccount(){const b=$('#accountBody');if(!state.session){b.innerHTML=`<div class="notice">${esc(t('signIn'))}</div><div id="googleSignIn" style="margin-top:18px"></div>`;loadGoogleButton();return}b.innerHTML=`<div class="notice">${esc(t('accountReady'))}</div><div id="accountOrders" style="margin-top:15px"></div><div class="actions"><button class="btn danger" id="logout">${esc(t('signOut'))}</button></div>`;loadOrdersForAccount()}
function loadGoogleButton(){if(!window.google?.accounts?.id){setTimeout(loadGoogleButton,250);return}google.accounts.id.initialize({client_id:CONFIG.GOOGLE_CLIENT_ID,callback:handleGoogle});google.accounts.id.renderButton($('#googleSignIn'),{theme:'outline',size:'large',width:280,text:'signin_with'})}
async function handleGoogle(resp){try{toast(t('loading'));const r=await api('googleauth',{credential:resp.credential,deviceId:state.device});state.session=r.sessionToken||r.session?.token||r.token||'';if(state.session)localStorage.setItem(CONFIG.SESSION,state.session);await refreshCart();closeAllLayers();toast(t('authReady'));if(state.route==='/archive')renderRoute()}catch(e){toast(e.message||t('error'))}}
async function loadOrdersForAccount(){try{const r=await api('orders',{});const items=r.orders||r.items||[];$('#accountOrders').innerHTML=items.length?items.map(o=>`<div class="notice" style="margin-bottom:8px"><strong>${esc(o.orderNumber||o.orderId)}</strong><br>${esc(o.status||o.orderStatus||'')} · ${money(o.total,state.catalog.currency)}</div>`).join(''):`<div class="empty">${esc(t('noOrders'))}</div>`}catch(e){$('#accountOrders').innerHTML=`<div class="notice">${esc(t('error'))}</div>`}}
async function loadArchive(){const e=$('#archiveData');if(!state.session)return;try{const r=await api('orders',{});const items=r.orders||r.items||[];e.innerHTML=items.length?items.map(o=>`<div class="notice" style="margin-bottom:8px"><strong>${esc(o.orderNumber||o.orderId)}</strong> · ${esc(o.status||o.orderStatus||'')}</div>`).join(''):`<div class="empty">${esc(t('noOrders'))}</div>`}catch(_){}}
function openCheckout(){if(!state.session){openAccount();return}openLayer('checkoutModal');renderCheckout()}
function renderCheckout(){const b=$('#checkoutBody');b.innerHTML=`<div class="checkout-grid"><form class="form" id="checkoutForm"><div class="field"><label>${esc(t('name'))}</label><input id="coName" required></div><div class="field"><label>${esc(t('email'))}</label><input id="coEmail" type="email" required></div><div class="field"><label>${esc(t('phone'))}</label><input id="coPhone" required></div><div class="field"><label>${esc(t('birthday'))}</label><input id="coDob" type="date"></div><div class="field"><label>${esc(t('governorate'))}</label><input id="coGov" required></div><div class="field"><label>${esc(t('area'))}</label><input id="coArea" required></div><div class="field"><label>${esc(t('address'))}</label><textarea id="coAddress" required></textarea></div><label style="font-size:10px;color:var(--muted)"><input id="coConfirm" type="checkbox"> ${esc(t('confirm'))}</label><div id="checkoutError" style="color:var(--danger);min-height:20px;font-size:10px"></div><button class="btn primary" id="placeOrder" type="submit">${esc(t('placeOrder'))} →</button></form><div class="summary"><div class="mono">${esc(t('orderSummary'))}</div>${(state.cart?.items||[]).map(i=>`<div class="summary-row"><span>${esc(i.productName||i.productId)} × ${Number(i.quantity||0)}</span><strong>${money(i.lineTotal,state.catalog.currency)}</strong></div>`).join('')}<div class="summary-row"><span>${esc(t('subtotal'))}</span><strong>${money(state.cart?.subtotal,state.catalog.currency)}</strong></div></div></div>`;$('#checkoutForm').addEventListener('submit',submitOrder)}
async function submitOrder(e){e.preventDefault();const btn=$('#placeOrder');if(btn.disabled)return;if(!$('#coConfirm').checked){$('#checkoutError').textContent=t('confirm');return}btn.disabled=true;btn.textContent=t('processing');try{const r=await api('createorder',{name:$('#coName').value,email:$('#coEmail').value,phone:$('#coPhone').value,dateOfBirth:$('#coDob').value,governorate:$('#coGov').value,area:$('#coArea').value,address:$('#coAddress').value,paymentMethod:'COD'});closeAllLayers();toast(t('successTitle'));await refreshCart();navigate('/archive')}catch(err){$('#checkoutError').textContent=err.message||t('error');btn.disabled=false;btn.textContent=t('placeOrder')}}
async function removeCartItem(id){try{await api('cart',{operation:'REMOVE',cartItemId:id});await refreshCart();renderCart()}catch(e){toast(e.message||t('error'))}}
async function logout(){try{await api('logout',{});}catch(_){}state.session='';localStorage.removeItem(CONFIG.SESSION);closeAllLayers();toast(t('signedOut'))}
function bindGlobal(){
 document.addEventListener('click',async e=>{
   const close=e.target.closest('[data-close]');if(close){e.preventDefault();e.stopPropagation();closeAllLayers();return}
   const route=e.target.closest('[data-route]');if(route){e.preventDefault();navigate(route.dataset.route);return}
   const th=e.target.closest('[data-theme]');if(th){applyTheme(th.dataset.theme);return}
   const f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;renderRoute();return}
   const prod=e.target.closest('[data-product]');if(prod){openProduct(prod.dataset.product);return}
   const ip=e.target.closest('[data-info-product]');if(ip){openProductInfo(ip.dataset.infoProduct);return}
   const color=e.target.closest('[data-color]');if(color){updateProductState({color:color.dataset.color});return}
   const size=e.target.closest('[data-size]');if(size){updateProductState({size:size.dataset.size});return}
   const design=e.target.closest('[data-design]');if(design){updateProductState({design:design.dataset.design});return}
   const qty=e.target.closest('[data-qty]');if(qty){const n=Math.max(1,Number(state.product?.qty||1)+Number(qty.dataset.qty));updateProductState({qty:n});return}
   const add=e.target.closest('[data-add]');if(add){if(!state.product)openProduct(add.dataset.add);else addCurrentToCart();return}
   const det=e.target.closest('[data-details]');if(det){openProductInfo(det.dataset.details);return}
   const sz=e.target.closest('[data-sizechart]');if(sz){openSizeChart(sz.dataset.sizechart);return}
   const rem=e.target.closest('[data-remove]');if(rem){await removeCartItem(rem.dataset.remove);return}
   if(e.target.closest('#checkoutBtn')){openCheckout();return}
   if(e.target.closest('#bagBtn')){openCart();return}
   if(e.target.closest('#accountBtn')||e.target.closest('#footerAccount')||e.target.closest('#archiveLogin')){openAccount();return}
   if(e.target.closest('#logout')){logout();return}
   if(e.target===e.currentTarget.querySelector('.modal-wrap')||e.target===e.currentTarget.querySelector('.drawer-wrap')){closeAllLayers();return}
 });
 document.addEventListener('pointerdown',e=>{const close=e.target.closest?.('[data-close]');if(close){e.preventDefault();closeAllLayers()}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAllLayers()});
 $('#langBtn').addEventListener('click',()=>setLang(state.lang==='ar'?'en':'ar'));
 window.addEventListener('hashchange',renderRoute);
}
function bridgeOriginAllowed(o){return /^https:\/\/(?:[a-z0-9-]+\.)?(?:script\.google\.com|googleusercontent\.com)$/i.test(String(o||''))}
function initBridge(){
 const frame=$('#bridge');frame.src=CONFIG.API+'?action=authbridge&v=5&_t='+Date.now();
 setTimeout(()=>{if(!state.bridgeReady)toast(t('networkError'))},10000);
}
window.addEventListener('message',e=>{
 const d=e.data||{};if(!bridgeOriginAllowed(e.origin))return;
 if(d.type==='TEMP_BRIDGE_READY'){state.bridgeReady=true;state.bridgeTarget=e.source;state.bridgeOrigin=e.origin;state.queue.splice(0).forEach(sendBridge);return}
 if(d.type==='TEMP_BRIDGE_RESULT'){const p=state.pending.get(d.requestId);if(!p)return;clearTimeout(p.timer);state.pending.delete(d.requestId);d.result?.ok===false?p.reject(new Error(d.result.errorCode||'API_ERROR')):p.resolve(d.result)}
});
function sendBridge(q){try{state.bridgeTarget.postMessage({type:'TEMP_BRIDGE_CALL',requestId:q.id,action:q.action,payload:q.payload||{}},state.bridgeOrigin)}catch(e){const p=state.pending.get(q.id);if(p){clearTimeout(p.timer);state.pending.delete(q.id);p.reject(e)}}}
function api(action,payload={},timeout=30000){return new Promise((resolve,reject)=>{const id='B'+cryptoRandom();const timer=setTimeout(()=>{state.pending.delete(id);reject(new Error('REQUEST_TIMEOUT'))},timeout);state.pending.set(id,{resolve,reject,timer});const q={id,action,payload};if(state.bridgeReady)sendBridge(q);else state.queue.push(q)})}
async function boot(){
 document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';bindGlobal();initBridge();
 try{
   const [c,content]=await Promise.all([api('catalog',{}),api('content',{})]);
   state.catalog=c;
   state.catalog.runtimeConfig=Object.assign({},state.catalog.runtimeConfig||{},content);
   renderThemes();applyI18n();renderRoute();await refreshCart();
   if(state.session){try{await api('sessionbootstrap',{sessionToken:state.session})}catch(_){state.session='';localStorage.removeItem(CONFIG.SESSION)}}
 }catch(e){$('#appMain').innerHTML=`<section class="page"><div class="notice">${esc(t('networkError'))}<div class="actions"><button class="btn primary" onclick="location.reload()">${esc(t('retry'))}</button></div></div></section>`}
}
const gis=document.createElement('script');gis.src='https://accounts.google.com/gsi/client';gis.async=true;gis.defer=true;document.head.appendChild(gis);
boot();
})();
</script>
