<!doctype html>
<html lang="en" data-theme="main">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">

<title>TEMPORARY™ — Everything Is Temporary</title>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<style>
:root{--bg:#070707;--bg2:#0d0d0d;--panel:#101010;--panel2:#161616;--line:rgba(255,255,255,.12);--text:#f3f0e9;--muted:#9a9a9a;--accent:#f3f0e9;--ink:#070707;--ease:cubic-bezier(.16,1,.3,1);--shadow:0 30px 80px rgba(0,0,0,.35)}
html[data-theme="main"]{--bg:#0a0a08;--bg2:#11110d;--panel:#14140f;--panel2:#1b1a12;--line:rgba(255,216,0,.18);--text:#fff8d6;--muted:#a9a27f;--accent:#ffd400;--ink:#090909}
html[data-theme="gallery"]{--bg:#11121a;--bg2:#171926;--panel:#1c1e2b;--panel2:#242737;--line:rgba(164,174,255,.18);--text:#f5f6ff;--muted:#9ca3bd;--accent:#8ea2ff;--ink:#0d1020}
html[data-theme="street"]{--bg:#090909;--bg2:#121212;--panel:#171717;--panel2:#1e1e1e;--line:rgba(255,45,45,.2);--text:#fff;--muted:#a5a5a5;--accent:#ff2b2b;--ink:#070707}
html[data-theme="culture"]{--bg:#0b0f0c;--bg2:#111711;--panel:#172018;--panel2:#202a20;--line:rgba(177,255,71,.18);--text:#f4f8ec;--muted:#98a58f;--accent:#b4ff47;--ink:#0b0f0c}
html[data-theme="christmas"]{--bg:#0b120d;--bg2:#111c14;--panel:#16251a;--panel2:#1d3022;--line:rgba(220,38,38,.22);--text:#fff7ef;--muted:#9caf9f;--accent:#dc2626;--ink:#fff}
html[data-theme="chrome"]{--bg:#c9cdd3;--bg2:#e1e4e8;--panel:#f2f3f5;--panel2:#b9bec6;--line:rgba(14,18,23,.2);--text:#0d1117;--muted:#4b5563;--accent:#0d1117;--ink:#e1e4e8}
html[data-theme="tokyo"]{--bg:#07080d;--bg2:#0d1019;--panel:#141827;--panel2:#1b2032;--line:rgba(255,183,0,.2);--text:#fff8df;--muted:#a7a99c;--accent:#ffb000;--ink:#07080d}
html[data-theme="halloween"]{--bg:#160d08;--bg2:#21120b;--panel:#29160d;--panel2:#342017;--line:rgba(255,126,24,.22);--text:#fff0d9;--muted:#b49a84;--accent:#ff7a18;--ink:#1b0d06}
html[data-theme="glacier"]{--bg:#07121c;--bg2:#0d1b28;--panel:#122538;--panel2:#18324a;--line:rgba(67,213,255,.2);--text:#effcff;--muted:#86bdd0;--accent:#27d7ff;--ink:#061019}
html[data-theme="raw"]{--bg:#000;--bg2:#080808;--panel:#101010;--panel2:#181818;--line:rgba(255,255,255,.25);--text:#fff;--muted:#888;--accent:#fff;--ink:#000}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Segoe UI",Inter,Arial,sans-serif;overflow-x:hidden;transition:background .5s var(--ease),color .5s}
body.lock{overflow:hidden}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}img{max-width:100%;display:block}
[dir="rtl"] body,[dir="rtl"] button,[dir="rtl"] input,[dir="rtl"] select,[dir="rtl"] textarea{font-family:Tahoma,"Segoe UI",Arial,sans-serif}
.display{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.045em}[dir="rtl"] .display{font-family:Tahoma,Arial,sans-serif;letter-spacing:0;font-weight:700}
.mono{font-family:"Courier New",monospace;letter-spacing:.12em;font-size:10px;text-transform:uppercase}.muted{color:var(--muted)}
.btn{min-height:48px;padding:0 20px;border:1px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.06em;transition:.25s var(--ease)}.btn:hover{border-color:var(--text);transform:translateY(-2px)}.btn.primary{background:var(--text);color:var(--ink);border-color:var(--text)}.btn.wide{width:100%}.btn:disabled{opacity:.4;pointer-events:none}
.btn.busy:before{content:"";width:13px;height:13px;border:1.5px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;position:relative}.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
.badge-n{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--text);color:var(--ink);font-size:10px;font-weight:800;display:grid;place-items:center}
/* gate */
#gate{min-height:100svh;display:grid;place-items:center;padding:90px 22px 40px;text-align:center;position:relative;overflow:hidden}
#gate:before{content:"";position:absolute;inset:8%;border:1px solid var(--line);border-radius:50%;animation:spin 40s linear infinite}
.gate-title{font-size:clamp(70px,14vw,200px);line-height:.78;margin:18px 0 0;text-transform:uppercase}.gate-sub{max-width:620px;margin:30px auto 0;color:var(--muted)}
#gSlot{min-height:46px;display:flex;justify-content:center;margin-top:26px}#authNote{margin-top:12px;min-height:16px}
/* header */
#app{display:none}.hdr{position:fixed;top:0;left:0;right:0;height:72px;z-index:50;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;padding:0 clamp(14px,4vw,44px);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.22em;font-size:14px}.hc{display:flex;align-items:center;justify-content:center;gap:22px}.nav{display:flex;gap:20px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.nav a:hover{color:var(--text)}
.ctl{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px}.vis{height:36px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.vis span{color:var(--accent)}
.lang{height:32px;min-width:36px;border-radius:9px;font-size:10px;font-weight:700;color:var(--muted)}.lang.on{background:var(--text);color:var(--ink)}.ha{display:flex;gap:8px}
.marquee{margin-top:72px;border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}.mt{display:inline-flex;gap:36px;padding:10px 0;animation:mq 26s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
/* hero */
.hero{position:relative;min-height:calc(100svh - 110px);overflow:hidden;border-bottom:1px solid var(--line)}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.85)}
.hero-copy{position:absolute;z-index:2;inset:0 auto 0 0;width:min(56%,760px);padding:clamp(30px,6vw,80px);display:flex;flex-direction:column;justify-content:center;background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 94%,transparent),color-mix(in srgb,var(--bg) 60%,transparent) 60%,transparent)}
[dir="rtl"] .hero-copy{inset:0 0 0 auto;background:linear-gradient(270deg,color-mix(in srgb,var(--bg) 94%,transparent),transparent)}
.hero-title{font-size:clamp(56px,8vw,128px);line-height:.84;margin:14px 0 0}.hero-copy p{max-width:520px;color:var(--muted);margin:24px 0}
/* sections */
.section{padding:clamp(70px,9vw,120px) clamp(16px,4vw,52px);border-bottom:1px solid var(--line)}.sh{display:grid;grid-template-columns:1fr .8fr;gap:26px;align-items:end;margin-bottom:28px}.st{font-size:clamp(52px,8vw,110px);line-height:.84;margin:10px 0 0}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:26px}.filters button{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:99px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.filters button.on{border-color:var(--text);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.card{border:1px solid var(--line);background:var(--panel);overflow:hidden;transition:transform .4s var(--ease),box-shadow .4s}.card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.frame{position:relative;aspect-ratio:4/5;overflow:hidden;background:#080808;cursor:pointer}.frame .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .subj{position:absolute;transform:translate(-50%,-50%);transform-origin:center;z-index:2}.frame .subj img{width:100%;height:100%;object-fit:contain;object-position:center;filter:drop-shadow(0 14px 11px rgba(0,0,0,.36))}
.frame .lbl{position:absolute;z-index:3;left:7%;right:7%;bottom:4%;padding:9px 12px;display:flex;justify-content:space-between;gap:10px;background:linear-gradient(180deg,rgba(5,5,5,.4),rgba(5,5,5,.88));border:1px solid rgba(255,255,255,.14);border-radius:6px;color:#fff;font-size:9px}
.frame .tag{position:absolute;z-index:3;top:12px;left:12px;padding:6px 9px;border-radius:99px;background:rgba(0,0,0,.4);color:#fff;font-size:8px;letter-spacing:.14em;border:1px solid rgba(255,255,255,.25)}
.frame .so{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;font-weight:800;letter-spacing:.2em}
.info{padding:16px}.pn{font-size:17px;font-weight:600}.pm{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:11px}.pm b{color:var(--text)}
.sw{display:flex;gap:6px;margin-top:12px}.sw i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line)}
.pa{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.pa button{min-height:44px;border:1px solid var(--line);border-radius:10px;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:color-mix(in srgb,var(--panel2) 70%,transparent)}.pa button:hover{border-color:var(--accent)}
.manifesto{display:grid;grid-template-columns:.7fr 1.3fr;border-bottom:1px solid var(--line)}.mp{padding:clamp(28px,5vw,64px);border-right:1px solid var(--line)}.mword{font-size:clamp(70px,11vw,170px);line-height:.76}.mcopy{font-size:clamp(26px,3.8vw,60px);line-height:.98}.ml{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line);font-size:12px}
.museum{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.mcard{aspect-ratio:4/5;padding:10px;background:linear-gradient(145deg,#5a4728,#171411 16%,#332719 55%,#70582f);border:2px solid #8e7441;position:relative}.mcard .mat{position:relative;height:100%;background:#eee8dc;border:8px solid #eee8dc}.mcard img{width:100%;height:100%;object-fit:contain}.mcard .pl{position:absolute;left:8%;right:8%;bottom:4%;padding:9px 11px;background:rgba(8,8,8,.86);color:#fff;font-size:12px}
.empty{padding:50px 10px;text-align:center;color:var(--muted);border:1px dashed var(--line)}
.footer{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:30px;padding:56px clamp(16px,4vw,52px)}.footer .fb{font-size:46px;line-height:.85}.fcol{display:grid;gap:8px;align-content:start;font-size:12px;color:var(--muted)}.fcol b{color:var(--text);font-size:9px;letter-spacing:.16em;text-transform:uppercase}
.infopage{min-height:70svh}.infopage .body{max-width:880px;color:var(--muted);line-height:1.85;margin-top:30px}.infopage .body h2,.infopage .body h3{color:var(--text)}.cform{display:grid;gap:10px;max-width:520px;margin-top:26px}
.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.field input,.field select,.field textarea{min-height:46px;border:1px solid var(--line);background:var(--panel);padding:0 12px;border-radius:10px;width:100%;outline:0}.field textarea{padding:12px;min-height:90px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--text)}
/* layers */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);opacity:0;pointer-events:none;z-index:80;transition:opacity .3s}.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;width:min(470px,100vw);height:100svh;background:var(--bg);border-left:1px solid var(--line);z-index:90;transform:translateX(102%);transition:transform .45s var(--ease);display:flex;flex-direction:column}[dir="rtl"] .drawer{right:auto;left:0;transform:translateX(-102%)}.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px;border-bottom:1px solid var(--line)}.dt{font-size:36px;line-height:.9;margin-top:6px}.db{padding:0 22px 26px;overflow:auto;flex:1}
.x{width:46px;height:46px;border:1px solid var(--line);border-radius:50%;font-size:22px;flex:0 0 auto}.x:hover{border-color:var(--text)}
.ci{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.ci img{width:72px;height:72px;object-fit:cover;border:1px solid var(--line)}.qty{display:flex;gap:8px;align-items:center;margin-top:8px}.qty button{width:28px;height:28px;border:1px solid var(--line);border-radius:50%}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.modal{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .3s}.modal.on{opacity:1;pointer-events:auto}
.mc{width:min(1080px,100%);max-height:92svh;overflow:auto;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}.mc.sm{width:min(720px,100%)}.mtop{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:3}
.cz{display:grid;grid-template-columns:1fr 1fr}.stagew{background:var(--panel2);display:grid;place-items:center;padding:24px;border-right:1px solid var(--line)}
.stage{position:relative;width:min(500px,100%);aspect-ratio:4/5;overflow:hidden}.stage .base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center}.stage .art{position:absolute;transform-origin:center;z-index:2;display:none}.stage .art img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.czr{padding:26px}.cht{font-size:clamp(34px,4vw,50px);line-height:.92;margin:8px 0}.cb{padding:14px 0;border-top:1px solid var(--line)}.cl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{padding:10px 13px;border:1px solid var(--line);border-radius:10px;font-size:11px;color:var(--muted)}.seg button.on{border-color:var(--text);color:var(--text);background:var(--panel)}.seg button:disabled{opacity:.35;text-decoration:line-through}
.dot{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}.dot.on{box-shadow:0 0 0 2px var(--text)}
.note{font-size:11px;color:var(--muted);margin:10px 0;line-height:1.6}.err{color:#e66;font-size:12px;min-height:18px;margin:8px 0}
.sheet{padding:24px 28px}.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:14px}.specs div{background:var(--panel);padding:14px}.specs small{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
table.sz{width:100%;border-collapse:collapse;margin-top:12px}table.sz th,table.sz td{padding:11px;border-bottom:1px solid var(--line);text-align:start;font-size:13px}table.sz th{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cog{display:grid;grid-template-columns:1fr .8fr;gap:24px;padding:22px}.sum{padding:18px;border:1px solid var(--line);background:var(--panel);height:max-content}
.center{text-align:center}.big{font-size:clamp(44px,8vw,80px);line-height:.86}.hours{font-size:clamp(46px,9vw,90px);color:var(--accent);font-weight:900;line-height:.9}
.spin{width:70px;height:70px;border:1px solid var(--accent);border-top-color:transparent;border-radius:50%;margin:0 auto 20px;animation:spin 1s linear infinite}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);z-index:120;padding:11px 18px;background:var(--text);color:var(--ink);border-radius:99px;font-size:11px;font-weight:700;transition:.35s var(--ease);max-width:92vw}#toast.on{transform:translate(-50%,0)}#toast.bad{background:#b91c1c;color:#fff}
#confirmPage{display:none;min-height:100svh;place-items:center;padding:20px}#confirmPage.on{display:grid}.cbox{width:min(560px,100%);border:1px solid var(--line);padding:30px;background:var(--bg)}
#syncBadge{position:fixed;right:12px;bottom:12px;z-index:40;font:8px "Courier New",monospace;color:var(--muted);padding:5px 8px;border:1px solid var(--line);border-radius:99px;background:color-mix(in srgb,var(--bg) 88%,transparent)}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sh{grid-template-columns:1fr}.museum{grid-template-columns:1fr 1fr}.footer{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.hdr{height:62px;grid-template-columns:auto 1fr auto;gap:6px;padding:0 8px}.nav{display:none}.brand{font-size:10px;letter-spacing:.14em}.vis{height:34px;padding:0 9px;font-size:9px}.lang{min-width:30px;height:30px}.icon{width:36px;height:36px}.marquee{margin-top:62px}
 .hero-copy{inset:auto 0 0 0;width:auto;padding:28px 18px 36px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg) 92%,transparent) 30%)}.grid{grid-template-columns:1fr}.manifesto{grid-template-columns:1fr}.mp{border-right:0;border-bottom:1px solid var(--line)}
 .cz,.cog{grid-template-columns:1fr}.stagew{border-right:0;border-bottom:1px solid var(--line);padding:12px}.stage{width:min(340px,82vw)}.czr{padding:18px}.mc{max-height:96svh}.specs{grid-template-columns:1fr}.footer{grid-template-columns:1fr}.museum{grid-template-columns:1fr}.pa button{font-size:8px}}
</style>
</head>

 <div class="ha"><button class="icon" id="accBtn" aria-label="Account"><svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg></button><button class="icon" id="bagBtn" aria-label="Bag"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="badge-n" id="bagN">0</span></button></div>
</header>

<main id="mainPages">

/* ================= TRANSPORT ================= */
function bridgeOk(o){return /^https:\/\/([a-z0-9-]+\.)*(script\.google\.com|googleusercontent\.com)$/i.test(o)}
function initBridge(){$('#bridge').src=CFG.API_URL+'?action=authbridge&t='+Date.now();setTimeout(()=>{if(!S.bridge.ready)initBridge()},12000)}
addEventListener('message',e=>{

const SUBJ=new Map();
function subject(src){if(SUBJ.has(src))return SUBJ.get(src);const p=new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{try{const sc=Math.min(1,900/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h),D=d.data;const refs=[[2,2],[w-3,2],[2,h-3],[w-3,h-3],[w>>1,2],[2,h>>1],[w-3,h>>1]].map(([a,b])=>{const i=(b*w+a)*4;return [D[i],D[i+1],D[i+2]]});const bg=(r,g,b)=>{const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx<55||mx-mn>75)return false;return refs.some(f=>Math.hypot(r-f[0],g-f[1],b-f[2])<66)};const seen=new Uint8Array(w*h),q=[];const push=k=>{if(k>=0&&k<w*h&&!seen[k]){seen[k]=1;q.push(k)}};for(let i=0;i<w;i++){push(i);push((h-1)*w+i)}for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}for(let z=0;z<q.length;z++){const k=q[z],i=k*4;if(bg(D[i],D[i+1],D[i+2])){D[i+3]=0;const X=k%w;if(X>0)push(k-1);if(X<w-1)push(k+1);push(k-w);push(k+w)}}x.putImageData(d,0,0);res(c.toDataURL('image/png'))}catch(_){res(src)}};im.onerror=()=>res(src);im.src=src});SUBJ.set(src,p);return p}

function open(id){$('#'+id).classList.add('on');$('#ov').classList.add('on');document.body.classList.add('lock')}
function close(id){$('#'+id).classList.remove('on');if(!$$('.drawer.on,.modal.on').length){$('#ov').classList.remove('on');document.body.classList.remove('lock')}}
$$('[data-close]').forEach(b=>b.onclick=()=>close(b.closest('.drawer,.modal').id));$('#ov').onclick=()=>$$('.drawer.on,.modal.on').forEach(e=>{if(e.id!=='mProcessing')close(e.id)});
$$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m&&m.id!=='mProcessing')close(m.id)}));addEventListener('keydown',e=>{if(e.key==='Escape')$$('.drawer.on,.modal.on').forEach(x=>{if(x.id!=='mProcessing')close(x.id)})});
$('#bagBtn').onclick=()=>{renderBag();open('bag')};$('#accBtn').onclick=()=>{renderAccount();open('account');refreshAccount()};
$('#visBtn').onclick=()=>{const ids=enabledThemes().map(x=>x.id);if(!ids.length)return;S.theme=ids[(ids.indexOf(S.theme)+1)%ids.length];sessionStorage.setItem('temporary_theme',S.theme);applyTheme();renderGrid()};
$$('.lang').forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;localStorage.setItem(CFG.LANG_KEY,S.lang);renderAll();renderAccount();if(S.sel&&$('#mCustom').classList.contains('on'))renderCustomizer()});

/* ================= AUTH ================= */
function loadGsi(){return new Promise(r=>{if(window.google?.accounts?.id)return r(true);const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>r(true);s.onerror=()=>r(false);document.head.appendChild(s)})}
async function initGoogle(){$('#authNote').textContent=t('authWorking');if(!await loadGsi()){$('#retryAuth').style.display='inline-flex';$('#authNote').textContent=t('networkError');return}
  google.accounts.id.initialize({client_id:(S.B&&S.B.config.googleClientId)||'32171492706-n6rli6equ2e0es8ac15npdcrhctlq2bn.apps.googleusercontent.com',callback:async r=>{$('#authNote').textContent=t('authWorking');try{const d=await bridge('googleauth',{credential:r.credential,deviceId:deviceId()});S.token=d.sessionToken;localStorage.setItem(CFG.SESSION_KEY,S.token);S.customer=d.customer;await afterLogin()}catch(e){$('#authNote').textContent=e.message;$('#retryAuth').style.display='inline-flex'}}});
  google.accounts.id.renderButton($('#gSlot'),{theme:'outline',size:'large',shape:'pill',text:'continue_with',width:300});$('#authNote').textContent=t('authReady')}
async function afterLogin(){$('#gate').style.display='none';$('#app').style.display='block';try{const ctx=await auth('context');S.customer=ctx.customer;S.cart=ctx.cart}catch(_){}renderBag();renderAccount();refreshAccount();track('PAGE_VIEW');route()}
async function logout(){try{await auth('logout')}catch(_){}localStorage.removeItem(CFG.SESSION_KEY);S.token='';S.customer=null;S.orders=[];S.cart={items:[],subtotal:0,itemCount:0,currency:cur()};close('account');$('#app').style.display='none';$('#gate').style.display='grid';initGoogle()}
$('#retryAuth').onclick=()=>{$('#retryAuth').style.display='none';initBridge();initGoogle()};

/* ================= CONFIRMATION PAGE ================= */
async function confirmationPage(token){document.documentElement.dataset.theme='main';$('#gate').style.display='none';$('#confirmPage').classList.add('on');const btn=$('#cpBtn');
  $('#cpTitle').textContent=t('confirmationPageTitle');$('#cpCopy').textContent=t('confirmationPageCopy');btn.textContent=t('confirmationPageButton');$('#cpShop').textContent=t('confirmationPageShop');$('#cpStatus').textContent='…';
  const show=st=>{const m={CONFIRMED:'confirmationConfirmed',ALREADY_CONFIRMED:'confirmationAlready',EXPIRED:'confirmationExpired',CANCELED:'confirmationExpired'};$('#cpStatus').textContent=t(m[st]||'confirmationInvalid');btn.disabled=true};
  try{const d=await bridge('confirmationdata',{token});$('#cpOrder').innerHTML=`<div class="row"><span>#</span><b>${esc(d.orderNumber)}</b></div><div class="row"><span>${esc(t('total'))}</span><b>${money(d.total,d.currency)}</b></div>`;
    if(d.status!=='PENDING')return show(d.status);$('#cpStatus').textContent=`${t('confirmBy')} ${new Date(d.expiresAt).toLocaleString()}`;btn.disabled=false;
    btn.onclick=async()=>{btn.disabled=true;btn.classList.add('busy');try{const r=await bridge('confirmorder',{token});show(r.status)}catch(e){$('#cpStatus').textContent=e.message;btn.disabled=e.code==='CONFIRMATION_ORDER_EXPIRED'}finally{btn.classList.remove('busy')}}}
  catch(e){$('#cpStatus').textContent=e.message||t('confirmationInvalid')}}

/* ================= ADMIN PREVIEW (parity: admin drafts rendered by THIS code) ================= */
function applyPreview(d){if(Array.isArray(d.placements)){d.placements.forEach(p=>S.ovP.set(pk(p.productId,p.color,p.artworkType,p.designId,p.side,p.printSize),p))}
  if(Array.isArray(d.collectionMockups)){S.ovC=d.collectionMockups.map(r=>({...r,themeId:String(r.themeId||'').toLowerCase()}))}
  if(d.theme&&enabledThemes().some(x=>x.id===d.theme)){S.theme=d.theme;applyTheme()}
  renderGrid();if(d.open){if(!$('#mCustom').classList.contains('on'))openCustomizer(d.open.productId,d.open);else{Object.assign(S.sel,d.open);renderCustomizer()}}if(d.scrollTo)document.getElementById(d.scrollTo)?.scrollIntoView()}

/* ================= BOOT ================= */
(async function boot(){
  applyLang();initBridge();
  const hash=location.hash||'';if(/^#confirmorder/i.test(hash)){const tok=new URLSearchParams(hash.split('?')[1]||'').get('token');return confirmationPage(tok||'')}
  try{const cached=JSON.parse(localStorage.getItem(CFG.BUNDLE_KEY)||'null');if(cached&&cached.catalog){useBundle(cached);renderAll()}}catch(_){}
  const live=loadBundle().then(()=>startSync()).catch(()=>toast(t('networkError'),true));
  if(S.preview){$('#gate').style.display='none';$('#app').style.display='block';$('#syncBadge').textContent='ADMIN PREVIEW';await live;route();return}
  if(S.token){try{const d=await bridge('sessionbootstrap',{sessionToken:S.token},30000);S.customer=d.customer;await afterLogin();return}catch(e){if(['SESSION_INVALID','SESSION_EXPIRED','SESSION_REVOKED','CUSTOMER_NOT_FOUND','AUTH_REQUIRED'].includes(e.code)){localStorage.removeItem(CFG.SESSION_KEY);S.token=''}}}
  $('#gate').style.display='grid';await live.catch(()=>{});initGoogle();
})();
</script>
</body>
