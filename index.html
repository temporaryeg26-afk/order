<style>
:root{--bg:#070707;--bg2:#0d0d0d;--panel:#101010;--panel2:#161616;--line:rgba(255,255,255,.12);--text:#f3f0e9;--muted:#9a9a9a;--accent:#f3f0e9;--ink:#070707;--ease:cubic-bezier(.16,1,.3,1);--shadow:0 30px 80px rgba(0,0,0,.35);--hdr:72px;--wrap:1320px;--pad:clamp(16px,4vw,52px)}

*{box-sizing:border-box}html{background:var(--bg);scroll-padding-top:calc(var(--hdr) + 20px)}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Segoe UI",Inter,Arial,sans-serif;overflow-x:hidden;transition:background .5s var(--ease),color .5s}
body.lock{overflow:hidden}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:0}img{max-width:100%;display:block}
[dir="rtl"] body,[dir="rtl"] button,[dir="rtl"] input,[dir="rtl"] select,[dir="rtl"] textarea{font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif}
.display{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.045em}[dir="rtl"] .display{font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;letter-spacing:0;font-weight:700}
.mono{font-family:"Courier New",monospace;letter-spacing:.12em;font-size:10px;text-transform:uppercase}[dir="rtl"] .mono{letter-spacing:0;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:11px;font-weight:600}

.btn:hover{border-color:var(--text);transform:translateY(-2px)}.btn.primary{background:var(--text);color:var(--ink);border-color:var(--text)}.btn.wide{width:100%}.btn:disabled{opacity:.4;pointer-events:none}.btn.sm{min-height:38px;padding:0 15px;font-size:11px}
.btn.busy:before{content:"";width:13px;height:13px;border:1.5px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;position:relative;flex:0 0 auto}.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
.badge-n{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--text);color:var(--ink);font-size:10px;font-weight:800;display:grid;place-items:center}
.lnk{border-bottom:1px solid currentColor;padding-bottom:1px}.lnk:hover{color:var(--accent)}
/* ---------- gate ---------- */
#gate{min-height:100svh;display:none;place-items:center;padding:90px 22px 40px;text-align:center;position:relative;overflow:hidden}
#gate:before{content:"";position:absolute;inset:8%;border:1px solid var(--line);border-radius:50%;animation:spin 40s linear infinite}
.gate-title{font-size:clamp(70px,14vw,200px);line-height:.78;margin:18px 0 0;text-transform:uppercase}.gate-sub{max-width:620px;margin:30px auto 0;color:var(--muted)}
#gSlot{min-height:46px;display:flex;justify-content:center;margin-top:26px}#authNote{margin-top:12px;min-height:16px}
.gate-links{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap;z-index:2;color:var(--muted)}.gate-links a:hover{color:var(--text)}

.brand{font-weight:800;letter-spacing:.22em;font-size:14px;white-space:nowrap}.nav{display:flex;gap:24px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-inline-start:18px}[dir="rtl"] .nav{letter-spacing:0;font-size:14px}
.nav a{position:relative;padding:6px 0}.nav a:hover,.nav a.on{color:var(--text)}.nav a.on:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--accent)}
.sp{flex:1}.ctl{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;align-items:center}.vis{height:34px;padding:0 13px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.vis span{color:var(--accent)}
.lang{height:32px;min-width:38px;border-radius:9px;font-size:11px;font-weight:700;color:var(--muted);transition:.2s}.lang.on{background:var(--text);color:var(--ink)}.ha{display:flex;gap:8px}#menuBtn{display:none}
.marquee{margin-top:var(--hdr);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}.mt{display:inline-flex;gap:36px;padding:10px 0;animation:mq 30s linear infinite}[dir="rtl"] .mt{animation-name:mqr}@keyframes mq{to{transform:translateX(-50%)}}@keyframes mqr{to{transform:translateX(50%)}}
#view{min-height:70svh;transition:opacity .22s var(--ease),transform .22s var(--ease)}#view.out{opacity:0;transform:translateY(6px)}
/* ---------- mobile nav ---------- */
.mnav{position:fixed;inset:0;z-index:92;pointer-events:none}.mnav .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:.3s}.mnav .pan{position:absolute;top:0;bottom:0;left:0;width:min(360px,88vw);background:var(--bg);border-inline-end:1px solid var(--line);transform:translateX(-102%);transition:transform .4s var(--ease);padding:22px;display:flex;flex-direction:column;gap:6px;overflow:auto}
[dir="rtl"] .mnav .pan{left:auto;right:0;transform:translateX(102%)}.mnav.on{pointer-events:auto}.mnav.on .scrim{opacity:1}.mnav.on .pan{transform:none}
.mnav a.big{font-size:30px;line-height:1.15;padding:8px 0;border-bottom:1px solid var(--line)}.mnav .small{display:grid;gap:10px;margin-top:22px;color:var(--muted);font-size:13px}
/* ---------- generic sections ---------- */
.section{padding:clamp(64px,8vw,110px) var(--pad);border-bottom:1px solid var(--line)}.sh{display:grid;grid-template-columns:1fr .8fr;gap:26px;align-items:end;margin-bottom:30px}.st{font-size:clamp(50px,7.5vw,104px);line-height:.86;margin:10px 0 0}[dir="rtl"] .st{line-height:1.08}
.phead{padding:clamp(54px,7vw,96px) var(--pad) clamp(34px,4vw,56px);border-bottom:1px solid var(--line)}.phead .st{max-width:1000px}.phead p.lead{max-width:640px;color:var(--muted);font-size:17px;margin:24px 0 0}
.crumbs{display:flex;gap:10px;align-items:center;color:var(--muted);margin-bottom:22px}.crumbs a:hover{color:var(--text)}

.hero-copy{position:absolute;z-index:2;inset:0 auto 0 0;width:min(58%,780px);padding:clamp(30px,6vw,80px);display:flex;flex-direction:column;justify-content:center;background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 94%,transparent),color-mix(in srgb,var(--bg) 60%,transparent) 60%,transparent)}
[dir="rtl"] .hero-copy{inset:0 0 0 auto;background:linear-gradient(270deg,color-mix(in srgb,var(--bg) 94%,transparent),transparent)}
.hero-title{font-size:clamp(56px,8vw,128px);line-height:.84;margin:14px 0 0}[dir="rtl"] .hero-title{line-height:1.1}.hero-copy p{max-width:520px;color:var(--muted);margin:24px 0}.hero-ctas{display:flex;gap:10px;flex-wrap:wrap}
/* filters + grid */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:26px}.filters button{height:38px;padding:0 15px;border:1px solid var(--line);border-radius:99px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}[dir="rtl"] .filters button{font-size:13px;letter-spacing:0}.filters button.on{border-color:var(--text);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.card{border:1px solid var(--line);background:var(--panel);overflow:hidden;transition:transform .4s var(--ease),box-shadow .4s}.card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.frame{position:relative;aspect-ratio:4/5;overflow:hidden;background:#080808;cursor:pointer;display:block}.frame .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .subj{position:absolute;transform:translate(-50%,-50%);transform-origin:center;z-index:2}.frame .subj img{width:100%;height:100%;object-fit:contain;object-position:center;filter:drop-shadow(0 14px 11px rgba(0,0,0,.36))}
.frame .lbl{position:absolute;z-index:3;left:7%;right:7%;bottom:4%;padding:9px 12px;display:flex;justify-content:space-between;gap:10px;background:linear-gradient(180deg,rgba(5,5,5,.4),rgba(5,5,5,.88));border:1px solid rgba(255,255,255,.14);border-radius:6px;color:#fff;font-size:9px}
.frame .tag{position:absolute;z-index:3;top:12px;inset-inline-start:12px;padding:6px 9px;border-radius:99px;background:rgba(0,0,0,.4);color:#fff;font-size:8px;letter-spacing:.14em;border:1px solid rgba(255,255,255,.25)}
.frame .so{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;font-weight:800;letter-spacing:.2em}
.info{padding:16px}.pn{font-size:17px;font-weight:600}.ptag{color:var(--muted);font-size:10px;margin-top:2px}.pm{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:11px}.pm b{color:var(--text);font-size:13px}

.pa{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.pa button{min-height:44px;border:1px solid var(--line);border-radius:10px;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:color-mix(in srgb,var(--panel2) 70%,transparent);padding:0 4px}[dir="rtl"] .pa button{font-size:12px;letter-spacing:0}.pa button:hover{border-color:var(--accent)}
.center-cta{display:flex;justify-content:center;margin-top:34px}
/* manifesto + features + museum */
.manifesto{display:grid;grid-template-columns:.7fr 1.3fr;border-bottom:1px solid var(--line)}.mp{padding:clamp(28px,5vw,64px);border-inline-end:1px solid var(--line)}.mp:last-child{border:0}.mword{font-size:clamp(70px,11vw,170px);line-height:.76}[dir="rtl"] .mword{line-height:1.05}.mcopy{font-size:clamp(26px,3.8vw,58px);line-height:1}[dir="rtl"] .mcopy{line-height:1.35}.ml{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line);font-size:13px}
.feats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}.feat{padding:28px 24px;border-inline-end:1px solid var(--line)}.feat:last-child{border:0}.feat svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.3;margin-bottom:18px}.feat b{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}[dir="rtl"] .feat b{letter-spacing:0;font-size:15px}.feat p{margin:0;color:var(--muted);font-size:13px}
.museum{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.mcard{aspect-ratio:4/5;padding:10px;background:linear-gradient(145deg,#5a4728,#171411 16%,#332719 55%,#70582f);border:2px solid #8e7441;position:relative}.mcard .mat{position:relative;height:100%;background:#eee8dc;border:8px solid #eee8dc}.mcard img{width:100%;height:100%;object-fit:contain}.mcard .pl{position:absolute;left:8%;right:8%;bottom:4%;padding:9px 11px;background:rgba(8,8,8,.86);color:#fff;font-size:12px}
.empty{padding:50px 10px;text-align:center;color:var(--muted);border:1px dashed var(--line)}
/* ---------- product page ---------- */
.pgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,4vw,60px);padding:clamp(28px,4vw,50px) var(--pad) clamp(50px,6vw,80px);border-bottom:1px solid var(--line)}
.gallery{position:sticky;top:calc(var(--hdr) + 20px);align-self:start}.gmain{position:relative;aspect-ratio:4/5;background:var(--panel2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}.gmain img{width:100%;height:100%;object-fit:contain;transition:opacity .3s}
.gthumbs{display:flex;gap:8px;margin-top:10px;overflow:auto}.gthumbs button{width:74px;height:74px;flex:0 0 auto;border:1px solid var(--line);background:var(--panel2);overflow:hidden}.gthumbs button.on{border-color:var(--text)}.gthumbs img{width:100%;height:100%;object-fit:cover}
.pinfo h1{font-size:clamp(40px,5vw,72px);line-height:.92;margin:12px 0 10px}[dir="rtl"] .pinfo h1{line-height:1.2}.price{font-size:22px;font-weight:600;margin:14px 0 4px}.ltd{font-size:12px;color:var(--muted)}
.opt{padding:18px 0;border-top:1px solid var(--line)}.opt .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--muted);min-width:46px}.seg button.on{border-color:var(--text);color:var(--text);background:var(--panel)}.seg button:disabled{opacity:.35;text-decoration:line-through}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 var(--pad);overflow:auto}.tabs button{padding:18px 4px;margin-inline-end:24px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}[dir="rtl"] .tabs button{letter-spacing:0;font-size:15px}.tabs button.on{color:var(--text);border-color:var(--accent)}
.tabbody{padding:clamp(28px,4vw,48px) var(--pad) clamp(50px,6vw,80px);border-bottom:1px solid var(--line)}
/* spec + care */
.specgrid{display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:28px;align-items:start}.fabric{aspect-ratio:1;border:1px solid var(--line);background:var(--panel2);overflow:hidden;display:grid;place-items:center}.fabric img{width:100%;height:100%;object-fit:cover}.fabric .ph{width:100%;height:100%;background:repeating-linear-gradient(45deg,var(--panel2),var(--panel2) 3px,var(--panel) 3px,var(--panel) 6px)}
.specs{display:grid;gap:0;border-top:1px solid var(--line)}.specs .sr{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}.specs .sr small{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:3px}[dir="rtl"] .specs .sr small{letter-spacing:0;font-size:12px}
.careicons{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:14px}.ci2{border:1px solid var(--line);background:var(--panel);padding:16px 10px;text-align:center;font-size:11px;color:var(--muted);display:grid;justify-items:center;gap:10px;align-content:start}.ci2 svg{width:38px;height:38px;stroke:var(--text);fill:none;stroke-width:1.4}
.h3{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:26px 0 4px}[dir="rtl"] .h3{letter-spacing:0;font-size:13px;font-weight:600}

.chart{border:1px solid var(--line);background:var(--panel);overflow:auto}table.sz{width:100%;border-collapse:collapse;min-width:420px}table.sz th,table.sz td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:center;font-size:14px}table.sz th{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--panel2)}[dir="rtl"] table.sz th{letter-spacing:0;font-size:12px}
table.sz td:first-child{font-weight:800;color:var(--accent)}table.sz tr:last-child td{border-bottom:0}table.sz tr.hit td{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.chartmeta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.measure{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;border:1px solid var(--line);padding:18px;margin-top:16px;background:var(--panel)}.measure svg{width:150px;height:auto}.measure .lg{display:grid;gap:6px;font-size:13px}.measure .lg i{display:inline-block;width:18px;height:2px;background:var(--accent);vertical-align:middle;margin-inline-end:8px}
.tol{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px;font-size:13px}.tol b{width:26px;height:26px;border:1px solid var(--text);border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-family:Georgia,serif}
.fitbox{margin-top:16px;padding:16px 18px;border-inline-start:2px solid var(--accent);background:var(--panel)}.fitbox b{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px}[dir="rtl"] .fitbox b{letter-spacing:0;font-size:13px}
.finder{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:16px;padding:16px;border:1px dashed var(--line)}.finder .field{margin:0;min-width:180px}.finder output{font-weight:700;color:var(--accent)}

const PUBLIC_VIEWS=new Set(['about','contact','policies','policy','size-guide']);
const LEGACY={shop:'shop',about:'about',contact:'contact',privacy:'policy/privacy',returns:'policy/returns',refund:'policy/returns',shipping:'policy/shipping',terms:'policy/terms',rule:'',archive:'',top:''};
function parseRoute(){let h=location.hash||'';if(/^#confirmorder/i.test(h))return {name:'confirm'};h=h.replace(/^#/,'');if(!h.startsWith('/')){const lg=LEGACY[h.split('?')[0]];h='/'+(lg!=null?lg:'')}const parts=h.slice(1).split('?')[0].split('/').map(decodeURIComponent);return {name:parts[0]||'home',id:parts[1]||'',sub:parts[2]||''}}
const go=path=>{location.hash='#/'+path};
function needsGate(r){return !S.customer&&!S.preview&&!S.authPending&&!PUBLIC_VIEWS.has(r.name)}
let lastKey='';
function render(keep){const r=parseRoute();if(r.name==='confirm')return;const key=r.name+'/'+r.id;
  if(needsGate(r)){S.route=r;$('#app').style.display='none';$('#gate').style.display='grid';document.title=plainT('brandWordmark')+' — '+[t('gate1'),t('gate2'),t('gate3')].join(' ');return}
  $('#gate').style.display='none';$('#app').style.display='block';
  const same=key===lastKey;if(same&&r.sub&&!keep){scrollToSec(r.sub);return}
  const V=VIEWS[r.name]||VIEWS.notfound,el=$('#view'),y=scrollY;S.route=r;
  const paint=()=>{const out=V(r);el.innerHTML=out.html;document.title=(out.title?out.title+' — ':'')+plainT('brandWordmark');out.after&&out.after();reveal(el,same||keep);$$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===r.name||(r.name==='product'&&a.dataset.nav==='shop')));
    if(same||keep)scrollTo(0,y);else if(r.sub)setTimeout(()=>scrollToSec(r.sub),40);else scrollTo(0,0)};
  if(same||keep||!S.B){paint();el.classList.remove('out')}else{el.classList.add('out');setTimeout(()=>{paint();requestAnimationFrame(()=>el.classList.remove('out'))},140)}
  lastKey=key}
addEventListener('hashchange',()=>{if(/^#confirmorder/i.test(location.hash))return location.reload();closeAll();render(false)});
function scrollToSec(id){const el=document.getElementById('sec-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function setLang(l){if(l===S.lang)return;S.lang=l;store.set(CFG.LANG_KEY,l);renderAll(true);renderAccount();if(S.sel&&$('#mCustom').classList.contains('on'))renderCustomizer();if($('#mInfo').classList.contains('on')&&S.info)S.info()}

/* Staggered reveal on scroll + cursor-follow light & tilt on collection cards (geometry box stays exactly as saved in Admin). */
const RV='.card,.sh,.feat,.about-sec,.polcard,.sgcard,.ccard,.values>div,.mp';
let RIO=null;function reveal(root=document,instant){if(!('IntersectionObserver' in window))instant=true;RIO=RIO||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');RIO.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px',threshold:.08});
  if(!instant)$$(RV,root).forEach(el=>{if(el.classList.contains('in')||el.classList.contains('reveal'))return;const sib=[...el.parentElement.children].filter(x=>x.matches(RV)),i=Math.max(0,sib.indexOf(el));el.style.setProperty('--d',(i%6)*0.08+'s');el.classList.add('reveal');RIO.observe(el)});
  $$('.frame',root).forEach((f,i)=>{const im=$('.sj img',f);if(im)im.style.setProperty('--fd',(-i*1.3)+'s');if(f.dataset.tilt||!matchMedia('(hover:hover)').matches)return;f.dataset.tilt=1;
   f.addEventListener('pointermove',e=>{const r=f.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;f.style.setProperty('--mx',x*100+'%');f.style.setProperty('--my',y*100+'%');f.style.setProperty('--ry',((x-.5)*10).toFixed(2)+'deg');f.style.setProperty('--rx',((.5-y)*8).toFixed(2)+'deg')});
   f.addEventListener('pointerleave',()=>{f.style.setProperty('--rx','0deg');f.style.setProperty('--ry','0deg')})})}
const SUBJ=new Map();
function subject(src){if(SUBJ.has(src))return SUBJ.get(src);const p=new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{try{const sc=Math.min(1,900/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h),D=d.data;const refs=[[2,2],[w-3,2],[2,h-3],[w-3,h-3],[w>>1,2],[2,h>>1],[w-3,h>>1]].map(([a,b])=>{const i=(b*w+a)*4;return [D[i],D[i+1],D[i+2]]});const bg=(r,g,b)=>{const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx<55||mx-mn>75)return false;return refs.some(f=>Math.hypot(r-f[0],g-f[1],b-f[2])<66)};const seen=new Uint8Array(w*h),q=[];const push=k=>{if(k>=0&&k<w*h&&!seen[k]){seen[k]=1;q.push(k)}};for(let i=0;i<w;i++){push(i);push((h-1)*w+i)}for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}for(let z=0;z<q.length;z++){const k=q[z],i=k*4;if(bg(D[i],D[i+1],D[i+2])){D[i+3]=0;const X=k%w;if(X>0)push(k-1);if(X<w-1)push(k+1);push(k-w);push(k+w)}}x.putImageData(d,0,0);res(c.toDataURL('image/png'))}catch(_){res(src)}};im.onerror=()=>{BAD.add(src);res('')};im.src=src});SUBJ.set(src,p);return p}
function filtersHTML(){const types=['ALL',...new Set(products().map(catKey))];return `<div class="filters" id="filters">${types.map(x=>`<button class="${x===S.filter?'on':''}" data-f="${x}">${esc(t(x==='ALL'?'all':x))}</button>`).join('')}</div>`}

function chartTable(p,hit){const g=(p.sizeGuide||[]).filter(r=>r.active!==false),kids=isKidsChart(p);if(!g.length)return `<p class="muted">${esc(p.sizes.map(szName).join(' · '))}</p>`;

$('#placeOrder').onclick=async()=>{const b=$('#placeOrder');b.disabled=true;$('#coErr').textContent='';openL('mProcessing');
  try{const r=await auth('createorder',{name:$('#coName').value,phone:$('#coPhone').value,email:$('#coEmail').value,dateOfBirth:$('#coDob').value,governorate:$('#coGov').value,area:$('#coArea').value.trim(),address:$('#coAddr').value,paymentMethod:'COD',idempotencyKey:S.idem},90000);
    S.idem='';S.cart={items:[],subtotal:0,itemCount:0,currency:cur()};renderBag();closeL('mProcessing');closeL('mCheckout');success(r);track('CHECKOUT_COMPLETED',{value:r.order.total});refreshAccount()}
  catch(e){closeL('mProcessing');$('#coErr').textContent=errText(e);b.disabled=false}};
function success(r){const o=r.order,m=S.B.confirmationMessage||{},ar=S.lang==='ar';$('#sNum').textContent=o.orderNumber;$('#sTitle').textContent=(ar?m.titleAr:m.titleEn)||t('orderReceived');$('#sBody').textContent=(ar?m.bodyAr:m.bodyEn)||'';$('#sNote').textContent=(ar?m.noteAr:m.noteEn)||'';
  $('#sHours').textContent=`${S.B.config.confirmationHours||1} ${t('hours')}`;$('#sUntil').textContent=r.confirmation?`${t('confirmBy')} ${new Date(r.confirmation.expiresAt).toLocaleString(dloc(),{dateStyle:'medium',timeStyle:'short'})}`:'';
  $('#sRows').innerHTML=[[t('delivery'),money(o.deliveryFee,o.currency)],[t('total'),money(o.total,o.currency)]].map(([a,b])=>`<div class="row"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('');$('#sDone').textContent=(ar?m.actionAr:m.actionEn)||t('continueShopping');openL('mSuccess')}
$('#sDone').onclick=()=>closeL('mSuccess');$('#toCheckout').onclick=openCheckout;

/* ================= ACCOUNT ================= */
async function refreshAccount(){if(!S.token||S.preview)return;try{S.orders=(await auth('orders')).orders||[]}catch(_){}renderAccount();const m=$('#museum');if(m)m.innerHTML=museumHTML()}
function renderAccount(){const c=S.customer;$('#accBody').innerHTML=c?`<div style="padding:16px 0;border-bottom:1px solid var(--line)"><b>${esc(c.fullName||c.email)}</b><div class="note" dir="ltr" style="text-align:start">${esc(c.email)}</div></div>${S.orders.length?S.orders.map(o=>`<div class="row"><div><b>${esc(o.orderNumber)}</b><div class="note" style="margin:0">${new Date(o.createdAt).toLocaleDateString(dloc())}</div></div><span class="mono">${esc(t('status_'+o.orderStatus))}</span><b>${money(o.total,o.currency)}</b></div>`).join(''):`<div class="empty">${esc(t('noOrders'))}</div>`}
  <div style="display:grid;gap:8px;margin-top:20px"><a class="btn wide" href="#/contact" onclick="closeAll()">${tx('navContact')}</a><a class="btn wide" href="#/policies" onclick="closeAll()">${tx('navPolicies')}</a><button class="btn wide" id="logoutBtn">${esc(t('logout'))}</button></div>`:`<div class="empty">${esc(t('signInOrders'))}</div><button class="btn primary wide" style="margin-top:16px" onclick="closeAll();go('')">${tx('signInCta')}</button>`;const lb=$('#logoutBtn');if(lb)lb.onclick=logout}

/* ================= LAYERS ================= */
function openL(id){$('#'+id).classList.add('on');$('#ov').classList.add('on');document.body.classList.add('lock')}
function closeL(id){$('#'+id).classList.remove('on');if(!$$('.drawer.on,.modal.on').length){$('#ov').classList.remove('on');document.body.classList.remove('lock')}}
function closeAll(){$$('.drawer.on,.modal.on').forEach(e=>{if(e.id!=='mProcessing')closeL(e.id)});$('#mnav').classList.remove('on')}
$$('[data-close]').forEach(b=>b.onclick=()=>closeL(b.closest('.drawer,.modal').id));$('#ov').onclick=closeAll;
$$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m&&m.id!=='mProcessing')closeL(m.id)}));addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
$('#bagBtn').onclick=()=>{renderBag();openL('bag')};$('#accBtn').onclick=()=>{if(!S.customer&&!S.preview){go('');return}renderAccount();openL('account');refreshAccount()};
$('#menuBtn').onclick=()=>{renderMenu();$('#mnav').classList.add('on')};
$('#visBtn').onclick=()=>{const ids=enabledThemes().map(x=>x.id);if(!ids.length)return;S.theme=ids[(ids.indexOf(S.theme)+1)%ids.length];try{sessionStorage.setItem('temporary_theme',S.theme)}catch(_){}applyTheme();render(true)};
$$('.lang').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

/* ================= AUTH ================= */
function loadGsi(){return new Promise(r=>{if(window.google?.accounts?.id)return r(true);const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>r(true);s.onerror=()=>r(false);document.head.appendChild(s)})}
async function initGoogle(){$('#authNote').textContent=t('authWorking');if(!await loadGsi()){$('#retryAuth').style.display='inline-flex';$('#authNote').textContent=t('networkError');return}
  google.accounts.id.initialize({client_id:(S.B&&S.B.config.googleClientId)||'32171492706-n6rli6equ2e0es8ac15npdcrhctlq2bn.apps.googleusercontent.com',callback:async r=>{$('#authNote').textContent=t('authWorking');try{const d=await bridge('googleauth',{credential:r.credential,deviceId:deviceId()});S.token=d.sessionToken;store.set(CFG.SESSION_KEY,S.token);S.customer=d.customer;await afterLogin()}catch(e){$('#authNote').textContent=errText(e);$('#retryAuth').style.display='inline-flex'}}});
  google.accounts.id.renderButton($('#gSlot'),{theme:'outline',size:'large',shape:'pill',text:'continue_with',width:300,locale:S.lang});$('#authNote').textContent=t('authReady')}
async function afterLogin(){S.authPending=false;try{const ctx=await auth('context');S.customer=ctx.customer;S.cart=ctx.cart}catch(_){}renderBag();renderAccount();render(true);refreshAccount();track('PAGE_VIEW')}
async function logout(){try{await auth('logout')}catch(_){}store.del(CFG.SESSION_KEY);S.token='';S.customer=null;S.orders=[];S.cart={items:[],subtotal:0,itemCount:0,currency:cur()};closeAll();renderBag();go('');render(true);initGoogle()}
$('#retryAuth').onclick=()=>{$('#retryAuth').style.display='none';initBridge();initGoogle()};

/* ================= CONFIRMATION PAGE (links in order emails) ================= */
async function confirmationPage(token){document.documentElement.dataset.theme='main';$('#gate').style.display='none';$('#app').style.display='none';$('#confirmPage').classList.add('on');const btn=$('#cpBtn');
  const paint=()=>{$('#cpTitle').textContent=t('confirmationPageTitle');$('#cpCopy').textContent=t('confirmationPageCopy');btn.textContent=t('confirmationPageButton');$('#cpShop').textContent=t('confirmationPageShop')};paint();$('#cpStatus').textContent='…';
  const show=st=>{const m={CONFIRMED:'confirmationConfirmed',ALREADY_CONFIRMED:'confirmationAlready',EXPIRED:'confirmationExpired',CANCELED:'confirmationExpired'};$('#cpStatus').textContent=t(m[st]||'confirmationInvalid');btn.disabled=true};
  publicGet('sitebundle',15000).then(b=>{useBundle(b);applyLang();paint()}).catch(()=>{});
  try{const d=await bridge('confirmationdata',{token});$('#cpOrder').innerHTML=`<div class="row"><span>#</span><b>${esc(d.orderNumber)}</b></div><div class="row"><span>${esc(t('total'))}</span><b>${money(d.total,d.currency)}</b></div>`;
    if(d.status!=='PENDING')return show(d.status);$('#cpStatus').textContent=`${t('confirmBy')} ${new Date(d.expiresAt).toLocaleString(dloc())}`;btn.disabled=false;
    btn.onclick=async()=>{btn.disabled=true;btn.classList.add('busy');try{const r=await bridge('confirmorder',{token});show(r.status)}catch(e){$('#cpStatus').textContent=errText(e);btn.disabled=e.code==='CONFIRMATION_ORDER_EXPIRED'}finally{btn.classList.remove('busy')}}}
  catch(e){$('#cpStatus').textContent=e.code?errText(e):t('confirmationInvalid')}}

/* ================= ADMIN PREVIEW (parity: admin drafts rendered by THIS code) ================= */
function applyPreview(d){if(Array.isArray(d.placements)){d.placements.forEach(p=>S.ovP.set(pk(p.productId,p.color,p.artworkType,p.designId,p.side,p.printSize),p))}
  if(Array.isArray(d.collectionMockups)){S.ovC=d.collectionMockups.map(r=>({...r,themeId:String(r.themeId||'').toLowerCase()}))}
  if(d.content&&typeof d.content==='object')S.ovT={en:d.content.en||{},ar:d.content.ar||{}};
  if(d.policy&&d.policy.slug)S.ovPol={[d.policy.slug]:d.policy};
  if(d.lang&&d.lang!==S.lang){S.lang=d.lang==='ar'?'ar':'en'}
  if(d.theme&&enabledThemes().some(x=>x.id===d.theme)){S.theme=d.theme}
  if(d.route!=null&&('#/'+d.route)!==location.hash){location.hash='#/'+d.route;}else renderAll(true);
  if(d.open){if(!$('#mCustom').classList.contains('on'))openCustomizer(d.open.productId,d.open);else{Object.assign(S.sel,d.open);renderCustomizer()}}
  if(d.scrollTo){const el=document.getElementById(d.scrollTo)||$('#grid');el&&el.scrollIntoView()}}

/* ================= BOOT ================= */
(async function boot(){
  applyLang();initBridge();
  if(/^#confirmorder/i.test(location.hash||'')){const tok=new URLSearchParams((location.hash.split('?')[1])||'').get('token');return confirmationPage(tok||'')}
  try{const cached=JSON.parse(store.get(CFG.BUNDLE_KEY)||'null');if(cached&&cached.catalog){useBundle(cached)}}catch(_){}
  if(S.token&&!S.preview)S.authPending=true;
  renderAll(false);
  const live=loadBundle().then(()=>startSync()).catch(()=>toast(t('networkError'),true));
  if(S.preview){$('#syncBadge').textContent='ADMIN PREVIEW';await live;renderAll(true);return}
  if(S.token){try{const d=await bridge('sessionbootstrap',{sessionToken:S.token},30000);S.customer=d.customer;await afterLogin();return}catch(e){S.authPending=false;if(['SESSION_INVALID','SESSION_EXPIRED','SESSION_REVOKED','CUSTOMER_NOT_FOUND','AUTH_REQUIRED'].includes(e.code)){store.del(CFG.SESSION_KEY);S.token=''}render(true)}}
  await live.catch(()=>{});initGoogle();
})();
</script>
